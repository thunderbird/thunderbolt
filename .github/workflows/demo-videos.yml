name: Demo videos

on:
  pull_request:
    paths:
      - '.agents/skills/thunder-demo-videos/**'
      - '.github/workflows/demo-videos.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.agents/skills/thunder-demo-videos/**'
      - '.github/workflows/demo-videos.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: demo-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/demo-env"
          "$RUNNER_TEMP/demo-env/bin/pip" install -r .agents/skills/thunder-demo-videos/scripts/requirements.txt
      - name: Test media exports and real PTY capture
        run: DEMO_PYTHON="$RUNNER_TEMP/demo-env/bin/python" bun run test:demo-videos
