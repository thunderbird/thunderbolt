appId: net.thunderbird.thunderbolt.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Want early access?
    timeout: 300000
- waitForAnimationToEnd
# Each retry block re-checks its own outcome. The simulator can drop a focus tap, and inputText
# types anyway; eraseText stops a partial try doubling up. Maestro aims a tap with the
# hierarchy read before it settles, so the model sheet sliding into place can take the tap
# on a neighbouring row ("Add Model").
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: Email
          retryTapIfNoChange: true
      - eraseText
      - inputText: ${EMAIL}
      - assertVisible: ${EMAIL}
- tapOn: Continue
- extendedWaitUntil:
    visible: Check your email
    timeout: 120000
- inputText: 12345678
- extendedWaitUntil:
    visible: DeepSeek V4.1 Flash
    timeout: 120000
- retry:
    maxRetries: 2
    commands:
      # Counts as an interaction, so it restores the lookup time a failed attempt used up.
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: Close
          commands:
            - tapOn: Close
      - runFlow:
          when:
            notVisible: Choose model
          commands:
            - tapOn: 'GLM 5.3.*|Opus 5'
      - waitForAnimationToEnd
      - tapOn: Opus 5
      - assertNotVisible: Choose model
      - assertVisible: Opus 5
- retry:
    maxRetries: 2
    commands:
      - tapOn: Ask me anything…
      - eraseText
      - inputText: Please greet me briefly.
      - assertVisible:
          text: Send message
          enabled: true
- tapOn: Send message
- extendedWaitUntil:
    visible: Hello from the fake provider, one word at a time.
    timeout: 60000
