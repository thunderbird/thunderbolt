# Run by `verify.ts` after Cloud sign-in on the onboarding build. Privacy was accepted before choosing Cloud;
# skip the optional Google connection only when the finding needs a later screen. verify.ts adds its next text
# to the `when` as `notVisible`.
- extendedWaitUntil:
    visible: Onboarding Wizard
    timeout: 120000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: Connect Google
    commands:
      - tapOn: Skip
      - extendedWaitUntil:
          visible: What should we call you?
          timeout: 30000
      - waitForAnimationToEnd
