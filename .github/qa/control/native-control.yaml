# Run by `native.sh control` on the calibration build, which pins a button over the lower half of any focused text
# field (cover.js). A finding's `repro_flow` for the replay is this same text.
- launchApp
- extendedWaitUntil:
    visible: Connect your AI|Welcome to Thunderbolt!
    timeout: 120000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: I agree to the Privacy Policy.*
    commands:
      - tapOn: I agree to the Privacy Policy.*
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Choose your setup
          timeout: 120000
- runFlow:
    when:
      visible: Connect your AI
    commands:
      - tapOn: Toggle Sidebar
      - tapOn: Sign in
- extendedWaitUntil:
    visible: Cloud \(Waitlist\)
    timeout: 120000
- tapOn: Cloud \(Waitlist\)
# The app stops waiting for the server after 5 s and shows "Couldn't reach Thunderbolt Cloud" with Continue to try
# again. A slow first request can hit that, so Continue is tapped again only while the waitlist form is missing.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: Want early access?
          commands:
            - tapOn: Continue
      - extendedWaitUntil:
          visible: Want early access?
          timeout: 30000
- waitForAnimationToEnd
- tapOn:
    text: Email
    retryTapIfNoChange: true
- waitForAnimationToEnd
