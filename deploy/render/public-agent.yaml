# Render Blueprint for a public, anonymous Thunderbolt deployment with a hosted
# agent: one static site, one backend, one Postgres. There is no PowerSync,
# because anonymous sessions never sync.
#
# Nothing about a particular agent purpose lives here. Per-deployment values
# (hostnames, keys, the agent's prompt and identity, quotas) are `sync: false`,
# so Render asks for them once when the Blueprint is created and never
# overwrites them afterwards. Custom domains are added in the dashboard for the
# same reason. Once they are attached, disable each service's onrender.com
# subdomain in the dashboard (Render refuses to do it from a Blueprint with no
# domain in the file), so the custom hostnames are the only way in.
#
# Render matches services by name across the whole workspace, so these names
# must never collide with production's (`thunderbolt`, `thunderbolt-cloud`,
# `thunderbolt-postgres`). It also means one live deployment of this file at a
# time.
#
# The file names no project or environment, so nothing event-specific lives
# in it. After creating the Blueprint, make the event's environment under the
# Thunderbolt project in the dashboard and move these three resources into it.
# Render keeps a top-level resource's environment across later syncs.
#
# Validate: render blueprints validate deploy/render/public-agent.yaml
version: "1"
services:
  - type: web
    name: public-agent-web
    runtime: static
    repo: https://github.com/thunderbird/thunderbolt
    branch: main
    buildCommand: bun install; NODE_OPTIONS="--max-old-space-size=4096" bun run build
    staticPublishPath: dist
    envVars:
      # Without it Render builds with its default Bun for the service's creation date.
      - key: BUN_VERSION
        value: "1.4.4"
      # Build time: Vite inlines these into the bundle.
      - key: VITE_THUNDERBOLT_CLOUD_URL
        sync: false # the backend's public URL, ending in /v1
      - key: VITE_AUTH_ENABLE_ANONYMOUS
        value: "true"
      - key: VITE_BYPASS_WAITLIST
        value: "true"
      - key: VITE_SKIP_ONBOARDING
        value: "true"
      # `altcha` to solve a captcha before anonymous sign-in. Set it and the
      # env group's CAPTCHA_PROVIDER together: both or neither.
      - key: VITE_CAPTCHA_PROVIDER
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # COOP + COEP make the page cross-origin isolated, which the local
      # database needs for SharedArrayBuffer. Without them the app won't start.
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Nothing embeds a public agent, so refuse framing outright.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /index.html
        name: Cache-Control
        value: max-age=0, must-revalidate, public
      # Files under /assets are content-hashed, so a new build gets new names.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    autoDeployTrigger: commit

  - type: web
    name: public-agent-api
    runtime: node
    repo: https://github.com/thunderbird/thunderbolt
    branch: main
    rootDir: backend
    region: ohio
    plan: standard
    buildCommand: bun install; bun run build
    startCommand: bun run start
    # The open liveness route. /v1/health/* is gated on MONITORING_TOKEN, which a
    # Render health check can't send.
    healthCheckPath: /v1/health
    # One instance running one process. The hosted agent allows a visitor one
    # paid run at a time but tracks that per process, so a second instance or
    # worker lets parallel runs slip past the spending cap. Scale out once the
    # agent has a shared run lock.
    numInstances: 1
    envVars:
      - key: BUN_VERSION
        value: "1.4.4" # see public-agent-web
      - key: DATABASE_URL
        fromDatabase:
          name: public-agent-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1" # one worker; see numInstances
      # What makes this a public, anonymous, single-agent deployment.
      - key: NODE_ENV
        value: production
      - key: AUTH_ALLOW_ANONYMOUS
        value: "true"
      - key: ALLOW_CUSTOM_AGENTS
        value: "false"
      - key: ALLOW_ANONYMOUS_AGENT_DISCOVERY
        value: "true"
      # All traffic to a Render web service passes through Cloudflare, which
      # overwrites CF-Connecting-IP with the caller's address. Without this the
      # API sees Render's proxy as every visitor, so they all share one
      # anonymous sign-in budget.
      - key: TRUSTED_PROXY
        value: cloudflare
      # Per deployment, asked for once at creation. They sit on the service, not
      # in an env group, because Render ignores `sync: false` in a group.
      - key: APP_URL
        sync: false # the site's public URL
      - key: BETTER_AUTH_URL
        sync: false # the backend's public URL
      - key: CORS_ORIGINS
        sync: false # the site's public URL
      - key: ANTHROPIC_API_KEY
        sync: false # a key scoped to this deployment, never production's
      - key: TINFOIL_API_KEY
        sync: false # the built-in agent's default model runs on Tinfoil
      - key: FIREWORKS_API_KEY
        sync: false # when AGENT_MODEL is a Fireworks model
      - key: POSTHOG_API_KEY
        sync: false # this deployment's own PostHog project, never production's
      - key: POSTHOG_HOST
        sync: false
      # The hosted agent. sync: false because these are set per deployment and
      # tuned mid-event.
      - key: AGENT_ENABLED
        sync: false
      - key: DISABLE_BUILT_IN_AGENT
        sync: false
      - key: MINIMAL_MODE
        sync: false # `true` for the chat-only shell
      - key: BRAND_LOGO_URL
        sync: false # `https:` or `data:image/` URL shown in the header
      - key: BRAND_LOGO_DARK_URL
        sync: false # dark-theme variant, optional
      - key: BRAND_LOGO_ALT
        sync: false # logo alt text
      - key: ENABLED_AGENTS
        sync: false # `hosted-agent` to offer only the hosted agent
      - key: AGENT_MODEL
        sync: false
      - key: AGENT_MAX_STEPS
        sync: false
      - key: AGENT_FIREWORKS_SERVICE_TIER
        sync: false
      - key: AGENT_SYSTEM_PROMPT
        sync: false
      - key: AGENT_MCP_SERVERS
        sync: false
      - key: AGENT_NAME
        sync: false
      - key: AGENT_DESCRIPTION
        sync: false
      - key: AGENT_ICON
        sync: false
      - key: AGENT_TIMEZONE
        sync: false # the venue's IANA zone, so the agent knows the local date and hour
      # Operator branding, also set per deployment. BRANDING is the JSON object
      # from docs/self-hosting/configuration.md#branding, pasted as is.
      - key: BRANDING
        sync: false
      - key: INFERENCE_QUOTA_ANONYMOUS_5H_CENTS
        sync: false
      - key: INFERENCE_QUOTA_ANONYMOUS_7D_CENTS
        sync: false
      # Captcha on anonymous sign-in. Set both or neither: CAPTCHA_PROVIDER=altcha
      # here and VITE_CAPTCHA_PROVIDER=altcha on the static site, or the API
      # refuses every anonymous sign-in. ALTCHA_SECRET: openssl rand -hex 32.
      - key: CAPTCHA_PROVIDER
        sync: false
      - key: ALTCHA_SECRET
        sync: false
      # Anonymous sign-ins per client IP, 10 per 60 s by default. Without
      # CAPTCHA_PROVIDER=altcha the API refuses to start with a looser limit
      # (MAX above 10 or WINDOW_SECS below 60).
      - key: ANONYMOUS_SIGN_IN_RATE_LIMIT_MAX
        sync: false
      - key: ANONYMOUS_SIGN_IN_RATE_LIMIT_WINDOW_SECS
        sync: false
      # Anonymous sign-ins across the whole deployment, 2000 per 3600 s by
      # default. Once it runs out, no new visitor can start a session until the
      # window resets.
      - key: ANONYMOUS_SIGN_IN_GLOBAL_RATE_LIMIT_MAX
        sync: false
      - key: ANONYMOUS_SIGN_IN_GLOBAL_RATE_LIMIT_WINDOW_SECS
        sync: false
      # Days before an idle visitor's account and usage records are deleted,
      # 30 by default; 0 keeps them until the database is deleted.
      - key: ANONYMOUS_USER_IDLE_DAYS
        sync: false
    autoDeployTrigger: commit

databases:
  - name: public-agent-db
    databaseName: thunderbolt
    user: thunderbolt
    plan: basic-1gb
    region: ohio
    postgresMajorVersion: "18"
    diskSizeGB: 15
    ipAllowList: [] # private network only; the backend connects internally
