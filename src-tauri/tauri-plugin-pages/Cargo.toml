[package]
name = "tauri-plugin-pages"
version = "0.1.0"
description = "Isolated mobile browser surfaces for Thunderbolt pages."
authors = ["Thunderbolt"]
license = "MPL-2.0"
edition = "2021"
links = "tauri-plugin-pages"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
