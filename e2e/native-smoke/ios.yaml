appId: net.thunderbird.thunderbolt.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Want early access?
    timeout: 300000
- waitForAnimationToEnd
# The simulator can drop the focus tap, and inputText types anyway, so both retry
# blocks run tap → type → assert as a unit. eraseText stops a partial try doubling up.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: Email
          retryTapIfNoChange: true
      - eraseText
      - inputText: ${EMAIL}
      - assertVisible: ${EMAIL}
- tapOn: Continue
- extendedWaitUntil:
    visible: Check your email
    timeout: 120000
- inputText: 12345678
- extendedWaitUntil:
    visible: GLM 5.3 Flash
    timeout: 120000
- tapOn: GLM 5.3 Flash
- tapOn: Opus 5
- retry:
    maxRetries: 2
    commands:
      - tapOn: Ask me anything…
      - eraseText
      - inputText: Please greet me briefly.
      - assertVisible:
          text: Send message
          enabled: true
- tapOn: Send message
- extendedWaitUntil:
    visible: Hello from the fake provider, one word at a time.
    timeout: 60000
