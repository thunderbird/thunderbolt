[package]
name = "thunderbolt"
version = "0.1.162"
description = "Privacy-respecting AI assistant."
authors = ["Chris Roth <chris@cjroth.com>"]
license = "MPL-2.0"
edition = "2021"
default-run = "thunderbolt"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thunderbolt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["plugins/tauri-plugin-passkey", "tauri-plugin-pages"]
default-members = ["."]
exclude = ["vendor/tauri"]

[patch.crates-io]
tauri = { path = "vendor/tauri" }

[[bin]]
name = "thunderbolt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [
    "tray-icon",
    "devtools",
    "unstable",            # Required for webview
    "macos-private-api",   # Required for the transparent window + sidebar vibrancy
] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.99"
tokio = { version = "1.52.3", features = ["process", "io-util", "sync", "time", "macros"] }
tempfile = "3"
libc = "0.2"
base64 = "0.22"

# CLI installer: download the prebuilt `thunderbolt` binary + SHA256SUMS and
# verify the checksum before install. rustls (no OpenSSL) matches the rest of the
# app's TLS stack; all three are already transitive deps so no new versions land.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-devtools = "2.0.1"
# unsafe-headers lets native-fetch.ts send an empty Origin, which the plugin then strips; without it the
# plugin always sends the webview Origin, and MCP servers that guard against DNS rebinding answer 403.
tauri-plugin-http = { version = "2.5.9", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "charset", "macos-system-configuration", "unsafe-headers"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.4.4"
tauri-plugin-deep-link = "2.4"
tauri-plugin-haptics = "2.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-store = "2.4.3"
# Native WebAuthn passkey ceremonies (iOS, macOS, Android, Windows); no-op stub on Linux.
tauri-plugin-passkey = { path = "plugins/tauri-plugin-passkey" }
tauri-plugin-pages = { path = "tauri-plugin-pages" }

# Used only in debug builds to install a rustls crypto provider before
# tauri-plugin-devtools' reqwest stack initializes (otherwise iOS dev panics
# at first HTTPS call: "No provider set"). Already a transitive dep via reqwest.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "~2.7.3"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKNavigation", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSImage", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSView", "NSClipView", "NSWindow", "objc2-core-graphics", "block2"] }
objc2-foundation = "0.3.2"
block2 = "0.6.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_10"] }
gtk = "0.18.2"
cairo-rs = { version = "0.18.5", features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", features = ["UIApplication", "UIWindow", "UIView", "UIInterface", "UIScene", "UIWindowScene"] }
objc2-foundation = "0.3.2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
