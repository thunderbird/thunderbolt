name: Preview Destroy

# Destroys the per-PR preview stack when the PR is closed/merged.
# Also supports manual teardown via workflow_dispatch (e.g. to clean up an orphan
# or force-destroy a stack outside normal PR lifecycle).
#
# Same-repo PRs tear down on close. A fork PR's close event has no secrets, so
# its stack (only exists if a maintainer dispatched one) is removed by the
# hourly preview-cleanup.yml.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose preview stack to destroy (e.g. 123 for preview-pr-123)'
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  resolve-pr:
    # A fork PR's close event gets no secrets; the hourly preview-cleanup.yml removes its stack.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve PR number
        id: resolve
        env:
          PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_NUMBER_FROM_DISPATCH: ${{ inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER_FROM_DISPATCH" ]; then
            echo "pr_number=$PR_NUMBER_FROM_DISPATCH" >> $GITHUB_OUTPUT
          else
            echo "pr_number=$PR_NUMBER_FROM_EVENT" >> $GITHUB_OUTPUT
          fi

  # stack-deploy's destroy job drops the PR's databases before `pulumi destroy`.
  destroy:
    needs: resolve-pr
    if: ${{ needs.resolve-pr.result == 'success' }}
    uses: ./.github/workflows/stack-deploy.yml
    with:
      action: destroy
      platform: fargate
      region: us-east-1
      stack_name: preview-pr-${{ needs.resolve-pr.outputs.pr_number }}
    # Destroy only needs AWS credentials and Pulumi authentication.
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

  comment:
    needs: [resolve-pr, destroy]
    if: ${{ always() && needs.resolve-pr.result == 'success' && github.event.pull_request.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Update sticky comment to note teardown
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-env
          # Path-gated PRs never had a preview, so leave them without a teardown note.
          only_update: true
          message: |
            ${{ needs.destroy.result == 'success' && '**Preview environment destroyed** 🧹' || needs.destroy.result == 'cancelled' && '**Preview teardown handed to the hourly cleanup** 🧹' || '**Preview teardown failed** ⚠️' }}

            ${{ needs.destroy.result == 'success' && format('Stack `preview-pr-{0}` and its Cloudflare subdomain have been cleaned up.', needs.resolve-pr.outputs.pr_number) || format('Stack `preview-pr-{0}`, its databases or its PowerSync slot may be left behind. See the [run]({1}/{2}/actions/runs/{3}).', needs.resolve-pr.outputs.pr_number, github.server_url, github.repository, github.run_id) }}
