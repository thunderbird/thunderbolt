<!doctype html>
<html lang="en">
  <head>
    <title>Focus covered</title>
    <style>
      body {
        margin: 0;
      }
      input {
        position: absolute;
        top: 100px;
        left: 20px;
        width: 300px;
        height: 44px;
        box-sizing: border-box;
      }
      #bar {
        position: fixed;
        top: 132px;
        left: 200px;
        right: 0;
        height: 60px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <input placeholder="Name" autofocus />
    <!-- The iOS onboarding geometry: the bar's top hides the lower 12 px of the field from just right of its center
         on, so the center the covered check tests stays free. -->
    <div id="bar"><button>Back</button><button>Continue</button></div>
  </body>
</html>
