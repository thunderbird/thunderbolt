{{- include "thunderbolt.validateOidc" . }}
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
spec:
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      {{- include "thunderbolt.podAnnotations" (dict "component" .Values.backend "root" .) | nindent 6 }}
    spec:
      {{- include "thunderbolt.imagePullSecrets" . | nindent 6 }}
      {{- include "thunderbolt.nodeSelector" . | nindent 6 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8000"
            - name: AUTH_MODE
              value: {{ .Values.backend.env.authMode }}
            - name: WAITLIST_ENABLED
              value: {{ .Values.backend.env.waitlistEnabled | quote }}
            - name: DATABASE_DRIVER
              value: {{ .Values.backend.env.databaseDriver }}
            # THUNDERBOLT_POSTGRES_PASSWORD must appear before DATABASE_URL so the
            # `$(THUNDERBOLT_POSTGRES_PASSWORD)` substitution resolves (Kubernetes
            # dependent environment variables — earlier entries are interpolated into
            # later ones via `$(VAR)`, which is k8s syntax, not the shell).
            #
            # The name is intentionally namespaced: bare `POSTGRES_PASSWORD` is
            # auto-consumed by libpq tools (psql, pgcli, pg_dump). A future sidecar
            # or `kubectl exec` in this pod would silently inherit superuser
            # credentials. Namespacing prevents that.
            #
            # NOTE: the decoded postgres password must be URL-safe. URL-reserved
            # chars (`@:/?#`) silently break this DATABASE_URL (and the equivalent
            # URIs in templates/powersync.yaml).
            - name: THUNDERBOLT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.credentials.user }}:$(THUNDERBOLT_POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.credentials.database }}?sslmode={{ .Values.postgres.sslmode | default "disable" }}"
            {{- /* Guarded by thunderbolt.validateOidc at the top of this file. */}}
            {{- $external := ne (.Values.oidc.issuer | default "") "" }}
            {{- $issuer := ternary .Values.oidc.issuer (printf "%s/realms/thunderbolt" .Values.appUrl) $external }}
            {{- $keycloakDiscovery := printf "http://keycloak:%v/realms/thunderbolt/.well-known/openid-configuration" .Values.keycloak.service.port }}
            {{- /*
              Set explicitly rather than left to the backend, which needs the
              internal address for the bundled Keycloak. Trailing slashes are
              stripped, as OIDC Discovery requires: several providers, Authentik
              among them, publish issuer URLs with one.
            */}}
            {{- $externalDiscovery := printf "%s/.well-known/openid-configuration" (trimSuffix "/" .Values.oidc.issuer) }}
            {{- $discovery := .Values.oidc.discoveryUrl | default (ternary $externalDiscovery $keycloakDiscovery $external) }}
            # OIDC_ISSUER must equal the `issuer` field of the provider's discovery
            # document byte-for-byte, i.e. the browser-facing URL. When the backend
            # reaches the provider at a different hostname than the browser does
            # (e.g. the bundled in-cluster Keycloak), OIDC_DISCOVERY_URL carries
            # that internal address instead.
            - name: OIDC_ISSUER
              value: {{ $issuer | quote }}
            - name: OIDC_DISCOVERY_URL
              value: {{ $discovery | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | default .Values.keycloak.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: oidc-client-secret
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: better-auth-secret
            - name: BETTER_AUTH_URL
              value: {{ .Values.appUrl }}
            - name: APP_URL
              value: {{ .Values.appUrl }}
            {{- $origins := list .Values.appUrl }}
            {{- if $external }}
            {{- $u := urlParse .Values.oidc.issuer }}
            {{- $origins = append $origins (printf "%s://%s" $u.scheme $u.host) }}
            {{- if .Values.oidc.discoveryUrl }}
            {{- $d := urlParse .Values.oidc.discoveryUrl }}
            {{- $origins = append $origins (printf "%s://%s" $d.scheme $d.host) }}
            {{- end }}
            {{- else }}
            {{- $origins = append $origins (printf "http://keycloak:%v" .Values.keycloak.service.port) }}
            {{- end }}
            # The identity provider's origin must be trusted so Better Auth's SSO
            # plugin accepts its discovery/token/jwks endpoints when fetching them
            # server-to-server (see backend/src/auth/auth.ts, `trustedOrigins`).
            #
            # CSRF protection is not weakened by this entry: the `Origin` request header
            # is on the Fetch-spec Forbidden Header list, so JS in a browser cannot forge
            # it. Browser-mediated attackers can only present their own page's real Origin.
            # Primary CSRF defenses (SameSite cookies + `X-Challenge-Token` custom header
            # on sensitive endpoints) are unaffected.
            - name: TRUSTED_ORIGINS
              value: {{ concat $origins (.Values.oidc.extraTrustedOrigins | default list) | uniq | join "," | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.appUrl }}
            # POWERSYNC_URL is echoed straight to the browser for real-time sync, so it
            # must be browser-reachable. Unlike every other in-cluster service URL on
            # this page, it can NOT be the internal DNS name. It follows whichever
            # ingress mode is configured: the dedicated hostname when one is set, and
            # otherwise the app's own path-based route (templates/ingress.yaml strips
            # the `/powersync` prefix). `backend.env.powersyncUrl` overrides both.
            {{- $psHost := "" }}
            {{- with .Values.ingress.hostnames }}{{ $psHost = .powersync | default "" }}{{ end }}
            {{- $psScheme := hasPrefix "https://" (lower .Values.appUrl) | ternary "https" "http" }}
            {{- $psDefault := ternary (printf "%s://%s" $psScheme $psHost) (printf "%s/powersync" (trimSuffix "/" .Values.appUrl)) (not (empty $psHost)) }}
            - name: POWERSYNC_URL
              value: {{ .Values.backend.env.powersyncUrl | default $psDefault | quote }}
            # Server-side target for GET /v1/health/powersync. POWERSYNC_URL now points
            # at the public ingress, which this pod should not have to hairpin through,
            # so the probe keeps using the in-cluster service.
            - name: POWERSYNC_INTERNAL_URL
              value: {{ .Values.backend.env.powersyncInternalUrl | default (printf "http://powersync:%v" .Values.powersync.service.port) | quote }}
            - name: POWERSYNC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: powersync-jwt-secret
            - name: POWERSYNC_JWT_KID
              value: {{ .Values.powersync.jwt.kid }}
            - name: RATE_LIMIT_ENABLED
              value: {{ .Values.backend.env.rateLimitEnabled | quote }}
            - name: MIN_APP_VERSION
              value: {{ .Values.backend.env.minAppVersion | quote }}
            - name: CLI_DEVICE_REGISTRATION_ENABLED
              value: {{ .Values.backend.env.cliDeviceRegistrationEnabled | quote }}
            - name: THUNDERBOLT_INFERENCE_URL
              value: {{ .Values.backend.env.thunderboltInferenceUrl | default "" | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: anthropic-api-key
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: fireworks-api-key
            - name: THUNDERBOLT_INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: thunderbolt-inference-api-key
            - name: EXA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: thunderbolt-secrets
                  key: exa-api-key
          {{- include "thunderbolt.resources" .Values.backend.resources | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
