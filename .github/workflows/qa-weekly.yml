name: QA weekly

# An AI agent uses the app like a person would, one charter per session, plus a free session that plays one case
# on every platform. Deterministic code then replays, judges, files and (optionally) fixes what it found. How it
# works, the secrets and variables, and the rule for calibrating the caps below: .github/qa/README.md.
#
# Trust zones: explore and replay run untrusted, model-written input, so they hold no Linear key and no write
# token. The replay step holds no secret at all: in the real-AI leg the provider keys sit with a backend that runs as
# another OS user, and the job's own user loses root first. Only build and cache-system-image save caches, because
# they run before any untrusted code; every other job only restores them, and setup-bun's own cache is off because
# its save runs after the job's steps. The jobs that check a fix's patch hold no secret, except verify-real, whose
# provider keys go to a backend from a fresh checkout that never ran the patch.
#
# Linux jobs are pinned to ubuntu-24.04, not ubuntu-latest: the stack relies on that image's AppArmor sysctl, KVM
# and emulator libraries, Playwright dependencies and qa-dev user. Moving to a newer image is a deliberate change.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be filed and published instead of writing to Linear and GitHub
        type: boolean
        default: true
      charters:
        description: >-
          Comma-separated charter ids (every platform), session ids (one platform), or free, e.g.
          c4-skills-projects,c2-chat-power-user-phone,free (empty = all). Ignored when fix_from_run is set
        type: string
        default: ''
      journey:
        description: Case id from .github/qa/journeys.json for the free session (empty = this week's)
        type: string
        default: ''
      canaries:
        description: Comma-separated commit SHAs to revert as the canaries, at most 2 (empty = pick automatically)
        type: string
        default: ''
      autofix:
        description: Let the fix agent attempt confirmed bugs (also needs vars.QA_AUTOFIX_ENABLED)
        type: boolean
        default: false
      native_control:
        description: Also run the positive control of the native layout check on iOS and Android
        type: boolean
        default: false
      app_check:
        description: Only check the GitHub App credentials and permissions, run nothing else
        type: boolean
        default: false
      fix_from_run:
        description: >-
          Id of an earlier run (its artifacts last 7 days) whose filed tickets to fix again. Skips explore, filing
          and the canaries, ignores `charters`, and turns autofix on
        type: string
        default: ''

concurrency:
  group: qa-weekly
  cancel-in-progress: false

permissions: {}

env:
  QA_EXPLORE_MAX_BUDGET_USD: 4.01
  QA_EXPLORE_MAX_TURNS: 552
  QA_EXPLORE_TIMEOUT_MINUTES: 63
  QA_FIX_MAX_BUDGET_USD: 20
  QA_FIX_MAX_TURNS: 200
  QA_FIX_TIMEOUT_MINUTES: 60

jobs:
  build:
    if: vars.QA_AGENT_ENABLED == 'true' && !inputs.app_check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Looks up the run a fix-only run fixes from.
      actions: read
      contents: read
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      nativeLegs: ${{ steps.plan.outputs.nativeLegs }}
      nativeBuilds: ${{ steps.plan.outputs.nativeBuilds }}
      verify: ${{ steps.plan.outputs.verify }}
      nativeVerify: ${{ steps.plan.outputs.nativeVerify }}
      judge: ${{ steps.plan.outputs.judge }}
      live: ${{ steps.plan.outputs.live }}
      autofix: ${{ steps.plan.outputs.autofix }}
      canaries: ${{ steps.canaries.outputs.count }}
    steps:
      # That run's artifacts reach the fix agent and publish, so only a scheduled or dispatched run of this workflow
      # on main counts: a fork's pull request and a branch both run workflow files of their own.
      - name: Check the run to fix from
        if: inputs.fix_from_run
        env:
          FIX_FROM_RUN: ${{ inputs.fix_from_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$FIX_FROM_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::fix_from_run takes a run id, digits only."
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIX_FROM_RUN" \
            --jq '[.path, .event, .head_branch, .head_repository.full_name, .head_sha] | join(" ")')
          case "${run% *}" in
            ".github/workflows/qa-weekly.yml schedule main $GITHUB_REPOSITORY" | \
              ".github/workflows/qa-weekly.yml workflow_dispatch main $GITHUB_REPOSITORY") ;;
            *)
              echo "::error::Run $FIX_FROM_RUN is not a scheduled or dispatched run of this workflow on main."
              exit 1
              ;;
          esac
          # A tag named main also reports head_branch main, so the run's commit must be on the main branch itself.
          # The full ref, since the bare name would resolve to that tag.
          case "$(gh api "repos/$GITHUB_REPOSITORY/compare/${run##* }...refs/heads/main" --jq .status)" in
            ahead | identical) ;;
            *)
              echo "::error::Run $FIX_FROM_RUN ran a commit that is not on main."
              exit 1
              ;;
          esac
          # A pattern download of expired artifacts finds nothing and still succeeds, so this fails before the builds.
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIX_FROM_RUN/artifacts?name=qa-filed" \
            --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx qa-filed; then
            echo "::error::Run $FIX_FROM_RUN has no qa-filed artifact left. Artifacts last 7 days."
            exit 1
          fi

      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the build job needs main's history, to pick the canaries. A string: a bare 0 is falsy here.
          fetch-depth: ${{ github.job == 'build' && '0' || '1' }}

      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          # Its post step saves ~/.bun/bin after the job's steps, which in most jobs include model-written code.
          no-cache: true

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &bun-cache
          path: |
            ~/.bun/install/cache
            node_modules
            backend/node_modules
          key: qa-bun-${{ hashFiles('bun.lock', 'backend/bun.lock') }}

      - &install
        name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &browser-cache
          path: ~/.cache/ms-playwright
          key: qa-browsers-${{ hashFiles('bun.lock') }}-mcp-0.0.83

      - &install-browsers
        name: Install browsers
        timeout-minutes: 10
        # Two installs: the repo's Playwright replays specs, the MCP (pinned in mcp.json) has its own Chromium. An
        # install deletes the cached browsers of every Playwright copy missing from disk, and the MCP's npx copy exists
        # only from its own install on, so the MCP goes first or the repo's install deletes its restored Chromium.
        run: |
          npx --yes --package @playwright/mcp@0.0.83 playwright install chromium
          bunx playwright install chromium

      # Reverts up to two recent fixes from main; a failed canary build drops the canaries instead of failing the run.
      - name: Pick the canaries and build them
        id: canaries
        if: ${{ !inputs.fix_from_run }}
        env:
          CANARIES: ${{ inputs.canaries }}
        run: |
          bun .github/qa/scripts/canaries.ts --out "$RUNNER_TEMP/qa-canaries.json" --patch "$RUNNER_TEMP/qa-canary.patch" ${CANARIES:+--only "$CANARIES"}
          if [ -s "$RUNNER_TEMP/qa-canary.patch" ]; then
            git apply --reverse "$RUNNER_TEMP/qa-canary.patch"
            if ! .github/qa/scripts/stack.sh build qa-dist-canary; then
              echo "::warning::The canary build failed, so this run has no canary leg"
              echo '[]' > "$RUNNER_TEMP/qa-canaries.json"
            fi
            # Not optional: the normal builds and the guard must never see the reverted tree.
            git apply "$RUNNER_TEMP/qa-canary.patch"
            git diff --quiet
          fi
          echo "count=$(jq length "$RUNNER_TEMP/qa-canaries.json")" >> "$GITHUB_OUTPUT"

      - name: Plan the legs
        id: plan
        env:
          # A fix-only run routes every ticket of the earlier run, so it needs both native apps
          # whatever `charters` says.
          CHARTERS: ${{ inputs.fix_from_run == '' && inputs.charters || '' }}
          JOURNEY: ${{ inputs.journey }}
          FIX_FROM_RUN: ${{ inputs.fix_from_run }}
          LIVE: ${{ vars.QA_LINEAR_ENABLED == 'true' && !inputs.dry_run && github.ref == 'refs/heads/main' }}
          AUTOFIX: >-
            ${{ vars.QA_AUTOFIX_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
            (github.event_name == 'schedule' || inputs.autofix || inputs.fix_from_run != '') }}
        run: |
          if [ -n "$FIX_FROM_RUN" ] && [ "$AUTOFIX" != true ]; then
            echo "::error::A fix-only run routes nothing without autofix, which needs main and QA_AUTOFIX_ENABLED."
            exit 1
          fi
          journey=$(.github/qa/scripts/explore.sh journey "$JOURNEY")
          if [ -n "$FIX_FROM_RUN" ]; then echo '[]' > "$RUNNER_TEMP/qa-canaries.json"; fi
          # Outside a fix-only run, an unknown charter id fails here, with the CLI's own ::error:: line.
          if ! legs=$(bun .github/qa/scripts/legs.ts --charters "$CHARTERS" --journey "$journey" \
            --canaries "$RUNNER_TEMP/qa-canaries.json"); then
            echo "$legs"
            exit 1
          fi
          native=$(sed -n 's/^nativeLegs=//p' <<< "$legs")
          # A fix-only run explores nothing, but still builds the native apps: a native fix's check may need the app
          # without the patch.
          if [ -n "$FIX_FROM_RUN" ]; then
            legs=$(sed -E 's/^(legs|nativeLegs|verify|nativeVerify|judge|skipped)=.*/\1=[]/' <<< "$legs")
          fi
          {
            echo "$legs"
            echo "nativeBuilds=$(jq --compact-output '[.[] | {platform, runner}] | unique' <<< "$native")"
            echo "live=$LIVE"
            echo "autofix=$AUTOFIX"
          } >> "$GITHUB_OUTPUT"
          sed -n 's/^skipped=//p' <<< "$legs" | jq --raw-output '.[] | "::notice::\(.session) does not run: \(.reason)"'

      - name: Build the frontend (onboarding off, onboarding on)
        run: |
          .github/qa/scripts/stack.sh build qa-dist
          .github/qa/scripts/stack.sh build qa-dist-onboarding onboarding

      - name: Smoke-test a fresh stack as the guard
        run: |
          .github/qa/scripts/stack.sh start qa-dist
          bunx playwright test --config .github/qa/playwright.config.ts --project control

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-dist
          path: qa-dist/
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-dist-onboarding
          path: qa-dist-onboarding/
          retention-days: 1
      - if: steps.canaries.outputs.count != '0' && !inputs.fix_from_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-dist-canary
          path: qa-dist-canary/
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-canaries
          path: ${{ runner.temp }}/qa-canaries.json
          retention-days: 7

  explore:
    name: explore ${{ matrix.leg.charter }}${{ matrix.leg.artifact == 'qa-canary' && ' (canary)' || '' }}
    needs: build
    # A dispatch of native sessions only plans no web leg, and an empty matrix is an error.
    if: needs.build.outputs.legs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # outer bound: the explore step's own cap plus setup
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.legs) }}
    # An empty image skips the container, so only Postgres legs start them.
    services: &postgres-services
      postgres:
        image: ${{ matrix.leg.postgres && 'ghcr.io/thunderbird/thunderbolt/thunderbolt-postgres:latest' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POWERSYNC_DB_PASSWORD: myhighlyrandompassword
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      powersync:
        image: ${{ matrix.leg.postgres && 'ghcr.io/thunderbird/thunderbolt/thunderbolt-powersync:latest' || '' }}
        env:
          PS_PG_URI: postgresql://powersync_role:myhighlyrandompassword@postgres:5432/postgres
          PS_STORAGE_URI: postgresql://postgres:postgres@postgres:5432/powersync_storage
          PS_JWT_KEY_BASE64: ZW50ZXJwcmlzZS10aHVuZGVyYm9sdC1wb3dlcnN5bmMtand0LWRlZmF1bHQtc2VjcmV0
          PS_JWT_KID: enterprise-powersync
        ports:
          - 18081:8080
        options: --restart always
    env:
      QA_CHARTER: ${{ matrix.leg.charter }}
      QA_OUT: ${{ matrix.leg.out }}
      QA_MCP_VIEWPORT: ${{ matrix.leg.viewport }}
      DATABASE_URL: ${{ matrix.leg.postgres && 'postgresql://postgres:postgres@localhost:15434/postgres' || '' }}
      POWERSYNC_URL: ${{ matrix.leg.postgres && 'http://localhost:18081' || '' }}
    steps:
      - *checkout
      - *setup-bun
      - &restore-bun
        name: Restore Bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *bun-cache
      - *install
      - &restore-browsers
        name: Restore Playwright browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *browser-cache
      - *install-browsers

      # Needs root, so it runs before the lock step. The sandbox keeps the agent's subprocesses from reading the key in
      # the CLI's /proc/<pid>/environ. With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set, the CLI refuses to start without it.
      - &install-sandbox
        name: Install the subprocess sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor; older kernels lack the sysctl.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - &download-dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.leg.dist }}
          path: ${{ matrix.leg.dist }}
      - &download-onboarding
        if: matrix.leg.onboarding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-dist-onboarding
          path: qa-dist-onboarding

      - &postgres-setup
        name: Prepare Postgres and PowerSync
        if: matrix.leg.postgres
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POWERSYNC_CONTAINER: ${{ job.services.powersync.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level = logical"
          docker restart "$POSTGRES_CONTAINER"
          for _ in $(seq 30); do docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres >/dev/null && break; sleep 2; done
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc 'SHOW wal_level')" = logical
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_publication WHERE pubname = 'powersync'")" = 1
          (cd backend && bunx drizzle-kit migrate)
          docker restart "$POWERSYNC_CONTAINER"
          ready() { curl --fail --silent --output /dev/null --max-time 2 http://localhost:18081/probes/readiness; }
          for _ in $(seq 30); do ready && break; sleep 3; done
          ready || { docker inspect --format 'Status: {{.State.Status}}, restarts: {{.RestartCount}}' "$POWERSYNC_CONTAINER"; exit 1; }

      - &start-stack
        name: Start the stack
        env:
          # stack.sh moves the keys into a file only qa-backend can read, and the backend runs as that user.
          QA_REAL_PROVIDERS: ${{ matrix.leg.real }}
          QA_BACKEND_USER: ${{ matrix.leg.real && 'qa-backend' || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.leg.real && secrets.QA_ANTHROPIC_API_KEY || '' }}
          TINFOIL_API_KEY: ${{ matrix.leg.real && secrets.QA_TINFOIL_API_KEY || '' }}
          TINFOIL_ENCLAVE_URL: ${{ matrix.leg.real && secrets.QA_TINFOIL_ENCLAVE_URL || '' }}
          EXA_API_KEY: ${{ matrix.leg.real && secrets.QA_EXA_API_KEY || '' }}
          QA_DIST: ${{ matrix.leg.dist }}
          ONBOARDING_DIST: ${{ matrix.leg.onboarding && 'qa-dist-onboarding' || '' }}
        run: .github/qa/scripts/stack.sh start "$QA_DIST" ${ONBOARDING_DIST:+"$ONBOARDING_DIST"}

      # Root could read the backend's keys and the runner's secrets from memory; no later step needs it.
      - &lock
        name: Take root away from the job's user
        if: matrix.leg.real
        run: .github/qa/scripts/stack.sh lock

      - name: Build the prompt
        id: prompt
        env:
          QA_MCP: ${{ matrix.leg.mcp }}
        run: |
          # The action keeps only the last of several --mcp-config files, so c7's two configs become one file.
          # shellcheck disable=SC2086 # one path per word
          jq --slurp '{mcpServers: (map(.mcpServers) | add)}' $QA_MCP > "$RUNNER_TEMP/qa-mcp.json"
          {
            echo 'text<<QA_PROMPT_EOF'
            .github/qa/scripts/explore.sh prompt "$QA_CHARTER" "$QA_OUT"
            echo 'QA_PROMPT_EOF'
            echo "start=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      # The browser tools can write anywhere in the checkout, so after the explorer only transcript.jq (a jq filter,
      # covered by the tripwire) is read from it.
      - name: Record the checksums of the tracked files
        id: tracked
        # Symlinks are skipped: one tracked link dangles, and the files they point to are tracked themselves.
        run: |
          git ls-files --stage -z | tr '\0' '\n' | awk -F '\t' '!/^120000 / { print $2 }' | tr '\n' '\0' |
            xargs -0 sha256sum > "$RUNNER_TEMP/qa-tracked.sha256"

      # Same flags as explore.sh; `--setting-sources user` keeps the repo's agent instructions and skills out.
      - name: Explore
        id: explore
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.QA_EXPLORE_TIMEOUT_MINUTES) }}
        env:
          # Keeps the Anthropic key out of every process the session starts (MCP servers, browsers).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-sonnet-5-5
            --setting-sources user
            --permission-mode dontAsk
            --tools Write
            --allowedTools "mcp__playwright__*" "mcp__playwright_b__*" "Edit(${{ env.QA_OUT }}/**)"
            --disallowedTools mcp__playwright__browser_run_code_unsafe mcp__playwright_b__browser_run_code_unsafe
            --strict-mcp-config
            --mcp-config ${{ runner.temp }}/qa-mcp.json
            --max-budget-usd ${{ env.QA_EXPLORE_MAX_BUDGET_USD }}
            --max-turns ${{ env.QA_EXPLORE_MAX_TURNS }}

      # Inline, from files outside the checkout. SIGKILL for the serve script so bash reads no more of a file the
      # explorer may have rewritten; another user's servers get SIGTERM through the sudo rule stack.sh start installed.
      - &stop-stack
        name: Stop the stack
        if: always()
        run: |
          serve=$(cat "$RUNNER_TEMP/qa-stack.pid" 2>/dev/null || true)
          servers=$(cat "$RUNNER_TEMP/qa-stack.pids" 2>/dev/null || true)
          user=$(cat "$RUNNER_TEMP/qa-stack.user" 2>/dev/null || true)
          # shellcheck disable=SC2086 # one pid per word
          kill -9 $serve 2>/dev/null || true
          # shellcheck disable=SC2086
          kill $servers 2>/dev/null || true
          for pid in $serve $servers; do while kill -0 "$pid" 2>/dev/null; do sleep 0.2; done; done
          if [ -n "$user" ]; then
            if pgrep -u "$user" > /dev/null; then sudo -n -u "$user" /usr/bin/kill -TERM -1; fi
            for _ in $(seq 150); do pgrep -u "$user" > /dev/null || exit 0; sleep 0.2; done
            echo "::error::The servers of $user did not stop."
            exit 1
          fi

      - name: Check that the checkout is unchanged
        id: tripwire
        if: always() && steps.tracked.outcome == 'success'
        run: sha256sum --check --quiet --strict "$RUNNER_TEMP/qa-tracked.sha256"

      - name: Save the session
        if: always() && steps.tripwire.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.explore.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          START: ${{ steps.prompt.outputs.start }}
        run: |
          dir=$QA_OUT/$QA_CHARTER
          mkdir -p "$dir"
          # The explorer's Write tool reaches its out dir, so these files are removed and written here only. The mcp/
          # files it can also write still reach later steps; the console logs are unguarded: worst case, a forged
          # probe line reads as "measured".
          rm -f "$dir/execution.json" "$dir/timed-out" "$dir/transcript.json"
          # Counters and capped tool calls only: the full execution file holds the prompt and all the model wrote.
          if [ -f "$EXECUTION_FILE" ]; then
            jq '[last(.[] | select(.type == "result")) | {type, subtype, is_error, total_cost_usd, num_turns, duration_ms, modelUsage}]' \
              "$EXECUTION_FILE" > "$dir/execution.json"
            jq --compact-output --from-file .github/qa/transcript.jq "$EXECUTION_FILE" > "$dir/transcript.json"
          fi
          # A step killed by its timeout leaves no execution file; the marker tells report.ts why.
          if [ $(( $(date +%s) - ${START:-$(date +%s)} )) -ge $(( QA_EXPLORE_TIMEOUT_MINUTES * 60 )) ]; then touch "$dir/timed-out"; fi

      # Artifacts are public and GitHub masks secrets in logs only, so a held key in the session output blocks the
      # upload. Exact values: a token-shaped pattern would also match a made-up key typed into a form. It runs after
      # the session and the stack end, so no untrusted process is left to read its keys.
      - name: Check the session output for secrets
        id: secret-scan
        if: always() && steps.tripwire.outcome == 'success'
        env:
          QA_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          TINFOIL_KEY: ${{ matrix.leg.real && secrets.QA_TINFOIL_API_KEY || '' }}
          EXA_KEY: ${{ matrix.leg.real && secrets.QA_EXA_API_KEY || '' }}
        run: |
          for key in "$QA_KEY" "$TINFOIL_KEY" "$EXA_KEY"; do
            if [ -n "$key" ] && grep -rqF -- "$key" "$QA_OUT/$QA_CHARTER"; then
              echo "::error::The session output holds a secret, so nothing is uploaded."
              exit 1
            fi
          done

      - name: Upload findings, specs, attempts and the session result
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.leg.artifact }}-${{ matrix.leg.charter }}
          # The `*` keeps the <charter>/ directory inside the artifact: upload-artifact drops what precedes it.
          path: |
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/findings/*.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/repro/*.spec.ts
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/attempts/*.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/execution.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/transcript.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/timed-out
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp*/*.png
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp*/*.jpeg
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp*/*.jpg
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp*/*.log
          if-no-files-found: warn
          retention-days: 7

  # Like build, runs before any untrusted code. One 1.9 GB download from Google per run instead of one per Android
  # job, beside build-native rather than inside it, so the download and the save stay off the build's path.
  cache-system-image:
    needs: build
    if: contains(needs.build.outputs.nativeBuilds, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - name: Look up the Android system image
        id: system-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The image native.sh installs, where ubuntu-24.04 keeps the SDK.
          path: &system-image-path /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: &system-image-key qa-system-image-${{ runner.os }}-${{ runner.arch }}-android-36-google_apis-x86_64
          lookup-only: true
      - name: Download the Android system image
        id: system-image-install
        if: steps.system-image.outputs.cache-hit != 'true'
        # A failure only leaves the Android jobs to download the image themselves.
        continue-on-error: true
        run: .github/qa/scripts/native.sh system-image
      - name: Save the Android system image
        if: steps.system-image-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *system-image-path
          key: *system-image-key

  # Like build, runs before any untrusted code.
  build-native:
    name: build-native ${{ matrix.target.platform }}
    needs: build
    if: needs.build.outputs.nativeBuilds != '[]'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.nativeBuilds) }}
    env:
      QA_PLATFORM: ${{ matrix.target.platform }}
      QA_APP_FILE: ${{ matrix.target.platform == 'ios' && 'Thunderbolt Dev.app' || 'app-debug.apk' }}
    steps:
      - *checkout
      - *setup-bun
      - &restore-bun-linux
        name: Restore Bun dependencies
        # The cache holds the Linux build's binaries.
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *bun-cache
      - *install
      # The Android build, the SDK tools and Maestro need Java. verify-native-run sets QA_NO_DEVICE when it has no app.
      - &setup-java
        if: env.QA_NO_DEVICE != 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
      - &native-build-tools
        name: Install the native build tools
        run: |
          if [ "$QA_PLATFORM" = ios ]; then
            rustup target add aarch64-apple-ios-sim
            exit
          fi
          # Frees disk for the NDK build.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          rustup target add x86_64-linux-android
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build the app (onboarding off, onboarding on)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          .github/qa/scripts/native.sh build "$QA_PLATFORM" "$RUNNER_TEMP/qa-native/plain"
          .github/qa/scripts/native.sh build "$QA_PLATFORM" "$RUNNER_TEMP/qa-native/onboarding" onboarding
          # A tar keeps the app's file modes, which an artifact drops.
          for variant in plain onboarding; do
            tar -cf "$RUNNER_TEMP/qa-native/$variant/app.tar" -C "$RUNNER_TEMP/qa-native/$variant" "$QA_APP_FILE"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-native-${{ matrix.target.platform }}
          path: ${{ runner.temp }}/qa-native/plain/app.tar
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-native-${{ matrix.target.platform }}-onboarding
          path: ${{ runner.temp }}/qa-native/onboarding/app.tar
          retention-days: 1

  # The model starts no process and reaches the app only through the Maestro gate (README, "Native explore on macOS"),
  # so the key may sit in the env of the session step.
  explore-native:
    name: explore ${{ matrix.leg.charter }}
    # cache-system-image only orders the restore after the save; a skipped or failed fill blocks nothing.
    needs: [build, build-native, cache-system-image]
    # A platform whose build failed fails its own legs at the download, and the other platform still explores.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.nativeLegs != '[]' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 90 # outer bound: the session's own cap plus the device and the canary
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.nativeLegs) }}
    # Only c7 on Android starts them: its second device is a browser on the web build.
    services: *postgres-services
    env:
      QA_CHARTER: ${{ matrix.leg.charter }}
      QA_OUT: ${{ matrix.leg.out }}
      QA_PLATFORM: ${{ matrix.leg.platform }}
      QA_APP_FILE: ${{ matrix.leg.platform == 'ios' && 'Thunderbolt Dev.app' || 'app-debug.apk' }}
      QA_REPO: ${{ github.workspace }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # Its "Analyze with AI" banner otherwise fills a failed run's error.
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      DATABASE_URL: ${{ matrix.leg.postgres && 'postgresql://postgres:postgres@localhost:15434/postgres' || '' }}
      POWERSYNC_URL: ${{ matrix.leg.postgres && 'http://localhost:18081' || '' }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun-linux
      - *install
      - *setup-java
      - &restore-system-image
        name: Restore the Android system image
        if: env.QA_PLATFORM == 'android' && env.QA_NO_DEVICE != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *system-image-path
          key: *system-image-key
      - &device-tools
        name: Install Maestro and the device
        if: env.QA_NO_DEVICE != 'true'
        run: |
          # The release the gate's allow list was measured on, checked before it runs. shasum: macOS has no sha256sum.
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" |
            shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          if [ "$QA_PLATFORM" = android ]; then
            # The emulator needs KVM and libpulse (qemu links it even with -no-audio); the scrubbed claude needs
            # bubblewrap.
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libpulse0 bubblewrap socat
            if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" "$ANDROID_HOME/cmdline-tools/latest/bin" \
              >> "$GITHUB_PATH"
            .github/qa/scripts/native.sh system-image
          fi
      - name: Install the second device's browser
        if: matrix.leg.postgres
        run: npx --yes --package @playwright/mcp@0.0.83 playwright install --with-deps chromium
      - name: Install Claude Code
        # The hook and the Edit rule were measured on this version; the canary does not run Claude Code. Before a
        # bump, follow "Upgrading the Claude Code CLI" in .github/qa/README.md.
        run: |
          npm install --global --prefix "$HOME/.npm-global" @anthropic-ai/claude-code@2.1.303
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-native-${{ matrix.leg.platform }}${{ matrix.leg.onboarding && '-onboarding' || '' }}
          path: ${{ runner.temp }}/apps/session
      - &unpack-apps
        name: Unpack the apps
        run: |
          for tar in "$RUNNER_TEMP"/apps/*/app.tar; do
            if [ -f "$tar" ]; then tar -xf "$tar" -C "$(dirname "$tar")"; fi
          done
      - *download-dist
      - *postgres-setup
      - &device
        name: Boot the device
        if: env.QA_NO_DEVICE != 'true'
        run: |
          # The id is the last line; a file, so a failed boot still fails the step.
          .github/qa/scripts/native.sh device "$QA_PLATFORM" > "$RUNNER_TEMP/qa-device"
          {
            echo "QA_DEVICE_ID=$(tail -1 "$RUNNER_TEMP/qa-device")"
            echo "QA_WEBVIEW_LOG=$RUNNER_TEMP/qa-webview.log"
            echo "QA_BACKEND_LOG=$RUNNER_TEMP/qa-stack.log"
          } >> "$GITHUB_ENV"
      # iOS only: its stream is slow to attach, so it starts here, without waiting, and attaches while the app
      # installs and the stack starts. The wait comes later, before the first step that needs the log; the first
      # stream gets until 60 s after this start, a replacement 60 s of its own. Nothing opens the app before the session, so the log
      # holds no earlier line. Android's stream stays after the install, whose launches would otherwise fill the log.
      - &logs-ios
        name: Stream the WebView console on iOS
        if: matrix.leg.platform == 'ios'
        run: .github/qa/scripts/native.sh logs "$QA_PLATFORM" "$QA_DEVICE_ID" "$QA_WEBVIEW_LOG"
      - name: Install the app
        run: .github/qa/scripts/native.sh install "$QA_PLATFORM" "$QA_DEVICE_ID" "$RUNNER_TEMP/apps/session/$QA_APP_FILE"
      - &start-native-stack
        name: Start the stack
        env:
          QA_REAL_PROVIDERS: ${{ matrix.leg.real }}
          QA_BACKEND_USER: ${{ matrix.leg.real && 'qa-backend' || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.leg.real && secrets.QA_ANTHROPIC_API_KEY || '' }}
          TINFOIL_API_KEY: ${{ matrix.leg.real && secrets.QA_TINFOIL_API_KEY || '' }}
          TINFOIL_ENCLAVE_URL: ${{ matrix.leg.real && secrets.QA_TINFOIL_ENCLAVE_URL || '' }}
          EXA_API_KEY: ${{ matrix.leg.real && secrets.QA_EXA_API_KEY || '' }}
          # The apps carry their own frontend; c7's browser device needs the web build on 1424.
          QA_SERVE: ${{ matrix.leg.postgres && 'qa-dist' || 'native' }}
        run: .github/qa/scripts/stack.sh start "$QA_SERVE"
      - *lock
      - &logs-android
        name: Stream the WebView console
        if: matrix.leg.platform == 'android'
        run: .github/qa/scripts/native.sh logs "$QA_PLATFORM" "$QA_DEVICE_ID" "$QA_WEBVIEW_LOG"

      # c7's second browser can write anywhere in the checkout, so from here nothing runs from it: the gate, the hook,
      # the MCP server and config, and explore.sh itself (bash reads a script as it goes) sit in a read-only dir.
      - name: Prepare the session harness outside the checkout
        run: |
          .github/qa/scripts/explore.sh harness "$QA_CHARTER" "$RUNNER_TEMP/qa-native-bin"
          chmod -R a-w "$RUNNER_TEMP/qa-native-bin"
          echo "QA_HARNESS=$RUNNER_TEMP/qa-native-bin" >> "$GITHUB_ENV"

      # shasum, because the macOS runner has no sha256sum.
      - name: Record the checksums of the tracked files
        id: tracked
        run: |
          git ls-files --stage -z | tr '\0' '\n' | awk -F '\t' '!/^120000 / { print $2 }' | tr '\n' '\0' |
            xargs -0 shasum -a 256 > "$RUNNER_TEMP/qa-tracked.sha256"

      - &wait-logs-ios
        name: Wait for the console stream
        if: matrix.leg.platform == 'ios'
        run: .github/qa/scripts/native.sh wait-logs "$QA_DEVICE_ID" "$QA_WEBVIEW_LOG"

      - name: Check that the gate denies the forbidden calls
        id: canary
        run: |
          "$QA_HARNESS/explore.sh" canary "$QA_CHARTER" "$RUNNER_TEMP/qa-canary"
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Explore
        id: session
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.QA_EXPLORE_TIMEOUT_MINUTES) }}
        env:
          # The key stays in this step's env, never in run: text or $GITHUB_ENV.
          ANTHROPIC_API_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
        run: '"$QA_HARNESS/explore.sh" run "$QA_CHARTER" "$QA_OUT" "$QA_EXPLORE_MAX_BUDGET_USD"'

      - *stop-stack
      - name: Stop the log stream
        if: always()
        run: kill "$(cat "$QA_WEBVIEW_LOG.pid" 2>/dev/null)" 2>/dev/null || true

      - name: Check that the checkout is unchanged
        id: tripwire
        if: always() && steps.tracked.outcome == 'success'
        run: shasum -a 256 --check --quiet --strict "$RUNNER_TEMP/qa-tracked.sha256"

      # The browser's file writes are no promised boundary, so this key-holding step clears startup variables and uses
      # absolute paths (GitHub still prepends $GITHUB_PATH).
      - name: Check the session output for secrets
        id: secret-scan
        if: always() && steps.tripwire.outcome == 'success'
        shell: /bin/bash --noprofile --norc -e {0}
        env:
          QA_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          TINFOIL_KEY: ${{ matrix.leg.real && secrets.QA_TINFOIL_API_KEY || '' }}
          EXA_KEY: ${{ matrix.leg.real && secrets.QA_EXA_API_KEY || '' }}
          PATH: /usr/bin:/bin
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          for key in "$QA_KEY" "$TINFOIL_KEY" "$EXA_KEY"; do
            if [ -n "$key" ] &&
              /usr/bin/grep -rqsF -- "$key" "$QA_OUT/$QA_CHARTER" "$QA_OUT/$QA_CHARTER".{gate.log,run.jsonl}; then
              echo "::error::The session output holds a secret, so nothing is uploaded."
              exit 1
            fi
          done

      # Reads the stream next to the gate log, which the model cannot write; the copies in its session dir could be
      # forged, so they go first.
      - name: Save the session
        if: always() && steps.tripwire.outcome == 'success'
        env:
          START: ${{ steps.canary.outputs.start }}
        run: |
          dir=$QA_OUT/$QA_CHARTER
          stream=$dir.run.jsonl
          mkdir -p "$dir"
          rm -f "$dir/execution.json" "$dir/transcript.json" "$dir/session.json" "$dir/timed-out"
          if [ -s "$stream" ]; then
            # A session cut short can end in half a line.
            jq --raw-input --null-input '[inputs | fromjson? // empty]' "$stream" > "$RUNNER_TEMP/stream.json"
            jq '[last(.[] | select(.type == "result")) | {type, subtype, is_error, total_cost_usd, num_turns, duration_ms, modelUsage}]' \
              "$RUNNER_TEMP/stream.json" > "$dir/execution.json"
            jq --compact-output --from-file .github/qa/transcript.jq "$RUNNER_TEMP/stream.json" > "$dir/transcript.json"
          fi
          if [ $(( $(date +%s) - ${START:-$(date +%s)} )) -ge $(( QA_EXPLORE_TIMEOUT_MINUTES * 60 )) ]; then touch "$dir/timed-out"; fi

      - name: Upload findings, flows, attempts and the session result
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.leg.artifact }}-${{ matrix.leg.charter }}
          # The `*` keeps the <session>/ directory inside the artifact, next to <session>.gate.log.
          path: |
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/findings/*.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/repro/*.yaml
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/repro/*.spec.ts
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/attempts/*.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/execution.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/transcript.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/timed-out
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/maestro/shot-*.jpg
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/maestro/shot-*.png
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp-b/*.png
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp-b/*.jpeg
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp-b/*.jpg
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/mcp-b/*.log
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}.gate.log
          if-no-files-found: warn
          retention-days: 7

  replay:
    name: replay ${{ matrix.leg.name }}
    needs: [build, explore]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.verify != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Runs model-written specs: only real-AI legs have an environment, for keys the start step hands to another
    # user's backend.
    environment: ${{ matrix.leg.real && 'qa-agent' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.verify) }}
    services: *postgres-services
    env:
      QA_OUT: ${{ matrix.leg.out }}
      DATABASE_URL: ${{ matrix.leg.postgres && 'postgresql://postgres:postgres@localhost:15434/postgres' || '' }}
      POWERSYNC_URL: ${{ matrix.leg.postgres && 'http://localhost:18081' || '' }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - *restore-browsers
      - *install-browsers
      - *download-dist
      - *download-onboarding
      - name: Download the sessions' findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.leg.artifact }}-*
          path: ${{ matrix.leg.out }}
          merge-multiple: true
      - *postgres-setup
      - *start-stack
      - *lock

      - name: Replay the repro specs
        run: |
          mkdir -p "$QA_OUT"
          bun .github/qa/scripts/verify.ts replay --out "$QA_OUT"

      - &sanitize
        name: Remove credentials and network data from traces
        id: sanitize
        if: always()
        run: |
          bun test scripts/sanitize-nightly-artifacts.test.ts --timeout 5000
          bun scripts/sanitize-nightly-artifacts.ts "$QA_OUT/replay"

      - &upload-replay
        name: Upload the replay
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-replay-${{ matrix.leg.name }}
          path: ${{ matrix.leg.out }}/
          retention-days: 7

  # Only android-real has an environment, for the provider keys its start step hands to another user's backend.
  replay-native:
    name: replay ${{ matrix.leg.name }}
    needs: [build, build-native, explore-native]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.nativeVerify != '[]' }}
    runs-on: ${{ matrix.leg.runner }}
    # Only a ceiling: a timeout loses every finding of the leg, so verify.ts starts no run that could end after it.
    timeout-minutes: 360
    environment: ${{ matrix.leg.real && 'qa-agent' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.nativeVerify) }}
    services: *postgres-services
    env:
      QA_OUT: ${{ matrix.leg.out }}
      QA_PLATFORM: ${{ matrix.leg.platform }}
      QA_APP_FILE: ${{ matrix.leg.platform == 'ios' && 'Thunderbolt Dev.app' || 'app-debug.apk' }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # Its "Analyze with AI" banner otherwise fills a failed run's error.
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      DATABASE_URL: ${{ matrix.leg.postgres && 'postgresql://postgres:postgres@localhost:15434/postgres' || '' }}
      POWERSYNC_URL: ${{ matrix.leg.postgres && 'http://localhost:18081' || '' }}
    steps:
      # The timeout counts from the job's start, so the replay's clock does too (verify.ts `legClock`).
      - name: Record the leg's start
        run: echo "QA_LEG_START=$(date +%s)" >> "$GITHUB_ENV"
      - *checkout
      - *setup-bun
      - *restore-bun-linux
      - *install
      - *setup-java
      - *restore-system-image
      - *device-tools
      - name: Install the browser for c7's specs
        if: matrix.leg.postgres
        run: bunx playwright install --with-deps chromium
      # Both builds: a c1 flow runs on the onboarding one, every other flow on the plain one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-native-${{ matrix.leg.platform }}
          path: ${{ runner.temp }}/apps/plain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-native-${{ matrix.leg.platform }}-onboarding
          path: ${{ runner.temp }}/apps/onboarding
      - *unpack-apps
      - *download-dist
      - name: Download the sessions' findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Sessions start with c<n> or free-, so qa-android-[cf]* leaves out qa-android-sync-* and qa-android-real-*.
          pattern: ${{ matrix.leg.artifact }}-[cf]*
          path: ${{ matrix.leg.out }}
          merge-multiple: true
      - *postgres-setup
      - *device
      - *logs-ios
      # Maestro starts its driver in a session's first launchApp, which can fail on a fresh emulator with no reason
      # given; one uncounted session absorbs that before the counted runs.
      - name: Start Maestro's driver on the emulator
        if: matrix.leg.platform == 'android'
        run: |
          .github/qa/scripts/native.sh install android "$QA_DEVICE_ID" "$RUNNER_TEMP/apps/plain/$QA_APP_FILE"
          app_id=$(jq -r '.[] | select(.id == "android") | .appId' .github/qa/platforms.json)
          printf 'appId: %s\n---\n- launchApp\n' "$app_id" > "$RUNNER_TEMP/qa-warm-up.yaml"
          maestro --udid "$QA_DEVICE_ID" test "$RUNNER_TEMP/qa-warm-up.yaml" ||
            echo "::warning::Maestro's first session on the emulator failed; the replay's counted runs come after it"
      - *start-native-stack
      - *lock
      - *logs-android
      - *wait-logs-ios

      - name: Replay the repro flows and specs
        env:
          LEG: ${{ matrix.leg.name }}
        run: |
          mkdir -p "$QA_OUT"
          bun .github/qa/scripts/verify.ts replay --out "$QA_OUT" --native "$QA_PLATFORM" --device "$QA_DEVICE_ID" \
            --app "$RUNNER_TEMP/apps/plain/$QA_APP_FILE" --app-onboarding "$RUNNER_TEMP/apps/onboarding/$QA_APP_FILE" \
            --leg "$LEG"

      # Read after the replay, not streamed: an adb reset ends a stream. The log buffer is grown at boot to hold
      # a 6-hour leg.
      - name: Save the emulator's, adb's and Maestro's logs
        if: always() && matrix.leg.platform == 'android' && !matrix.leg.real
        run: |
          adb -s "$QA_DEVICE_ID" logcat -d -v epoch -b main,system,crash,events > "$RUNNER_TEMP/qa-logcat.log" || true
          cp /tmp/adb.*.log "$RUNNER_TEMP/qa-adb.log" || true
          cp -R ~/.maestro/tests "$RUNNER_TEMP/qa-maestro" || true

      - *sanitize
      - *upload-replay
      # On Android after every replay: a passed control does not show whether the console stream lasted the whole leg.
      # Never on the real leg, whose backend held the provider keys.
      - name: Upload the stack, device and Maestro logs
        if: (failure() || matrix.leg.platform == 'android') && !matrix.leg.real
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-logs-replay-${{ matrix.leg.name }}
          path: |
            ${{ runner.temp }}/qa-stack.log
            ${{ runner.temp }}/qa-webview.log
            ${{ runner.temp }}/qa-logcat.log
            ${{ runner.temp }}/qa-adb.log
            ${{ runner.temp }}/qa-maestro/
          if-no-files-found: ignore
          retention-days: 7

  judge:
    name: judge ${{ matrix.leg.name }}
    needs: [build, replay, replay-native]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.judge != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.judge) }}
    env:
      QA_OUT: ${{ matrix.leg.out }}
    steps:
      # A fresh job, because the replayed specs could have rewritten any file in the replay job's checkout.
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      # A dispatch of native sessions only has no web replay; the weekly leg then judges the native candidates alone.
      - if: matrix.leg.name != 'weekly' || needs.build.outputs.verify != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-replay-${{ matrix.leg.name }}
          path: ${{ matrix.leg.out }}
      - name: Download the sync, real-AI and native replays
        if: matrix.leg.name == 'weekly'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Matches nothing when neither c7, a real-AI charter nor a native session ran.
          pattern: 'qa-replay-{sync,real,ios,android,android-sync,android-real}'
          path: qa-out-legs
      # Each leg's stack health stays with its own replay job, which fails loudly when the stack was broken.
      - name: Add the sync, real-AI and native candidates
        if: matrix.leg.name == 'weekly'
        run: |
          if [ ! -f qa-out/candidates.json ]; then
            mkdir -p qa-out
            echo '{"confirmed": [], "flaky": [], "observations": [], "dropped": [], "deferred": []}' > qa-out/candidates.json
          fi
          for leg in qa-out-legs/*/; do
            [ -f "$leg/candidates.json" ] || continue
            jq --slurp '.[1] as $leg | .[0] | .confirmed += $leg.confirmed | .flaky += $leg.flaky
              | .observations += $leg.observations | .dropped += $leg.dropped | .deferred += $leg.deferred' \
              qa-out/candidates.json "$leg/candidates.json" > "$RUNNER_TEMP/candidates.json"
            cp -R "$leg." qa-out/
            mv "$RUNNER_TEMP/candidates.json" qa-out/candidates.json
          done
      - name: Judge the confirmed findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
        run: bun .github/qa/scripts/verify.ts judge --out "$QA_OUT"
      - name: Download the canary baseline
        if: matrix.leg.name == 'canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-replay-canary-baseline
          path: qa-out-canary-baseline
      - name: Download the canaries
        if: matrix.leg.name == 'canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-canaries
          path: qa-canaries
      # The canary leg is never filed: the file job reads only qa-verified-weekly.
      - name: Measure canary recall
        if: matrix.leg.name == 'canary'
        env:
          CHARTERS: ${{ inputs.charters }}
        run: |
          bun .github/qa/scripts/report.ts canary --out "$QA_OUT" --baseline qa-out-canary-baseline \
            --canaries qa-canaries/qa-canaries.json --charters "$CHARTERS"
      # Also when the judge failed: verified.json then shows why (an unhealthy stack drops every replayed finding).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-verified-${{ matrix.leg.name }}
          path: |
            ${{ matrix.leg.out }}/verified.json
            ${{ matrix.leg.out }}/canary.json
          retention-days: 7

  # A fix-only run has no judge leg: this job takes an earlier run's findings and tickets instead, and routes them.
  file:
    needs: [build, judge]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.build.outputs.judge != '[]' || inputs.fix_from_run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: qa-agent
    permissions:
      # Reads the artifacts of the run a fix-only run fixes from.
      actions: read
      contents: read
      # Route lists the open PRs: a ticket with one already waits.
      pull-requests: read
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      real: ${{ steps.route.outputs.real }}
      tests: ${{ steps.route.outputs.tests }}
    env:
      QA_OUT: qa-out
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      # c7's specs come from the sync replay, c3's and c5's from the real one, native flows from the native legs.
      - &download-replay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'qa-replay-{weekly,sync,real,ios,android,android-sync,android-real}'
          path: qa-out
          merge-multiple: true
      # A fix-only run uploads the earlier run's replays and verified findings again under this run, so every later
      # job reads them as in a weekly run. One artifact holds every leg, named to match each job's replay pattern.
      - name: Download the replays of the run to fix from
        if: inputs.fix_from_run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'qa-replay-{weekly,sync,real,ios,android,android-sync,android-real}'
          path: qa-out
          merge-multiple: true
          run-id: ${{ inputs.fix_from_run }}
          github-token: ${{ github.token }}
      - if: inputs.fix_from_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-replay-weekly
          path: qa-out/
          retention-days: 7
      - if: ${{ !inputs.fix_from_run }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-verified-weekly
          path: qa-out
      - name: Download the findings and tickets of the run to fix from
        if: inputs.fix_from_run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{qa-verified-weekly,qa-filed}'
          path: qa-out
          merge-multiple: true
          run-id: ${{ inputs.fix_from_run }}
          github-token: ${{ github.token }}
      - if: inputs.fix_from_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-verified-weekly
          path: qa-out/verified.json
          retention-days: 7
      # With a Linear key it also writes scorecard.json, the triage precision the brake reads. A fix-only run keeps
      # the earlier run's filed.json, whose tickets the route step below reads with the current code.
      - name: File the confirmed findings
        if: ${{ !inputs.fix_from_run }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun .github/qa/scripts/file-findings.ts --out qa-out --run-url "$RUN_URL" ${{ needs.build.outputs.live == 'true' && '--live' || '' }}
      # Route only reads Linear: each ticket's branch name and state.
      - name: Route fixable tickets
        id: route
        if: needs.build.outputs.autofix == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bun .github/qa/scripts/fix.ts route --out qa-out ${{ needs.build.outputs.live == 'true' && '--live' || '' }}
          {
            echo "plan=$(jq --compact-output . qa-out/fix-plan.json)"
            # Web real-AI tasks, checked again on the real providers by verify-real. Android's run in verify-native.
            echo "real=$(jq --compact-output '[.fixes[] | select(.real and .spec != null)]' qa-out/fix-plan.json)"
            # Web tasks, whose patch must carry a unit test that verify-tests sees fail without the fix.
            echo "tests=$(jq --compact-output '[.fixes[] | select(.flow == null)]' qa-out/fix-plan.json)"
          } >> "$GITHUB_OUTPUT"
      # Also when filing failed: filed.json then lists the tickets that did reach Linear and the attachments lost.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-filed
          path: |
            qa-out/filed.json
            qa-out/scorecard.json
            qa-out/fix-plan.json
          retention-days: 7

  fix:
    name: fix ${{ matrix.task.fp }}
    needs: [build, file]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).fixes[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # outer bound: the fix step's own cap plus setup
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.plan).fixes }}
    env:
      QA_OUT: qa-out
      QA_FP: ${{ matrix.task.fp }}
      # The repro check before the session runs as this user.
      QA_TEST_USER: qa-test
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - *restore-browsers
      - *install-browsers
      - *download-replay
      # A web visual task's check must also fail on the builds without the patch.
      - if: matrix.task.kind == 'visual' && !matrix.task.flow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-dist
          path: qa-dist
      - if: matrix.task.kind == 'visual' && !matrix.task.flow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-dist-onboarding
          path: qa-dist-onboarding

      # Needs root, so before the lock below.
      - *install-sandbox

      # The dev servers reload the agent's edits outside its sandbox: as the job's user they could read the key, so
      # they run as another user.
      - name: Start the stack on the working tree
        env:
          QA_BACKEND_USER: qa-dev
        run: .github/qa/scripts/stack.sh start dev
      - name: Check that no dev server runs as the job's user
        # By port, not by name: ss names the process only for this user's own sockets.
        run: |
          listeners=$(ss -ltnpH '( sport = :8005 or sport = :1424 or sport = :1425 )')
          echo "$listeners"
          if grep -q 'users:' <<< "$listeners"; then
            echo "::error::A dev server runs as the job's user."
            exit 1
          fi
          for port in 8005 1424 1425; do grep -q ":$port " <<< "$listeners"; done
      # Needs root, so before the lock. The job's user may then run anything as the test user and nothing as root;
      # the rule sorts after zz-qa-lock, and in sudoers the last matching rule wins.
      - &test-user
        name: Create the user the tests run as
        run: |
          sudo useradd --create-home "$QA_TEST_USER"
          # Lets that user reach bun and the checkout without listing this user's home.
          sudo chmod o+x "$HOME"
          sudo sh -c "umask 0337 && echo '$(id -un) ALL=($QA_TEST_USER) NOPASSWD: ALL' > /etc/sudoers.d/zz-qa-lock-tests"
          # Fails the job here when that user cannot run bun or read the checkout, rather than every test later.
          sudo -n -u "$QA_TEST_USER" env "PATH=$PATH" bun --version
          sudo -n -u "$QA_TEST_USER" cat "$PWD/package.json" > /dev/null
          sudo -n -u "$QA_TEST_USER" ls "$PWD/node_modules/.bin" > /dev/null
      - name: Take root away from the job's user
        run: .github/qa/scripts/stack.sh lock

      # A passed check uploads this file as `qa-pass-<fp>-<check>-<run attempt>`, under an `if:` on the check step's
      # outcome, which the runner keeps and no process of the job can change. Publish reads only the artifact's name,
      # so code that rewrites this file changes nothing, and code that deletes it only loses its own pass.
      - &pass-marker
        name: Write the file a passed check uploads
        run: echo "A passed check. The artifact's name says which." > "$RUNNER_TEMP/qa-pass.txt"

      # In a fix-only run, a fake-AI web repro that passes all three times on this commit means another change fixed
      # the bug, so no session runs and publish only comments on the ticket. A weekly run's replay has just reproduced
      # the bug on this commit, so a pass on the dev stack there would only mean dev and build differ. The spec is
      # model-written, so it runs as the test user, which cannot read the key Fix later holds, and the stop below
      # leaves none of its processes behind. Any failure, a hang included, sets no output and the session runs.
      - name: Replay the spec before the fix
        id: unpatched
        if: inputs.fix_from_run && matrix.task.spec && !matrix.task.real
        env:
          SPEC: ${{ matrix.task.spec }}
        run: |
          browsers="$HOME/.cache/ms-playwright"
          # The output dir is the test user's own: qa-out/replay belongs to the job's user.
          if chmod o+x "$HOME/.cache" && chmod -R o+rX "$browsers" && out=$(sudo -n -u "$QA_TEST_USER" mktemp -d) &&
            sudo -n -u "$QA_TEST_USER" timeout --kill-after=10s 10m \
              env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$browsers" \
              bunx playwright test --config .github/qa/playwright.config.ts --repeat-each=3 --retries=0 \
              --output "$out" "$SPEC"; then
            echo "passes=true" >> "$GITHUB_OUTPUT"
          fi
      # A process the spec left behind would otherwise outlive the check. SIGKILL, which a test cannot catch, again
      # until none is left, so a process that forks in between is caught too. One that survives fails the job here,
      # before Fix, and its ticket waits for a later run.
      - &stop-test-user
        name: Stop every process of the test user
        id: stop-tests
        if: always()
        run: |
          for _ in $(seq 50); do
            pgrep -u "$QA_TEST_USER" > /dev/null || exit 0
            sudo -n -u "$QA_TEST_USER" /usr/bin/kill -KILL -1 || true
            sleep 0.2
          done
          echo "processes of $QA_TEST_USER still run" >&2
          exit 1
      - if: steps.unpatched.outputs.passes == 'true' && steps.stop-tests.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-unpatched-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7

      - name: Build the prompt
        id: prompt
        env:
          TASK: ${{ toJSON(matrix.task) }}
        run: |
          {
            echo 'text<<QA_PROMPT_EOF'
            cat .github/qa/fix.md
            # shellcheck disable=SC2016 # Markdown backticks
            printf '\n## Task\n\n```json\n%s\n```\n' "$TASK"
            echo 'QA_PROMPT_EOF'
            echo "start=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      # The tool rules keep the agent on task but are not the boundary: this job holds no write token.
      - name: Fix
        id: fix
        if: steps.unpatched.outputs.passes != 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.QA_FIX_TIMEOUT_MINUTES) }}
        env:
          # Keeps the Anthropic key out of every command the agent runs, such as a test file it wrote.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5-5
            --setting-sources user
            --permission-mode dontAsk
            --tools "Read,Glob,Grep,Edit,Write,Bash,Skill"
            --allowedTools "Read,Glob,Grep,Edit(**),Skill(simplify),Bash(bun run check),Bash(bun run test:*),Bash(bun run test:backend),Bash(bun run i18n:extract),Bash(bun db generate),Bash(cd backend && bun db generate),${{ matrix.task.spec && format('Bash(bunx playwright test --config .github/qa/playwright.config.ts {0}),', matrix.task.spec) || '' }}Bash(bunx playwright test --config .github/qa/playwright.config.ts qa-out/fix-${{ matrix.task.fp }}/repro/check.spec.ts),Bash(bunx playwright test --config .github/qa/playwright.config.ts qa-out/fix-${{ matrix.task.fp }}/repro/web.spec.ts)"
            --disallowedTools "Bash(git:*)" WebFetch WebSearch "Edit(.git/**)" "Edit(.github/**)" "Edit(e2e/**)"
              "Edit(**/vite.config.*)" "Edit(**/playwright.config.*)" "Edit(**/tsconfig*.json)"
              "Edit(**/.husky/**)" "Edit(**/package.json)" "Edit(**/bun.lock)" "Edit(**/bun.lockb)" "Edit(**/Cargo.toml)"
              "Edit(**/Cargo.lock)" "Edit(**/*.gradle)" "Edit(**/*.gradle.kts)" "Edit(**/gradle-wrapper.*)"
              "Edit(**/Podfile*)" "Edit(**/Package.resolved)" "Edit(**/Package.swift)" "Edit(**/Gemfile*)"
              "Edit(**/requirements*.txt)" "Edit(**/go.mod)" "Edit(**/go.sum)" "Edit(**/bunfig.toml)"
              "Edit(**/.cargo/config*)" "Edit(**/rust-toolchain*)" "Edit(**/.npmrc)" "Edit(**/.nvmrc)"
              "Edit(**/.tool-versions)" "Edit(**/package-lock.json)" "Edit(**/npm-shrinkwrap.json)" "Edit(**/yarn.lock)"
              "Edit(**/pnpm-lock.yaml)" "Edit(**/.lintstagedrc*)" "Edit(**/lint-staged.config.*)"
            --max-budget-usd ${{ env.QA_FIX_MAX_BUDGET_USD }}
            --max-turns ${{ env.QA_FIX_MAX_TURNS }}

      # The last step that holds the key: after it, code the agent wrote runs outside its sandbox. The key anywhere
      # in the checkout blocks the upload (node_modules is bundled into the real-AI build) except in .git, which the
      # agent cannot edit and git compresses. Exact key only: minified code is full of prefixes like sk-. Startup and
      # preload variables are cleared and tools called by absolute path, since GitHub still prepends $GITHUB_PATH.
      - name: Check the agent's output for the key
        id: key-scan
        if: always()
        shell: /bin/bash --noprofile --norc -e {0}
        env:
          QA_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          PATH: /usr/bin:/bin
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          if [ -n "$QA_KEY" ] && /usr/bin/grep -rqsF --exclude-dir=.git -- "$QA_KEY" .; then
            echo "::error::The checkout holds the QA key after the fix session, so nothing is uploaded."
            exit 1
          fi

      # Publish leaves the ticket untouched when the session never began: a step before Fix failed, or Fix failed
      # before the model first answered (the action's setup, the CLI install, a refused first request). A step
      # timeout counts as begun: the step ran for its whole cap, though the action had no chance to write its
      # execution file. An action killed another way (the job's own timeout, a lost process) also leaves no file and
      # reads as never begun, so its ticket waits for a later run; it never becomes a PR. A repro that already passed
      # skipped the session on purpose. Recorded and uploaded before any code the agent wrote runs outside its
      # sandbox, with the key scan's cleared variables and absolute paths.
      - name: Record whether the fix session began
        if: always()
        shell: /bin/bash --noprofile --norc -e {0}
        env:
          ALREADY_PASSES: ${{ steps.unpatched.outputs.passes == 'true' && steps.stop-tests.outcome == 'success' }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          START: ${{ steps.prompt.outputs.start }}
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
          PATH: /usr/bin:/bin
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          stopped=null
          elapsed=$(( $(/bin/date +%s) - START ))
          if [ "$ALREADY_PASSES" = true ]; then
            stopped='"already-passes"'
          elif [ "$FIX_OUTCOME" = skipped ]; then
            stopped='"setup-failed"'
          elif [ "$FIX_OUTCOME" != success ] && [ "$elapsed" -lt $(( QA_FIX_TIMEOUT_MINUTES * 60 )) ] &&
            { [ ! -e "$EXECUTION_FILE" ] ||
              /usr/bin/jq -e 'all(.[]; .type != "assistant" or .error != null)' "$EXECUTION_FILE" > /dev/null; }; then
            stopped='"no-model-answer"'
          fi
          /bin/mkdir -p "$RUNNER_TEMP/qa-status"
          /usr/bin/jq --null-input --argjson stopped "$stopped" '{stoppedBeforeSession: $stopped}' \
            > "$RUNNER_TEMP/qa-status/$QA_FP.json"
      # Uploaded whenever the key scan passed, as the fix output is, so publish's download never misses in a normal
      # run. Outside qa-out/, so the agent's qa-fix artifact cannot carry a copy. This and every artifact a fix's
      # checks or publish read carry the run attempt: one artifact list spans every attempt of the run, and a
      # download by name takes the latest, so an attempt that uploaded none would get an earlier attempt's.
      - if: always() && steps.key-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-fix-status-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-status/
          if-no-files-found: error
          retention-days: 7

      # Fresh from the artifact: the agent's commands could have changed qa-out/. Real-AI specs run in verify-real.
      - name: Download the original spec
        if: steps.fix.outcome == 'success' && matrix.task.spec && !matrix.task.real
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'qa-replay-{weekly,sync,android-sync}'
          path: qa-out-verify
          merge-multiple: true
      - name: Replay the spec on the patched code
        id: verify
        if: steps.fix.outcome == 'success' && matrix.task.spec && !matrix.task.real
        env:
          QA_OUT: qa-out-verify
          SPEC: ${{ matrix.task.spec }}
        run: bunx playwright test --config .github/qa/playwright.config.ts --repeat-each=3 --retries=0 "qa-out-verify/${SPEC#qa-out/}"

      # Succeeds only when the check passes all three times. The baseline below runs only after it.
      - name: Run the visual check on the patched tree
        id: visual-with
        if: steps.fix.outcome == 'success' && matrix.task.kind == 'visual' && !matrix.task.flow
        continue-on-error: true
        run: bunx playwright test --config .github/qa/playwright.config.ts --repeat-each=3 --retries=0 "qa-out/fix-$QA_FP/repro/check.spec.ts"

      - *stop-stack

      # Succeeds only when the check fails all three times on the builds without the patch.
      - name: Run the visual check without the patch
        id: visual
        if: steps.visual-with.outcome == 'success'
        continue-on-error: true
        run: |
          # The backend serves from the working tree, so the patch is stashed (ignored qa-out*/ and qa-dist*/ stay).
          # The trap restores it for "Collect the patch", also after a failure, and pops only a stash this step made.
          stash=$(git rev-parse --quiet --verify refs/stash || true)
          trap '[ "$(git rev-parse --quiet --verify refs/stash || true)" = "$stash" ] || git stash pop --quiet' EXIT
          # A stash is a commit, and the runner has no git identity.
          git -c user.name=qa -c user.email=qa@localhost stash push --include-untracked --quiet
          .github/qa/scripts/stack.sh start qa-dist qa-dist-onboarding
          passed=0
          for _ in 1 2 3; do
            if bunx playwright test --config .github/qa/playwright.config.ts --retries=0 "qa-out/fix-$QA_FP/repro/check.spec.ts"; then
              passed=$((passed + 1))
            fi
          done
          .github/qa/scripts/stack.sh stop
          [ "$passed" -eq 0 ]

      # verify-real serves this build from a fresh checkout: the provider keys must never enter this job, whose
      # tree and tools the agent's commands could have changed.
      - name: Build the patched frontend for the real-AI check
        id: real-build
        if: steps.fix.outcome == 'success' && matrix.task.real && matrix.task.spec
        run: .github/qa/scripts/stack.sh build "$RUNNER_TEMP/qa-dist-fix"

      - name: Collect the patch
        if: always()
        env:
          SPEC: ${{ matrix.task.spec }}
          FLOW: ${{ matrix.task.kind == 'spec' && matrix.task.flow || '' }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          # Any outcome but success (failure, skipped, cancelled, none) of a check the task needs means no PR.
          NEEDS_REPLAY: ${{ matrix.task.spec && !matrix.task.real && 'true' || '' }}
          NEEDS_VISUAL: ${{ matrix.task.kind == 'visual' && !matrix.task.flow && 'true' || '' }}
          NEEDS_REAL_BUILD: ${{ matrix.task.real && matrix.task.spec && 'true' || '' }}
          REPLAY: ${{ steps.verify.outcome }}
          VISUAL: ${{ steps.visual.outcome }}
          REAL_BUILD: ${{ steps.real-build.outcome }}
        run: |
          mkdir -p qa-out/fix
          # A diagnosis makes publish hand the ticket to a person instead of opening a PR.
          diagnose() { echo "$1, so the patch is not published." >> "qa-out/fix/$QA_FP.diagnosis.md"; }
          # When the session never began, the fix status tells publish to leave the ticket alone instead.
          if [ "$FIX_OUTCOME" != success ]; then
            diagnose "The fix session did not finish (step outcome: $FIX_OUTCOME)"
          elif [ -n "$NEEDS_REPLAY" ] && [ "$REPLAY" != success ]; then
            diagnose "The repro spec did not pass three times on the patched code (step outcome: ${REPLAY:-none})"
          elif [ -n "$NEEDS_VISUAL" ] && [ "$VISUAL" != success ]; then
            diagnose "The visual check did not pass three times with the patch and fail three times without it (baseline step outcome: ${VISUAL:-none})"
          elif [ -n "$NEEDS_REAL_BUILD" ] && [ "$REAL_BUILD" != success ]; then
            diagnose "The patched frontend for the real-AI check did not build (step outcome: ${REAL_BUILD:-none})"
          fi
          git add --all
          git diff --cached --binary HEAD > "qa-out/fix/$QA_FP.patch"
          # The repro as the agent left it; publish refuses the patch when it differs from the original.
          if [ -n "$SPEC" ]; then cp "$SPEC" "qa-out/fix/$QA_FP.spec.ts"; fi
          if [ -n "$FLOW" ]; then cp "$FLOW" "qa-out/fix/$QA_FP.yaml"; fi

      - name: Record the session metrics
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.fix.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          START: ${{ steps.prompt.outputs.start }}
        run: |
          timed_out=()
          if [ $(( $(date +%s) - ${START:-$(date +%s)} )) -ge $(( QA_FIX_TIMEOUT_MINUTES * 60 )) ]; then timed_out=(--timed-out); fi
          bun .github/qa/scripts/report.ts session --execution-file "$EXECUTION_FILE" --charter "fix-$QA_FP" --out qa-out "${timed_out[@]}"

      # Token shapes only, since no later step holds the key; JWT shapes are left to publish's check because repo
      # test fixtures contain some. Patched code ran in earlier steps and could have changed $GITHUB_ENV or
      # $GITHUB_PATH, hence the cleared variables and absolute paths.
      - name: Check the fix output for secrets
        id: secret-scan
        if: always()
        shell: /bin/bash --noprofile --norc -e {0}
        env:
          PATH: /usr/bin:/bin
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          out=(qa-out/fix/)
          if [ -d "qa-out/fix-$QA_FP/repro" ]; then out+=("qa-out/fix-$QA_FP/repro/"); fi
          if /usr/bin/grep -rqE '\bsk-[[:alnum:]_-]{8,}|lin_(api|oauth)_|gh[pousr]_[[:alnum:]]{20,}|github_pat_|xox[bp]-' "${out[@]}"; then
            echo "::error::The fix output contains a secret, so nothing is uploaded."
            exit 1
          fi
      # The patch and the agent's checks, for verify-native-build, verify-tests, verify-checks and publish. The
      # artifact's root is qa-out/. Everything in it could have been rewritten by code the agent wrote, so no verdict
      # travels in it.
      - if: always() && steps.key-scan.outcome == 'success' && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-fix-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: |
            qa-out/fix/
            qa-out/fix-${{ matrix.task.fp }}/repro/*
          retention-days: 7
      # The passes of this job's checks (see the marker above).
      - if: >-
          always() && steps.key-scan.outcome == 'success' && steps.secret-scan.outcome == 'success' &&
          steps.fix.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-session-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7
      - if: >-
          always() && steps.key-scan.outcome == 'success' && steps.secret-scan.outcome == 'success' &&
          steps.verify.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-replay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7
      - if: >-
          always() && steps.key-scan.outcome == 'success' && steps.secret-scan.outcome == 'success' &&
          steps.visual.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-visual-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7
      - if: >-
          always() && steps.key-scan.outcome == 'success' && steps.secret-scan.outcome == 'success' &&
          matrix.task.real && matrix.task.spec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-fix-dist-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-dist-fix/
          if-no-files-found: ignore
          retention-days: 1
      - if: always() && steps.key-scan.outcome == 'success' && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-fix-session-${{ matrix.task.fp }}
          path: qa-out/fix-*/session.json
          retention-days: 7

  # A native fix's patch runs here, so the job holds no secret; the verdict comes from verify-native-run, on a fresh
  # checkout the patch never ran in.
  verify-native-build:
    name: verify-native-build ${{ matrix.check.fp }} ${{ matrix.check.platform }}
    needs: [build, file, fix]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).verifyNative[0] != null }}
    runs-on: ${{ matrix.check.platform == 'ios' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.file.outputs.plan).verifyNative }}
    env:
      QA_PLATFORM: ${{ matrix.check.platform }}
      QA_APP_FILE: ${{ matrix.check.platform == 'ios' && 'Thunderbolt Dev.app' || 'app-debug.apk' }}
      QA_FP: ${{ matrix.check.fp }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun-linux
      - *install
      - *setup-java
      - *native-build-tools
      # This attempt's fix output only, by pattern: when the fix job ran in an earlier attempt there is none, the
      # build step below finds no patch, and publish hands the ticket to a person.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qa-fix-${{ matrix.check.fp }}-${{ github.run_attempt }}
          path: qa-out
      - name: Build the app with the patch
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SESSION: ${{ matrix.check.session }}
        run: |
          # Nothing to check: publish hands the ticket to a person.
          if [ -e "qa-out/fix/$QA_FP.diagnosis.md" ] || [ ! -s "qa-out/fix/$QA_FP.patch" ]; then exit 0; fi
          .github/qa/scripts/native.sh verify-build "$QA_PLATFORM" "qa-out/fix/$QA_FP.patch" "$SESSION" "$RUNNER_TEMP/qa-patched"
          # Only the app: the out dir also holds the build's tauri.conf.json.
          tar -cf "$RUNNER_TEMP/qa-patched/app.tar" -C "$RUNNER_TEMP/qa-patched" "$QA_APP_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-patched-${{ matrix.check.fp }}-${{ matrix.check.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-patched/app.tar
          if-no-files-found: ignore
          retention-days: 1

  # No patched app means no verdict, which publish reads as a failure.
  verify-native-run:
    name: verify-native-run ${{ matrix.check.fp }} ${{ matrix.check.platform }}
    needs: [build, build-native, file, verify-native-build]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).verifyNative[0] != null }}
    runs-on: ${{ matrix.check.platform == 'ios' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 60 # an iOS onboarding check takes about 26 minutes; a retried or replaced run must still fit
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.file.outputs.plan).verifyNative }}
    env:
      QA_PLATFORM: ${{ matrix.check.platform }}
      QA_APP_FILE: ${{ matrix.check.platform == 'ios' && 'Thunderbolt Dev.app' || 'app-debug.apk' }}
      QA_FP: ${{ matrix.check.fp }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # Its "Analyze with AI" banner otherwise fills a failed run's error.
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
    steps:
      # A pattern, since a fix that failed or gave up built no app: a missing name would fail with an error.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qa-patched-${{ matrix.check.fp }}-${{ matrix.check.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apps/patched
      # No app, no verdict: the device steps below skip themselves on this flag.
      - name: Note a missing patched app
        run: if [ ! -f "$RUNNER_TEMP/apps/patched/app.tar" ]; then echo "QA_NO_DEVICE=true" >> "$GITHUB_ENV"; fi
      - *pass-marker
      - *checkout
      - *setup-bun
      - *restore-bun-linux
      - *install
      - *setup-java
      - *restore-system-image
      - *device-tools
      - if: env.QA_NO_DEVICE != 'true' && matrix.check.unpatched
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-native-${{ matrix.check.platform }}${{ startsWith(matrix.check.session, 'c1-first-run-') && '-onboarding' || '' }}
          path: ${{ runner.temp }}/apps/original
      - *unpack-apps
      # Downloaded after the fix artifact, so the files from before the fix agent ran win.
      - if: env.QA_NO_DEVICE != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qa-fix-${{ matrix.check.fp }}-${{ github.run_attempt }}
          path: qa-out
      - *download-replay
      - if: env.QA_NO_DEVICE != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-verified-weekly
          path: qa-out
      - *device
      - name: Start the stack
        if: env.QA_NO_DEVICE != 'true'
        run: .github/qa/scripts/stack.sh start native
      # Exits non-zero when the patch fails the flow, so the pass below rests on this step's outcome.
      - name: Run the flow on the patched app
        id: run
        if: env.QA_NO_DEVICE != 'true'
        continue-on-error: true
        env:
          FLOW: ${{ matrix.check.flow }}
          SESSION: ${{ matrix.check.session }}
          ORIGINAL: ${{ matrix.check.unpatched && format('{0}/apps/original/{1}', runner.temp, env.QA_APP_FILE) || '' }}
        run: |
          .github/qa/scripts/native.sh verify-run "$QA_PLATFORM" "$QA_DEVICE_ID" "$RUNNER_TEMP/apps/patched/$QA_APP_FILE" \
            "$FLOW" "$SESSION" "qa-out/verify/$QA_FP.$QA_PLATFORM.json" ${ORIGINAL:+"$ORIGINAL"}
      # The verdict and the videos, for a person.
      - if: always() && env.QA_NO_DEVICE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-verify-${{ matrix.check.fp }}-${{ matrix.check.platform }}
          path: qa-out/verify/
          if-no-files-found: ignore
          retention-days: 7
      - if: always() && steps.run.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.check.fp }}-${{ matrix.check.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7

  # Isolated like the real replay leg: a fresh checkout's backend serves the frontend the fix job built, so the
  # patch reaches no process that holds a key.
  verify-real:
    name: verify-real ${{ matrix.task.fp }}
    needs: [build, file, fix]
    if: ${{ !cancelled() && needs.file.outputs.real != '' && fromJSON(needs.file.outputs.real)[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.real) }}
    env:
      QA_OUT: qa-out
      QA_FP: ${{ matrix.task.fp }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - *restore-browsers
      - *install-browsers
      - *download-replay
      # A pattern, since a fix that failed or gave up built no frontend: a missing name would fail with an error.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qa-fix-dist-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: qa-dist-fix
      - name: Start the stack on the real providers
        if: hashFiles('qa-dist-fix/**') != ''
        env:
          QA_REAL_PROVIDERS: 'true'
          QA_BACKEND_USER: qa-backend
          ANTHROPIC_API_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          TINFOIL_API_KEY: ${{ secrets.QA_TINFOIL_API_KEY }}
          TINFOIL_ENCLAVE_URL: ${{ secrets.QA_TINFOIL_ENCLAVE_URL }}
          EXA_API_KEY: ${{ secrets.QA_EXA_API_KEY }}
        run: .github/qa/scripts/stack.sh start qa-dist-fix
      - name: Take root away from the job's user
        if: hashFiles('qa-dist-fix/**') != ''
        run: .github/qa/scripts/stack.sh lock
      - name: Replay the spec on the patched frontend
        id: replay
        if: hashFiles('qa-dist-fix/**') != ''
        continue-on-error: true
        env:
          SPEC: ${{ matrix.task.spec }}
        run: bunx playwright test --config .github/qa/playwright.config.ts --repeat-each=3 --retries=0 "$SPEC"
      - *pass-marker
      - if: always() && steps.replay.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-real-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7

  # Runs the unit tests a web patch adds or changes, which the fix agent wrote, so the job holds no secret and no
  # environment. They must fail on a fresh checkout with only the patch's test files and pass with the whole patch.
  # The check step succeeds only when both went that way, and the pass is uploaded on its outcome. The tests run as
  # another OS user: the job's own user holds, in every upload step, the token that uploads artifacts and writes the
  # Actions cache, and a process of the same user could read it in /proc.
  verify-tests:
    name: verify-tests ${{ matrix.task.fp }}
    needs: [build, file, fix]
    if: ${{ !cancelled() && needs.file.outputs.tests != '' && fromJSON(needs.file.outputs.tests)[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # the cold installs take a few minutes; a few test files run in seconds, twice
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.tests) }}
    env:
      QA_FP: ${{ matrix.task.fp }}
      # fix.ts runs each `bun test` as this user and git as the job's user.
      QA_TEST_USER: qa-test
    steps:
      - *pass-marker
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - &install-cli
        name: Install the CLI's dependencies
        run: cd cli && bun install --frozen-lockfile
      # This attempt's fix output only, by pattern: when the fix job ran in an earlier attempt there is none, the
      # check fails, and publish hands the ticket to a person.
      - &download-fix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qa-fix-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: qa-out
      # Needs root, so before the lock (see the fix job).
      - *test-user
      - name: Take root away from the job's user
        run: .github/qa/scripts/stack.sh lock
      - name: Check that the patch's tests fail without the fix and pass with it
        id: tests
        continue-on-error: true
        run: bun .github/qa/scripts/fix.ts tests --out qa-out --fp "$QA_FP"
      # A process a test left behind would otherwise outlive the check.
      - *stop-test-user
      - if: always() && steps.tests.outcome == 'success' && steps.stop-tests.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7

  # The PR checks of ci.yml a fix can fail, on the tree publish would push (`stage` in fix.ts, which publish commits
  # with). A job of its own rather than steps of verify-tests: it checks native tasks too, and it keeps the tree
  # applied, where verify-tests applies and takes back parts of the patch on its checkout.
  verify-checks:
    name: verify-checks ${{ matrix.task.fp }}
    needs: [build, file, fix]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).fixes[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # cold installs, then bun run check, the catalogs and the 5x suites of each touched tree
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.plan).fixes }}
    env:
      QA_FP: ${{ matrix.task.fp }}
      # fix.ts runs each check as this user and git as the job's user.
      QA_TEST_USER: qa-test
    steps:
      - *pass-marker
      - *checkout
      # Lingui's CLI runs under Node and needs 22.19 or later, as in ci.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - *setup-bun
      - *restore-bun
      - *install
      - *install-cli
      # The original repro specs and the plan come after the fix output, so the pre-fix files win, as in publish.
      - *download-fix
      - *download-replay
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-filed
          path: qa-out
      - *test-user
      # The license and catalog checks run git as the test user.
      - name: Let the test user run git in the checkout
        run: sudo -n -H -u "$QA_TEST_USER" git config --global --add safe.directory "$PWD"
      # Nothing to gate when the agent gave up or left no patch, or a visual task has no check: publish hands those
      # tickets to a person before it looks for this job's pass.
      - name: Check that there is a tree to gate
        id: tree
        env:
          VISUAL_WEB: ${{ matrix.task.kind == 'visual' && !matrix.task.flow }}
        run: |
          usable=true
          if [ -e "qa-out/fix/$QA_FP.diagnosis.md" ] || [ ! -s "qa-out/fix/$QA_FP.patch" ]; then usable=false; fi
          if [ "$VISUAL_WEB" = true ] && [ ! -e "qa-out/fix-$QA_FP/repro/check.spec.ts" ]; then usable=false; fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"
      # Before the patch lands: from here on no step loads a file of the patched tree as the job's user.
      - name: Take root away from the job's user
        run: .github/qa/scripts/stack.sh lock
      # One process, loaded before it applies the patch, stages and commits the tree publish would push and runs the
      # checks on it as the test user.
      - name: Run the PR checks on the tree publish would push
        id: checks
        if: steps.tree.outputs.usable == 'true'
        continue-on-error: true
        run: bun .github/qa/scripts/fix.ts gate --out qa-out --fp "$QA_FP"
      - *stop-test-user
      - if: always() && steps.checks.outcome == 'success' && steps.stop-tests.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-pass-${{ matrix.task.fp }}-checks-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pass.txt
          retention-days: 7

  publish:
    name: publish ${{ matrix.task.fp }}
    needs: [build, file, fix, verify-native-run, verify-real, verify-tests, verify-checks]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).fixes[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: qa-agent
    permissions:
      # Lists the run's artifacts, whose names carry the checks' passes.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.plan).fixes }}
    env:
      QA_FP: ${{ matrix.task.fp }}
      HUSKY: 0
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      # No lifecycle scripts and no git hooks in the one job that holds a write token: husky's `prepare` would
      # install a pre-commit hook that runs formatters over the agent's patch.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # The original specs and the plan are downloaded after the fix output, so the pre-fix files win. This attempt's
      # fix output only, as publish needs this attempt's passes: by pattern, so a fix job that ran only in an earlier
      # attempt, or whose secret scan failed, leaves no patch, and publish hands the ticket to a person.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qa-fix-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: qa-out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-fix-status-${{ matrix.task.fp }}-${{ github.run_attempt }}
          path: qa-out/status
      - *download-replay
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-filed
          path: qa-out
      # Every check's pass is an artifact `qa-pass-<fp>-<check>-<run attempt>`, which its job uploads only under an
      # `if:` on the check step's outcome, and publish needs one of this attempt for every check the task needs. It
      # reads the names alone: no file is read, and a download of a missing name would fail with an error annotation.
      - name: List the run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' > qa-out/artifacts.txt

      - name: Create the GitHub App token
        id: app-token
        if: needs.build.outputs.live == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        # The app's other permissions, and every other repository it is installed on, stay out of the token.
        with: &app-token
          client-id: ${{ secrets.QA_APP_CLIENT_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          repositories: thunderbolt
          permission-contents: write
          permission-pull-requests: write

      - name: Commit as the app
        if: needs.build.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Publish a draft PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun .github/qa/scripts/fix.ts publish --out qa-out --fp "$QA_FP" ${{ needs.build.outputs.live == 'true' && '--live' || '' }}

  # By hand only, before the QA is enabled, so it has no kill switch. It mints the token publish would get, which
  # fails if the app lacks a requested permission, and writes nothing.
  app-check:
    if: github.event_name == 'workflow_dispatch' && inputs.app_check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qa-agent
    permissions: {}
    steps:
      - name: Create the GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: *app-token
      - name: Check that the token reaches only this repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          echo "App: $APP_SLUG"
          repos=$(gh api /installation/repositories --jq '[.repositories[].full_name]')
          echo "Repositories the token reaches: $repos"
          jq --exit-status --arg repo "$GITHUB_REPOSITORY" '. == [$repo]' <<< "$repos" > /dev/null

  report:
    needs:
      - build
      - explore
      - build-native
      - explore-native
      - replay
      - replay-native
      - judge
      - file
      - fix
      - verify-native-build
      - verify-native-run
      - verify-real
      - verify-tests
      - verify-checks
      - publish
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: qa-agent
    permissions:
      contents: read
    env:
      HAS_HEARTBEAT: ${{ secrets.QA_HEARTBEAT_URL != '' }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      # Every result is optional here: the report shows whatever the run got to.
      - continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{qa-explore-*,qa-sync-*,qa-real-*,qa-ios-*,qa-android-*,qa-fix-session-*,qa-verified-weekly,qa-filed}'
          path: qa-out
          merge-multiple: true
      - continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{qa-canary-*,qa-verified-canary}'
          path: qa-out-canary
          merge-multiple: true

      - name: Report
        env:
          LEGS: ${{ needs.explore.result != 'skipped' && needs.build.outputs.legs || '[]' }}
          NATIVE_LEGS: ${{ needs.explore-native.result != 'skipped' && needs.build.outputs.nativeLegs || '[]' }}
          CANARIES: ${{ needs.build.outputs.canaries }}
          FIX_FROM_RUN: ${{ inputs.fix_from_run }}
        run: |
          # The findings, tickets and scorecard came from the earlier run, whose own report already lists them.
          if [ -n "$FIX_FROM_RUN" ]; then
            rm -f qa-out/verified.json qa-out/filed.json qa-out/scorecard.json
            echo "# Fix-only run: fixes the tickets of run $FIX_FROM_RUN, explores nothing" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A leg without a result message (a crash, a tripwire, a timeout) still gets a session, marked error/timeout.
          jq -r '.[] | "\(.out) \(.charter)"' <<< "$LEGS $NATIVE_LEGS" | while read -r out charter; do
            timed_out=()
            if [ -f "$out/$charter/timed-out" ]; then timed_out=(--timed-out); fi
            bun .github/qa/scripts/report.ts session --execution-file "$out/$charter/execution.json" --charter "$charter" \
              --out "$out" "${timed_out[@]}"
          done
          # Missing when the guard failed; report.ts needs the directory to exist.
          mkdir -p qa-out
          # summary exits 1 when every explore session errored or timed out (a revoked key, a retired model id) while
          # the jobs stayed green: write both reports, then fail so notify-on-failure fires.
          status=0
          bun .github/qa/scripts/report.ts summary --out qa-out || status=1
          if [ "$CANARIES" = 0 ]; then
            echo '# Canary leg skipped: no recent fix from main could be reverted (the build log says why)' \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ -d qa-out-canary ]; then
            echo '# Canary leg: recent fixes reverted, never filed' >> "$GITHUB_STEP_SUMMARY"
            bun .github/qa/scripts/report.ts summary --out qa-out-canary || status=1
          fi
          exit "$status"

      # The dead-man switch watches the Monday run on main only, and only a run that worked.
      - name: Heartbeat
        if: >-
          ${{ env.HAS_HEARTBEAT == 'true' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          HEARTBEAT_URL: ${{ secrets.QA_HEARTBEAT_URL }}
        run: curl --fail --silent --show-error --retry 3 "$HEARTBEAT_URL"

  # By hand only: the calibration build must make the layout check report the covered Email field.
  native-control:
    name: native-control ${{ matrix.target.platform }}
    if: vars.QA_AGENT_ENABLED == 'true' && inputs.native_control && !inputs.app_check
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: ios, runner: macos-latest }
          - { platform: android, runner: ubuntu-24.04 }
    env:
      QA_PLATFORM: ${{ matrix.target.platform }}
      QA_APP_FILE: ${{ matrix.target.platform == 'ios' && 'Thunderbolt Dev.app' || 'app-debug.apk' }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # Its "Analyze with AI" banner otherwise fills a failed run's error.
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun-linux
      - *install
      - *setup-java
      - *native-build-tools
      - *restore-system-image
      - *device-tools
      - name: Build the control app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: .github/qa/scripts/native.sh build "$QA_PLATFORM" "$RUNNER_TEMP/qa-control-app" control
      # Only this job builds before it boots the emulator, and only it stalled on the storage check.
      - name: Stop the Gradle daemons
        if: matrix.target.platform == 'android'
        working-directory: src-tauri/gen/android
        run: ./gradlew --stop
      - *device
      - name: Install the control app
        run: .github/qa/scripts/native.sh install "$QA_PLATFORM" "$QA_DEVICE_ID" "$RUNNER_TEMP/qa-control-app/$QA_APP_FILE"
      - name: Start the stack
        run: .github/qa/scripts/stack.sh start native
      - name: Run the positive control
        run: .github/qa/scripts/native.sh control "$QA_PLATFORM" "$QA_DEVICE_ID" "$RUNNER_TEMP/qa-control"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-native-control-${{ matrix.target.platform }}
          path: ${{ runner.temp }}/qa-control/
          if-no-files-found: ignore
          retention-days: 7
      # The folder above holds the WebView log; a failed control also needs the backend's.
      - name: Upload the stack log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-logs-control-${{ matrix.target.platform }}
          path: ${{ runner.temp }}/qa-stack.log
          if-no-files-found: ignore
          retention-days: 7

  notify:
    needs:
      - build
      - explore
      - build-native
      - explore-native
      - replay
      - replay-native
      - judge
      - file
      - fix
      - verify-native-build
      - verify-native-run
      - verify-real
      - verify-tests
      - verify-checks
      - publish
      - report
      - native-control
    if: ${{ always() && !cancelled() && needs.build.result != 'skipped' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/notify-on-failure.yml
    with:
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      # A fix-only run that passes must not close the incident a failed weekly run opened.
      incident: ${{ inputs.fix_from_run && 'QA weekly fix-only' || '' }}
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
