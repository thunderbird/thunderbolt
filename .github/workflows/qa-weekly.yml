name: QA weekly

# An AI agent uses the app like a person would, one charter per session, plus a free session that plays one case
# on every platform. Deterministic code then replays, judges, files and (optionally) fixes what it found. How it
# works, the secrets and variables, and the rule for calibrating the caps below: .github/qa/README.md.
#
# Trust zones: explore and replay run untrusted, model-written input, so they hold no Linear key and no write
# token. The replay step holds no secret at all: in the real-AI leg the provider keys sit with a backend that runs as
# another OS user, and the job's own user loses root first. Only the build job saves caches, because it runs before
# any untrusted code.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be filed and published instead of writing to Linear and GitHub
        type: boolean
        default: true
      charters:
        description: Comma-separated charter ids, free for the free session, e.g. c4-skills-projects,free (empty = all)
        type: string
        default: ''
      journey:
        description: Case id from .github/qa/journeys.json for the free session (empty = this week's)
        type: string
        default: ''
      autofix:
        description: Let the fix agent attempt confirmed bugs (also needs vars.QA_AUTOFIX_ENABLED)
        type: boolean
        default: false

concurrency:
  group: qa-weekly
  cancel-in-progress: false

permissions: {}

env:
  # Per-session caps. Initial values: recalibrate them with the rule in .github/qa/README.md.
  QA_EXPLORE_MAX_BUDGET_USD: 10
  QA_EXPLORE_MAX_TURNS: 400
  QA_EXPLORE_TIMEOUT_MINUTES: 60
  QA_FIX_MAX_BUDGET_USD: 20
  QA_FIX_MAX_TURNS: 200
  QA_FIX_TIMEOUT_MINUTES: 60

jobs:
  build:
    if: vars.QA_AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      verify: ${{ steps.plan.outputs.verify }}
      judge: ${{ steps.plan.outputs.judge }}
      live: ${{ steps.plan.outputs.live }}
      autofix: ${{ steps.plan.outputs.autofix }}
      canaries: ${{ steps.canaries.outputs.count }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the build job needs main's history, to pick the canaries. A string: a bare 0 is falsy here.
          fetch-depth: ${{ github.job == 'build' && '0' || '1' }}

      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &bun-cache
          path: |
            ~/.bun/install/cache
            node_modules
            backend/node_modules
          key: qa-bun-${{ hashFiles('bun.lock', 'backend/bun.lock') }}

      - &install
        name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &browser-cache
          path: ~/.cache/ms-playwright
          key: qa-browsers-${{ hashFiles('bun.lock') }}-mcp-0.0.83

      - &install-browsers
        name: Install browsers
        # The repo's Playwright replays specs; the Playwright MCP (pinned in .github/qa/mcp.json) drives its own
        # Chromium.
        run: |
          bunx playwright install --with-deps chromium
          npx --yes --package @playwright/mcp@0.0.83 playwright install chromium

      # Up to two recent fixes from main whose reversal applies to this tree: the canary build carries their bugs
      # again. The log says why every other fix was skipped. The canary build comes first and may fail without
      # failing the run: the canaries are then dropped, so the legs are planned without them.
      - name: Pick the canaries and build them
        id: canaries
        run: |
          bun .github/qa/scripts/canaries.ts --out "$RUNNER_TEMP/qa-canaries.json" --patch "$RUNNER_TEMP/qa-canary.patch"
          if [ -s "$RUNNER_TEMP/qa-canary.patch" ]; then
            git apply --reverse "$RUNNER_TEMP/qa-canary.patch"
            if ! .github/qa/scripts/stack.sh build qa-dist-canary; then
              echo "::warning::The canary build failed, so this run has no canary leg"
              echo '[]' > "$RUNNER_TEMP/qa-canaries.json"
            fi
            # Not optional: the normal builds and the guard must never see the reverted tree.
            git apply "$RUNNER_TEMP/qa-canary.patch"
            git diff --quiet
          fi
          echo "count=$(jq length "$RUNNER_TEMP/qa-canaries.json")" >> "$GITHUB_OUTPUT"

      - name: Plan the legs
        id: plan
        env:
          CHARTERS: ${{ inputs.charters }}
          JOURNEY: ${{ inputs.journey }}
          LIVE: ${{ vars.QA_LINEAR_ENABLED == 'true' && !inputs.dry_run && github.ref == 'refs/heads/main' }}
          AUTOFIX: >-
            ${{ vars.QA_AUTOFIX_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
            (github.event_name == 'schedule' || inputs.autofix) }}
        run: |
          # Commas and spaces both separate charter ids; the same list feeds the check and the legs below.
          only=$(jq --null-input --compact-output --arg charters "$CHARTERS" '[$charters | splits("[ ,]+") | select(. != "")]')
          if [ -n "$CHARTERS" ] && [ "$only" = '[]' ]; then echo "::error::No charter id in '$CHARTERS'"; exit 1; fi
          # The charters that explore with the real AI providers, free sessions included, are listed once, in the QA
          # scripts.
          real=$(bun -e "import { realAiCharters } from './.github/qa/scripts/findings'; console.log(JSON.stringify([...realAiCharters]))")
          # This week's case for the free session, unless the dispatch names one. It runs on every platform.
          journey=$(.github/qa/scripts/explore.sh journey "$JOURNEY")
          # shellcheck disable=SC2016 # jq variables
          # One explore session per leg. Each canary leg runs its fix's charter on the canary build and is never filed.
          all=$(jq --null-input --compact-output --argjson real "$real" --arg journey "$journey" \
            --argjson platforms "$(cat .github/qa/platforms.json)" --slurpfile canaries "$RUNNER_TEMP/qa-canaries.json" '
            {dist: "qa-dist", out: "qa-out", artifact: "qa-explore", mcp: ".github/qa/mcp.json", viewport: "1280x800",
             onboarding: false, real: false, postgres: false} as $leg
            | [{charter: "c1-first-run", onboarding: true},
               {charter: "c2-chat-power-user"},
               {charter: "c3-models-providers"},
               {charter: "c4-skills-projects"},
               {charter: "c5-widgets-connections"},
               {charter: "c6-settings-data"},
               {charter: "c7-two-devices", postgres: true, mcp: ".github/qa/mcp.json .github/qa/mcp-two-devices.json",
                artifact: "qa-sync"},
               {charter: "c8-phone", viewport: "390x844"}]
              + ($platforms | map({charter: "free-\($journey)-\(.id)", viewport, mcp}))
            | map($leg + . | if (.charter as $c | $real | index($c)) then .real = true | .artifact = "qa-real" else . end)
            | . + [$canaries[0][] as $canary | .[] | select(.charter == $canary.charter)
                   | .dist = "qa-dist-canary" | .out = "qa-out-canary" | .artifact = "qa-canary"]')
          # "free" selects the free session on every platform.
          unknown=$(jq --raw-output --argjson only "$only" '$only - map(.charter) - ["free"] | join(" ")' <<< "$all")
          if [ -n "$unknown" ]; then echo "::error::Unknown charter $unknown"; exit 1; fi
          legs=$(jq --compact-output --argjson only "$only" 'map(select(.charter as $c | $only == []
            or ($only | index($c)) or (($c | startswith("free-")) and ($only | index("free")))))' <<< "$all")
          # Replay each artifact prefix on the kind of stack its sessions explored: pglite, Postgres + PowerSync for c7
          # (sync), or the real AI providers (real). Sync and real findings share qa-out and are judged with the
          # weekly ones.
          verify=$(jq --compact-output '
            [{name: "weekly", out: "qa-out", artifact: "qa-explore", dist: "qa-dist",
              onboarding: any(.[]; .onboarding), postgres: false}]
            + if any(.[]; .artifact == "qa-sync")
              then [{name: "sync", out: "qa-out", artifact: "qa-sync", dist: "qa-dist", onboarding: false, postgres: true}]
              else [] end
            + if any(.[]; .artifact == "qa-real")
              then [{name: "real", out: "qa-out", artifact: "qa-real", dist: "qa-dist", onboarding: false, postgres: false,
                     real: true}]
              else [] end
            + if any(.[]; .artifact == "qa-canary")
              # The canary findings replay on the canary build, then on the normal one: a canary counts only when its
              # finding fails on the first and passes on the second. canaries.ts picks charters of one kind of AI.
              then any(.[]; .artifact == "qa-canary" and .real) as $real
                | [{name: "canary", out: "qa-out-canary", dist: "qa-dist-canary"},
                   {name: "canary-baseline", out: "qa-out-canary-baseline", dist: "qa-dist"}]
                | map(. + {artifact: "qa-canary", onboarding: false, postgres: false, real: $real})
              else [] end' <<< "$legs")
          {
            echo "legs=$legs"
            echo "verify=$verify"
            echo "judge=$(jq --compact-output 'map(select(.name == "weekly" or .name == "canary"))' <<< "$verify")"
            echo "live=$LIVE"
            echo "autofix=$AUTOFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Build the frontend (onboarding off, onboarding on)
        run: |
          .github/qa/scripts/stack.sh build qa-dist
          .github/qa/scripts/stack.sh build qa-dist-onboarding onboarding

      - name: Guard - smoke-test a fresh stack
        run: |
          .github/qa/scripts/stack.sh start qa-dist
          bunx playwright test --config .github/qa/playwright.config.ts --project control

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-dist
          path: qa-dist/
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-dist-onboarding
          path: qa-dist-onboarding/
          retention-days: 1
      - if: steps.canaries.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-dist-canary
          path: qa-dist-canary/
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-canaries
          path: ${{ runner.temp }}/qa-canaries.json
          retention-days: 7

  explore:
    name: explore ${{ matrix.leg.charter }}${{ matrix.leg.artifact == 'qa-canary' && ' (canary)' || '' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90 # outer bound: the explore step's own cap plus setup
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.legs) }}
    # From nightly.yml's linux job. An empty image skips the container, so only Postgres legs start them.
    services: &postgres-services
      postgres:
        image: ${{ matrix.leg.postgres && 'ghcr.io/thunderbird/thunderbolt/thunderbolt-postgres:latest' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POWERSYNC_DB_PASSWORD: myhighlyrandompassword
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      powersync:
        image: ${{ matrix.leg.postgres && 'ghcr.io/thunderbird/thunderbolt/thunderbolt-powersync:latest' || '' }}
        env:
          PS_PG_URI: postgresql://powersync_role:myhighlyrandompassword@postgres:5432/postgres
          PS_STORAGE_URI: postgresql://postgres:postgres@postgres:5432/powersync_storage
          PS_JWT_KEY_BASE64: ZW50ZXJwcmlzZS10aHVuZGVyYm9sdC1wb3dlcnN5bmMtand0LWRlZmF1bHQtc2VjcmV0
          PS_JWT_KID: enterprise-powersync
        ports:
          - 18081:8080
        options: --restart always
    env:
      QA_CHARTER: ${{ matrix.leg.charter }}
      QA_OUT: ${{ matrix.leg.out }}
      QA_MCP_VIEWPORT: ${{ matrix.leg.viewport }}
      DATABASE_URL: ${{ matrix.leg.postgres && 'postgresql://postgres:postgres@localhost:15434/postgres' || '' }}
      POWERSYNC_URL: ${{ matrix.leg.postgres && 'http://localhost:18081' || '' }}
    steps:
      - *checkout
      - *setup-bun
      - &restore-bun
        name: Restore Bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *bun-cache
      - *install
      - &restore-browsers
        name: Restore Playwright browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *browser-cache
      - *install-browsers

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB makes the CLI refuse to start without bubblewrap. With it, the processes the
      # agent starts run in a sandbox, so they cannot read the key from the CLI's /proc/<pid>/environ either. Same
      # install as claude-code-action's for allowed_non_write_users. It needs root, so it runs before the lock step.
      - &install-sandbox
        name: Install the subprocess sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor; older kernels lack the sysctl.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - &download-dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.leg.dist }}
          path: ${{ matrix.leg.dist }}
      - &download-onboarding
        if: matrix.leg.onboarding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-dist-onboarding
          path: qa-dist-onboarding

      - &postgres-setup
        name: Prepare Postgres and PowerSync
        if: matrix.leg.postgres
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POWERSYNC_CONTAINER: ${{ job.services.powersync.id }}
        # From nightly.yml's linux job.
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level = logical"
          docker restart "$POSTGRES_CONTAINER"
          for _ in $(seq 30); do docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres >/dev/null && break; sleep 2; done
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc 'SHOW wal_level')" = logical
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_publication WHERE pubname = 'powersync'")" = 1
          (cd backend && bunx drizzle-kit migrate)
          docker restart "$POWERSYNC_CONTAINER"
          ready() { curl --fail --silent --output /dev/null --max-time 2 http://localhost:18081/probes/readiness; }
          for _ in $(seq 30); do ready && break; sleep 3; done
          ready || { docker inspect --format 'Status: {{.State.Status}}, restarts: {{.RestartCount}}' "$POWERSYNC_CONTAINER"; exit 1; }

      - &start-stack
        name: Start the stack
        env:
          # Real providers only for the charters that need them, with QA-only keys, and only in a backend that runs
          # as the OS user qa-backend: stack.sh moves the keys into a file only that user can read.
          QA_REAL_PROVIDERS: ${{ matrix.leg.real }}
          QA_BACKEND_USER: ${{ matrix.leg.real && 'qa-backend' || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.leg.real && secrets.QA_ANTHROPIC_API_KEY || '' }}
          TINFOIL_API_KEY: ${{ matrix.leg.real && secrets.QA_TINFOIL_API_KEY || '' }}
          TINFOIL_ENCLAVE_URL: ${{ matrix.leg.real && secrets.QA_TINFOIL_ENCLAVE_URL || '' }}
          EXA_API_KEY: ${{ matrix.leg.real && secrets.QA_EXA_API_KEY || '' }}
          QA_DIST: ${{ matrix.leg.dist }}
          ONBOARDING_DIST: ${{ matrix.leg.onboarding && 'qa-dist-onboarding' || '' }}
        run: .github/qa/scripts/stack.sh start "$QA_DIST" ${ONBOARDING_DIST:+"$ONBOARDING_DIST"}

      # Root could read the keys from the backend and the secrets from the runner's memory. No step after this one
      # needs it.
      - &lock
        name: Take root away from the job's user
        if: matrix.leg.real
        run: .github/qa/scripts/stack.sh lock

      - name: Build the prompt
        id: prompt
        env:
          QA_MCP: ${{ matrix.leg.mcp }}
        run: |
          # The action keeps only the last of several --mcp-config files, so c7's two configs become one file.
          # shellcheck disable=SC2086 # one path per word
          jq --slurp '{mcpServers: (map(.mcpServers) | add)}' $QA_MCP > "$RUNNER_TEMP/qa-mcp.json"
          {
            echo 'text<<QA_PROMPT_EOF'
            .github/qa/scripts/explore.sh prompt "$QA_CHARTER" "$QA_OUT"
            echo 'QA_PROMPT_EOF'
            echo "start=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      # The browser tools can write files anywhere in the checkout, so no repo code runs in this job after the
      # explorer: the stack is stopped inline, a checksum tripwire guards the upload, and report.ts runs later. The
      # one repo file read afterwards is transcript.jq, a jq filter (no shell, no file access) the tripwire covers.
      - name: Record the checksums of the tracked files
        # Symlinks are skipped: one tracked link dangles, and the files they point to are tracked themselves.
        run: |
          git ls-files --stage -z | tr '\0' '\n' | awk -F '\t' '!/^120000 / { print $2 }' | tr '\n' '\0' |
            xargs -0 sha256sum > "$RUNNER_TEMP/qa-tracked.sha256"

      # Same flags as .github/qa/scripts/explore.sh. Only Write (inside the out dir) and the browser tools, no shell
      # and no file reads; `--setting-sources user` keeps the repo's agent instructions and skills out of the session.
      - name: Explore
        id: explore
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.QA_EXPLORE_TIMEOUT_MINUTES) }}
        env:
          # Keeps the Anthropic key out of every process the session starts (MCP servers, browsers).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-sonnet-5-5
            --setting-sources user
            --permission-mode dontAsk
            --tools Write
            --allowedTools "mcp__playwright__*" "mcp__playwright_b__*" "Edit(${{ env.QA_OUT }}/**)"
            --disallowedTools mcp__playwright__browser_run_code_unsafe mcp__playwright_b__browser_run_code_unsafe
            --strict-mcp-config
            --mcp-config ${{ runner.temp }}/qa-mcp.json
            --max-budget-usd ${{ env.QA_EXPLORE_MAX_BUDGET_USD }}
            --max-turns ${{ env.QA_EXPLORE_MAX_TURNS }}

      # Inline, from the pid files stack.sh wrote outside the checkout: the backend may hold provider keys. SIGKILL
      # for the serve script, so bash reads no more of a file the explorer may have rewritten. SIGTERM for its
      # servers: sudo passes it on to a backend running as another user, where a SIGKILL would orphan that backend.
      - &stop-stack
        name: Stop the stack
        if: always()
        run: |
          serve=$(cat "$RUNNER_TEMP/qa-stack.pid" 2>/dev/null || true)
          servers=$(cat "$RUNNER_TEMP/qa-stack.pids" 2>/dev/null || true)
          # shellcheck disable=SC2086 # one pid per word
          kill -9 $serve 2>/dev/null || true
          # shellcheck disable=SC2086
          kill $servers 2>/dev/null || true
          for pid in $serve $servers; do while kill -0 "$pid" 2>/dev/null; do sleep 0.2; done; done

      - name: Check that the checkout is unchanged
        id: tripwire
        if: always()
        # A changed tracked file means the explorer wrote into the repo: the job fails and uploads nothing.
        run: sha256sum --check --quiet --strict "$RUNNER_TEMP/qa-tracked.sha256"

      - name: Save the session
        if: always() && steps.tripwire.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.explore.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          START: ${{ steps.prompt.outputs.start }}
        run: |
          dir=$QA_OUT/$QA_CHARTER
          mkdir -p "$dir"
          # The explorer can write into its out dir: only what this step writes may reach the report.
          rm -f "$dir/execution.json" "$dir/timed-out" "$dir/transcript.json"
          # Only the result message's counters, and the tool calls with capped results for the coverage check: the
          # full execution file also holds the prompt and everything the model wrote.
          if [ -f "$EXECUTION_FILE" ]; then
            jq '[last(.[] | select(.type == "result")) | {type, subtype, is_error, total_cost_usd, num_turns, duration_ms, modelUsage}]' \
              "$EXECUTION_FILE" > "$dir/execution.json"
            jq --compact-output --from-file .github/qa/transcript.jq "$EXECUTION_FILE" > "$dir/transcript.json"
          fi
          # A step killed by its timeout leaves no execution file; the marker tells report.ts why.
          if [ $(( $(date +%s) - ${START:-$(date +%s)} )) -ge $(( QA_EXPLORE_TIMEOUT_MINUTES * 60 )) ]; then touch "$dir/timed-out"; fi

      # Artifacts are public, and GitHub masks secrets in logs only. The pages the explorer read could show a key (a
      # backend bug in a real-AI leg), so any key this job holds, found anywhere in the session output, means no
      # upload. Exact values only: a token-shaped pattern would also match a made-up key typed into a model form. The
      # session and the stack have ended, so no untrusted process is meant to be left to read this step's keys.
      - name: Check the session output for secrets
        id: secret-scan
        if: always() && steps.tripwire.outcome == 'success'
        env:
          QA_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          TINFOIL_KEY: ${{ matrix.leg.real && secrets.QA_TINFOIL_API_KEY || '' }}
          EXA_KEY: ${{ matrix.leg.real && secrets.QA_EXA_API_KEY || '' }}
        run: |
          for key in "$QA_KEY" "$TINFOIL_KEY" "$EXA_KEY"; do
            if [ -n "$key" ] && grep -rqF -- "$key" "$QA_OUT/$QA_CHARTER"; then
              echo "::error::The session output holds a secret, so nothing is uploaded."
              exit 1
            fi
          done

      - name: Upload findings, specs, attempts and the session result
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.leg.artifact }}-${{ matrix.leg.charter }}
          # The `*` keeps the <charter>/ directory inside the artifact: upload-artifact drops what precedes it.
          path: |
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/findings/*.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/repro/*.spec.ts
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/attempts/*.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/execution.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/transcript.json
            ${{ env.QA_OUT }}/${{ matrix.leg.charter }}*/timed-out
          if-no-files-found: warn
          retention-days: 7

  replay:
    name: replay ${{ matrix.leg.name }}
    needs: [build, explore]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job runs model-written specs. Only the real-AI legs (real, and the canary ones on real-AI charters) have an
    # environment, for the provider keys that their start step hands to a backend running as another user; the replay
    # step holds no secret.
    environment: ${{ matrix.leg.real && 'qa-agent' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.verify) }}
    services: *postgres-services
    env:
      QA_OUT: ${{ matrix.leg.out }}
      DATABASE_URL: ${{ matrix.leg.postgres && 'postgresql://postgres:postgres@localhost:15434/postgres' || '' }}
      POWERSYNC_URL: ${{ matrix.leg.postgres && 'http://localhost:18081' || '' }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - *restore-browsers
      - *install-browsers
      - *download-dist
      - *download-onboarding
      - name: Download the sessions' findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.leg.artifact }}-*
          path: ${{ matrix.leg.out }}
          merge-multiple: true
      - *postgres-setup
      - *start-stack
      - *lock

      - name: Replay the repro specs
        run: |
          mkdir -p "$QA_OUT"
          bun .github/qa/scripts/verify.ts replay --out "$QA_OUT"

      - name: Remove credentials and network data from traces
        id: sanitize
        if: always()
        run: |
          bun test scripts/sanitize-nightly-artifacts.test.ts --timeout 5000
          bun scripts/sanitize-nightly-artifacts.ts "$QA_OUT/replay"

      - name: Upload the replay
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-replay-${{ matrix.leg.name }}
          path: ${{ matrix.leg.out }}/
          retention-days: 7

  judge:
    name: judge ${{ matrix.leg.name }}
    needs: [build, replay]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.build.outputs.judge) }}
    env:
      QA_OUT: ${{ matrix.leg.out }}
    steps:
      # A fresh job, because the replayed specs could have rewritten any file in the replay job's checkout.
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-replay-${{ matrix.leg.name }}
          path: ${{ matrix.leg.out }}
      - name: Download the sync and real-AI replays
        if: matrix.leg.name == 'weekly'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Matches nothing when neither c7 nor a real-AI charter ran. Each artifact gets its own directory.
          pattern: 'qa-replay-{sync,real}'
          path: qa-out-legs
      # Each leg's stack health stays with its own replay job, which fails loudly when the stack was broken.
      - name: Add the sync and real-AI candidates
        if: matrix.leg.name == 'weekly'
        run: |
          for leg in qa-out-legs/*/; do
            [ -f "$leg/candidates.json" ] || continue
            jq --slurp '.[1] as $leg | .[0] | .confirmed += $leg.confirmed | .flaky += $leg.flaky
              | .observations += $leg.observations | .dropped += $leg.dropped | .deferred += $leg.deferred' \
              qa-out/candidates.json "$leg/candidates.json" > "$RUNNER_TEMP/candidates.json"
            cp -R "$leg." qa-out/
            mv "$RUNNER_TEMP/candidates.json" qa-out/candidates.json
          done
      - name: Judge the confirmed findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
        run: bun .github/qa/scripts/verify.ts judge --out "$QA_OUT"
      - name: Download the canary baseline
        if: matrix.leg.name == 'canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-replay-canary-baseline
          path: qa-out-canary-baseline
      - name: Download the canaries
        if: matrix.leg.name == 'canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-canaries
          path: qa-canaries
      # Writes canary.json. The canary leg is never filed: the file job reads only qa-verified-weekly.
      - name: Measure canary recall
        if: matrix.leg.name == 'canary'
        env:
          CHARTERS: ${{ inputs.charters }}
        run: |
          bun .github/qa/scripts/report.ts canary --out "$QA_OUT" --baseline qa-out-canary-baseline \
            --canaries qa-canaries/qa-canaries.json --charters "$CHARTERS"
      # Also when the judge failed: verified.json then shows why (an unhealthy stack drops every finding).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-verified-${{ matrix.leg.name }}
          path: |
            ${{ matrix.leg.out }}/verified.json
            ${{ matrix.leg.out }}/canary.json
          retention-days: 7

  file:
    needs: [build, judge]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa-agent
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.route.outputs.plan }}
    env:
      QA_OUT: qa-out
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      # c7's specs and videos come from the sync replay, c3's and c5's from the real one; all land in qa-out.
      - &download-replay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'qa-replay-{weekly,sync,real}'
          path: qa-out
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-verified-weekly
          path: qa-out
      # With a Linear key it also writes scorecard.json, the triage precision the brake reads.
      - name: File the confirmed findings
        env:
          LINEAR_API_KEY: ${{ secrets.QA_LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun .github/qa/scripts/file-findings.ts --out qa-out --run-url "$RUN_URL" ${{ needs.build.outputs.live == 'true' && '--live' || '' }}
      - name: Route fixable tickets
        id: route
        if: needs.build.outputs.autofix == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.QA_LINEAR_API_KEY }}
        run: |
          bun .github/qa/scripts/fix.ts route --out qa-out ${{ needs.build.outputs.live == 'true' && '--live' || '' }}
          echo "plan=$(jq --compact-output . qa-out/fix-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-filed
          path: |
            qa-out/filed.json
            qa-out/scorecard.json
            qa-out/fix-plan.json
          retention-days: 7

  fix:
    name: fix ${{ matrix.task.fp }}
    needs: [build, file]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).fixes[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 90 # outer bound: the fix step's own cap plus setup
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.plan).fixes }}
    env:
      QA_OUT: qa-out
      QA_FP: ${{ matrix.task.fp }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      - *restore-browsers
      - *install-browsers
      - *download-replay

      - name: Start the stack on the working tree
        run: .github/qa/scripts/stack.sh start dev

      - name: Build the prompt
        id: prompt
        env:
          TASK: ${{ toJSON(matrix.task) }}
        run: |
          {
            echo 'text<<QA_PROMPT_EOF'
            cat .github/qa/fix.md
            # shellcheck disable=SC2016 # Markdown backticks
            printf '\n## Task\n\n```json\n%s\n```\n' "$TASK"
            echo 'QA_PROMPT_EOF'
            echo "start=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - *install-sandbox

      # The tool rules keep the agent on task; they are not the boundary. This job holds no write token and
      # publishing is a separate, deterministic job.
      - name: Fix
        id: fix
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.QA_FIX_TIMEOUT_MINUTES) }}
        env:
          # Keeps the Anthropic key out of every command the agent runs, such as a test file it wrote.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5-5
            --setting-sources user
            --permission-mode dontAsk
            --tools "Read,Glob,Grep,Edit,Write,Bash"
            --allowedTools "Read,Glob,Grep,Edit(src/**),Edit(shared/**),Edit(backend/src/**),Edit(qa-out/fix/**),Bash(bun run check),Bash(bun run test:*),Bash(bun run test:backend),Bash(bun run i18n:extract),Bash(bunx playwright test --config .github/qa/playwright.config.ts ${{ matrix.task.spec }})"
            --disallowedTools "Bash(git:*),WebFetch,WebSearch"
            --max-budget-usd ${{ env.QA_FIX_MAX_BUDGET_USD }}
            --max-turns ${{ env.QA_FIX_MAX_TURNS }}

      # Only a finished session whose patch makes the original spec pass may become a PR. The spec comes fresh
      # from the artifact (the agent's commands could have changed qa-out/), and no secret is left in this job.
      - name: Download the original spec
        if: steps.fix.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'qa-replay-{weekly,sync}'
          path: qa-out-verify
          merge-multiple: true
      - name: Replay the spec on the patched code
        id: verify
        if: steps.fix.outcome == 'success'
        env:
          QA_OUT: qa-out-verify
          SPEC: ${{ matrix.task.spec }}
        run: bunx playwright test --config .github/qa/playwright.config.ts --repeat-each=3 --retries=0 "qa-out-verify/${SPEC#qa-out/}"

      - *stop-stack

      - name: Collect the patch
        if: always()
        env:
          SPEC: ${{ matrix.task.spec }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p qa-out/fix
          # A diagnosis makes publish hand the ticket to a person instead of opening a PR.
          if [ "$FIX_OUTCOME" != success ]; then
            echo "The fix session did not finish (step outcome: $FIX_OUTCOME), so its patch is not published." >> "qa-out/fix/$QA_FP.diagnosis.md"
          elif [ "$VERIFY_OUTCOME" != success ]; then
            echo "The repro spec still fails on the patched code, so the patch is not published." >> "qa-out/fix/$QA_FP.diagnosis.md"
          fi
          git add --all
          git diff --cached --binary HEAD > "qa-out/fix/$QA_FP.patch"
          cp "$SPEC" "qa-out/fix/$QA_FP.spec.ts"

      - name: Record the session metrics
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.fix.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          START: ${{ steps.prompt.outputs.start }}
        run: |
          timed_out=()
          if [ $(( $(date +%s) - ${START:-$(date +%s)} )) -ge $(( QA_FIX_TIMEOUT_MINUTES * 60 )) ]; then timed_out=(--timed-out); fi
          bun .github/qa/scripts/report.ts session --execution-file "$EXECUTION_FILE" --charter "fix-$QA_FP" --out qa-out "${timed_out[@]}"

      # The agent could write anything under qa-out/fix/, and artifacts are public: a secret in it means no upload.
      # JWT-shaped strings are left to publish's own check, because repo test fixtures contain some.
      - name: Check the fix output for secrets
        id: secret-scan
        if: always()
        env:
          QA_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
        run: |
          if { [ -n "$QA_KEY" ] && grep -rqF -- "$QA_KEY" qa-out/fix/; } ||
            grep -rqE '\bsk-[[:alnum:]_-]{8,}|lin_(api|oauth)_|gh[pousr]_[[:alnum:]]{20,}|github_pat_|xox[bp]-' qa-out/fix/; then
            echo "::error::qa-out/fix/ contains a secret, so nothing is uploaded."
            exit 1
          fi
      - if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-fix-${{ matrix.task.fp }}
          path: qa-out/fix/
          retention-days: 7
      - if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-fix-session-${{ matrix.task.fp }}
          path: qa-out/fix-*/session.json
          retention-days: 7

  publish:
    name: publish ${{ matrix.task.fp }}
    needs: [build, file, fix]
    if: ${{ !cancelled() && needs.file.outputs.plan != '' && fromJSON(needs.file.outputs.plan).fixes[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa-agent
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.file.outputs.plan).fixes }}
    env:
      QA_FP: ${{ matrix.task.fp }}
      HUSKY: 0
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      # No lifecycle scripts and no git hooks in the one job that holds a write token: husky's `prepare` would
      # install a pre-commit hook that runs formatters over the agent's patch.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # The original specs and the plan come from before the fix agent ran; only its patch comes from the fix job.
      - *download-replay
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-filed
          path: qa-out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-fix-${{ matrix.task.fp }}
          path: qa-out/fix

      - name: Create the GitHub App token
        id: app-token
        if: needs.build.outputs.live == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QA_APP_CLIENT_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit as the app
        if: needs.build.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Publish a draft PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.QA_LINEAR_API_KEY }}
        run: bun .github/qa/scripts/fix.ts publish --out qa-out --fp "$QA_FP" ${{ needs.build.outputs.live == 'true' && '--live' || '' }}

  report:
    needs: [build, explore, replay, judge, file, fix, publish]
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa-agent
    permissions:
      contents: read
    env:
      HAS_HEARTBEAT: ${{ secrets.QA_HEARTBEAT_URL != '' }}
    steps:
      - *checkout
      - *setup-bun
      - *restore-bun
      - *install
      # Every result is optional here: the report shows whatever the run got to.
      - continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{qa-explore-*,qa-sync-*,qa-real-*,qa-fix-session-*,qa-verified-weekly,qa-filed}'
          path: qa-out
          merge-multiple: true
      - continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{qa-canary-*,qa-verified-canary}'
          path: qa-out-canary
          merge-multiple: true

      - name: Report
        env:
          LEGS: ${{ needs.build.outputs.legs }}
          CANARIES: ${{ needs.build.outputs.canaries }}
          EXPLORE_RESULT: ${{ needs.explore.result }}
        run: |
          # Session metrics come from each explore job's result message, here rather than in the explorer's job.
          # A leg without one (a crash, a tripwire, a timeout) still gets a session, marked error or timeout.
          if [ "$EXPLORE_RESULT" != skipped ]; then
            jq -r '.[] | "\(.out) \(.charter)"' <<< "$LEGS" | while read -r out charter; do
              timed_out=()
              if [ -f "$out/$charter/timed-out" ]; then timed_out=(--timed-out); fi
              bun .github/qa/scripts/report.ts session --execution-file "$out/$charter/execution.json" --charter "$charter" \
                --out "$out" "${timed_out[@]}"
            done
          fi
          # Missing when the guard failed; report.ts needs the directory to exist.
          mkdir -p qa-out
          # summary exits 1 when every explore session errored or timed out (a revoked key, a retired model id),
          # while the jobs stayed green. Write both reports, then fail the step so notify-on-failure fires.
          status=0
          bun .github/qa/scripts/report.ts summary --out qa-out || status=1
          if [ "$CANARIES" = 0 ]; then
            echo '# Canary leg skipped: no recent fix from main could be reverted (the build log says why)' \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ -d qa-out-canary ]; then
            echo '# Canary leg: recent fixes reverted, never filed' >> "$GITHUB_STEP_SUMMARY"
            bun .github/qa/scripts/report.ts summary --out qa-out-canary || status=1
          fi
          exit "$status"

      # The dead-man switch watches the Monday run on main only, and only a run that worked.
      - name: Heartbeat
        if: >-
          ${{ env.HAS_HEARTBEAT == 'true' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          HEARTBEAT_URL: ${{ secrets.QA_HEARTBEAT_URL }}
        run: curl --fail --silent --show-error --retry 3 "$HEARTBEAT_URL"

  notify:
    needs: [build, explore, replay, judge, file, fix, publish, report]
    if: ${{ always() && !cancelled() && needs.build.result != 'skipped' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/notify-on-failure.yml
    with:
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
