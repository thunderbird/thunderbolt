name: Nightly E2E

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: preview
    services:
      postgres:
        image: ghcr.io/thunderbird/thunderbolt/thunderbolt-postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POWERSYNC_DB_PASSWORD: myhighlyrandompassword
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      powersync:
        image: ghcr.io/thunderbird/thunderbolt/thunderbolt-powersync:latest
        env:
          PS_PG_URI: postgresql://powersync_role:myhighlyrandompassword@postgres:5432/postgres
          PS_STORAGE_URI: postgresql://postgres:postgres@postgres:5432/powersync_storage
          PS_JWT_KEY_BASE64: ZW50ZXJwcmlzZS10aHVuZGVyYm9sdC1wb3dlcnN5bmMtand0LWRlZmF1bHQtc2VjcmV0
          PS_JWT_KID: enterprise-powersync
        ports:
          - 18081:8080
        options: --restart always
    env:
      E2E_NIGHTLY_UNIQUE_USERS: 'true'
      NIGHTLY_DATABASE_URL: postgresql://postgres:postgres@localhost:15434/postgres
      NIGHTLY_POWERSYNC_URL: http://localhost:18081
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:15434/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile

      - name: Install Chromium and Firefox
        run: bunx playwright install --with-deps chromium firefox

      - name: Check spec collection
        run: bun run e2e:check-collected

      - name: Enable logical replication and verify PostgreSQL init
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level = logical"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'PostgreSQL did not become ready after restart'
              exit 1
            fi
            sleep 2
          done
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc 'SHOW wal_level')" = logical
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_publication WHERE pubname = 'powersync'")" = 1
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_roles WHERE rolname = 'powersync_role'")" = 1
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname = 'powersync_storage'")" = 1

      - name: Migrate PostgreSQL
        run: cd backend && bunx drizzle-kit migrate

      - name: Restart PowerSync after database setup
        env:
          POWERSYNC_CONTAINER: ${{ job.services.powersync.id }}
        run: docker restart "$POWERSYNC_CONTAINER"

      - name: Wait for PowerSync
        env:
          POWERSYNC_CONTAINER: ${{ job.services.powersync.id }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Status}}' "$POWERSYNC_CONTAINER")
            if [ "$status" != running ]; then
              echo "PowerSync stopped before readiness: $status"
              docker inspect --format 'Exit code: {{.State.ExitCode}}, OOM killed: {{.State.OOMKilled}}, restarts: {{.RestartCount}}' "$POWERSYNC_CONTAINER"
              exit 1
            fi
            if curl --fail --silent --output /dev/null --max-time 2 http://localhost:18081/probes/readiness; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'PowerSync did not become ready after 30 attempts'
              docker inspect --format 'Status: {{.State.Status}}, exit code: {{.State.ExitCode}}, OOM killed: {{.State.OOMKilled}}, restarts: {{.RestartCount}}' "$POWERSYNC_CONTAINER"
              exit 1
            fi
            sleep 3
          done

      - name: Run Chromium and Firefox desktop and mobile
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
          TINFOIL_ENCLAVE_URL: ${{ secrets.TINFOIL_ENCLAVE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: bunx playwright test --config playwright.nightly.config.ts

      - name: Remove credentials and network data from trace attachments
        id: sanitize
        if: always()
        run: |
          bun test scripts/sanitize-nightly-artifacts.test.ts --timeout 5000
          bun scripts/sanitize-nightly-artifacts.ts playwright-report

      - name: Upload failure report
        if: failure() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-linux-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 120
    environment: preview
    env:
      E2E_NIGHTLY_UNIQUE_USERS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile

      - name: Install WebKit
        run: bunx playwright install webkit

      - name: Run WebKit desktop and iPhone
        env:
          VITE_DB_DIAGNOSTIC: 'true'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
          TINFOIL_ENCLAVE_URL: ${{ secrets.TINFOIL_ENCLAVE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: bunx playwright test --config playwright.nightly.config.ts

      - name: Upload safe database outcomes for every WebKit attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-webkit-db-diagnostics
          path: test-results/**/db-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove credentials and network data from trace attachments
        id: sanitize
        if: always()
        run: |
          bun test scripts/sanitize-nightly-artifacts.test.ts --timeout 5000
          bun scripts/sanitize-nightly-artifacts.ts playwright-report

      - name: Upload failure report
        if: failure() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-macos-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  native-linux:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Linux drivers and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file pkg-config libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            webkit2gtk-driver xvfb ffmpeg
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile
          cargo install tauri-driver --locked

      - name: Run native Linux smoke
        env:
          VITE_AUTH_MODE: thunderbolt
          VITE_SKIP_ONBOARDING: 'true'
          VITE_AUTH_ENABLE_ANONYMOUS: 'false'
          VITE_BYPASS_WAITLIST: 'false'
          VITE_THUNDERBOLT_CLOUD_URL: http://localhost:8000/v1
        run: |
          ./e2e/native-smoke/services.sh > "$RUNNER_TEMP/native-services.log" 2>&1 &
          services_pid=$!
          trap 'kill "$services_pid" 2>/dev/null || true' EXIT
          bun tauri build --debug --no-bundle --config src-tauri/tauri.dev.conf.json
          ./e2e/native-smoke/linux.sh

      - name: Upload native Linux video
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-native-linux-video
          path: /tmp/thu-886-native-smoke/linux.mp4
          if-no-files-found: ignore
          retention-days: 7

  native-ios:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies and iOS driver
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile
          rustup target add aarch64-apple-ios-sim
          brew install ios-deploy mobile-dev-inc/tap/maestro

      - name: Boot iPhone simulator
        run: |
          simulator_udid=$(xcrun simctl list -j devices available | bun -e '
            const runtimes = Object.entries(JSON.parse(await Bun.stdin.text()).devices)
            const devices = runtimes.filter(([name]) => name.includes(".iOS-"))
              .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true })).at(-1)?.[1]
            const phone = devices?.find(({ name }) => name.startsWith("iPhone"))
            if (!phone) throw new Error("No iPhone simulator available")
            console.log(phone.udid)
          ')
          simulator_name='Thunderbolt Native Smoke'
          xcrun simctl rename "$simulator_udid" "$simulator_name"
          if ! xcrun simctl list devices booted | grep -q "$simulator_udid"; then
            xcrun simctl boot "$simulator_udid"
          fi
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "IOS_SIMULATOR_NAME=$simulator_name" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run native iOS smoke
        env:
          VITE_AUTH_MODE: thunderbolt
          VITE_SKIP_ONBOARDING: 'true'
          VITE_AUTH_ENABLE_ANONYMOUS: 'false'
          VITE_BYPASS_WAITLIST: 'false'
          VITE_THUNDERBOLT_CLOUD_URL: http://localhost:8000/v1
          VITE_DB_DIAGNOSTIC: 'true'
        run: |
          ./e2e/native-smoke/services.sh > "$RUNNER_TEMP/native-services.log" 2>&1 &
          services_pid=$!
          bun tauri ios dev --config src-tauri/tauri.dev.conf.json "$IOS_SIMULATOR_NAME" > "$RUNNER_TEMP/native-ios-build.log" 2>&1 &
          tauri_pid=$!
          trap 'kill "$services_pid" "$tauri_pid" 2>/dev/null || true' EXIT
          for attempt in {1..180}; do
            if xcrun simctl get_app_container "$IOS_SIMULATOR_UDID" net.thunderbird.thunderbolt.dev app >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$tauri_pid"; then
              echo "Tauri exited before simulator install (attempt $attempt)"
              cat "$RUNNER_TEMP/native-ios-build.log"
              exit 1
            fi
            sleep 5
          done
          if ! xcrun simctl get_app_container "$IOS_SIMULATOR_UDID" net.thunderbird.thunderbolt.dev app; then
            tail -100 "$RUNNER_TEMP/native-ios-build.log"
            exit 1
          fi
          if ! ./e2e/native-smoke/ios.sh; then
            grep -E '\[db-diagnostic\]|\[init\]' "$RUNNER_TEMP/native-ios-build.log" | tail -25 || true
            exit 1
          fi

      - name: Upload native iOS video
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-native-ios-video
          path: /tmp/thu-886-native-smoke/ios.mp4
          if-no-files-found: ignore
          retention-days: 7

  heartbeat:
    if: >-
      always() && !cancelled() &&
      (needs.linux.result == 'success' || needs.linux.result == 'failure') &&
      (needs.macos.result == 'success' || needs.macos.result == 'failure')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Signal completed Nightly run
        env:
          HEARTBEAT_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
        run: curl --fail --silent --show-error --retry 3 "$HEARTBEAT_URL"

  notify:
    needs: [linux, macos, native-ios, native-linux]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'skipped')) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/notify-on-failure.yml
    with:
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
