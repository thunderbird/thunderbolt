name: Frontend Serving

on:
  pull_request:
    paths:
      - 'deploy/config/**'
      - 'deploy/docker/frontend.Dockerfile'
      - '.github/workflows/frontend-serving.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/config/**'
      - 'deploy/docker/frontend.Dockerfile'
      - '.github/workflows/frontend-serving.yml'

permissions:
  contents: read

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: docker pull nginxinc/nginx-unprivileged:alpine
      - run: bun test --cwd=deploy/config nginx.test.ts --timeout 5000
