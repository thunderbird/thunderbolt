<!doctype html>
<html lang="en">
  <head>
    <title>In-field icon</title>
  </head>
  <body>
    <!-- A clear button drawn over the field's right edge scrolls with the field, so it covers nothing. -->
    <div style="position: relative; width: 300px">
      <input placeholder="Search locations…" autofocus style="width: 100%; height: 44px; box-sizing: border-box" />
      <button style="position: absolute; top: 8px; right: 0">Clear</button>
    </div>
  </body>
</html>
