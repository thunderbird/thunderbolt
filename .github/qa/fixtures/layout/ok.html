<!doctype html>
<html lang="en">
  <head>
    <title>Ok</title>
  </head>
  <body>
    <form>
      <label for="email">Email</label>
      <input id="email" type="email" />
      <textarea aria-label="Notes"></textarea>
      <select aria-label="Plan">
        <option>Free</option>
      </select>
      <a href="#terms">Terms</a>
      <button>Sign up</button>
    </form>
    <!-- Controls named every way the probe knows, the onboarding consent checkbox first: a Radix checkbox button
         named by a label pointing at its id. -->
    <button type="button" role="checkbox" aria-checked="false" id="terms-agreement"></button>
    <label for="terms-agreement">I agree to the Privacy Policy</label>
    <label><input type="checkbox" /> Remember me</label>
    <span id="news">Send me news</span>
    <input type="radio" aria-labelledby="news" />
    <a href="#home"><img src="data:," alt="Home" /></a>
    <input placeholder="Search" />
    <!-- Unnamed, but out of a screen reader's reach or out of sight. -->
    <input type="checkbox" aria-hidden="true" />
    <div inert><button></button></div>
    <button style="display: none"></button>
    <!-- A short list on a page that does not scroll: its lower links are clipped, and the text under them is not on
         top of them. -->
    <div style="height: 60px; overflow: auto">
      <a href="#1" style="display: block">Chat 1</a>
      <a href="#2" style="display: block">Chat 2</a>
      <a href="#3" style="display: block">Chat 3</a>
      <a href="#4" style="display: block">Chat 4</a>
      <a href="#5" style="display: block">Chat 5</a>
    </div>
    <p>Recent</p>
    <!-- A collapsed drawer parked past the left edge, like the desktop sidebar. -->
    <nav style="position: fixed; top: 0; left: -300px; width: 250px">
      <a href="#chats">Chats</a>
    </nav>
    <!-- A closed menu that fades out in place, half past the bottom edge. -->
    <div style="position: fixed; bottom: -20px; left: 0; opacity: 0">
      <button style="height: 40px">Rename</button>
    </div>
  </body>
</html>
