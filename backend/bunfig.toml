# Preload instrumentation to ensure OpenTelemetry SDK initializes
# before any instrumented modules are imported (when OTEL is configured)
preload = ["./src/config/instrumentation.ts"]

# Mirror the repo root's supply-chain quarantine: hold every new dependency version
# for 7 days before it is installable, which blunts a compromised-release window.
# Bun reads bunfig.toml from the current working directory, so install from backend/
# uses this file, not the root's; hence the duplication (cli/bunfig.toml does the same).
[install]
minimumReleaseAge = 604800 # 7 days in seconds
minimumReleaseAgeExcludes = [
  # Only to land better-auth 1.7.16 inside the quarantine; remove these entries after 2026-11-10.
  "better-auth",
  "better-call",
  "@better-auth/core",
  "@better-auth/telemetry",
  "@better-auth/drizzle-adapter",
  "@better-auth/kysely-adapter",
  "@better-auth/memory-adapter",
  "@better-auth/mongo-adapter",
  "@better-auth/prisma-adapter",
  "@better-auth/api-key",
  "@better-auth/passkey",
  "@better-auth/sso",
]

[test]
# Preload test setup to initialize database before any tests run
# This ensures expensive initialization happens outside of test timeouts
preload = ["./src/test-utils/test-setup.ts"]
