services:
  powersync:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    image: docker.io/journeyapps/powersync-service:latest
    command: ["start", "-r", "unified"]
    volumes:
      - ./config/config.yaml:/config/config.yaml:Z
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    ports:
      # Defaults preserve dev behaviour; the E2EE harness overrides via
      # POWERSYNC_PORT / POSTGRES_PORT (scripts/run-e2ee-powersync.sh) so a
      # running dev stack is never disturbed.
      - "${POWERSYNC_PORT:-8080}:8080"

  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5432
    volumes:
      # postgres:18+ expects the volume mount at /var/lib/postgresql (without the /data
      # suffix); the image manages a version-specific subdirectory like 18/docker inside.
      # Mounting at /var/lib/postgresql/data — the postgres:17 default — makes 18+ refuse
      # to start with "(unused mount/volume)". See docker-library/postgres#1259.
      - pg_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d:Z
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
