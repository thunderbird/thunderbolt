name: AI Evals

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite to run
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full
          - both

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Same-repo PR code receives CI-scoped provider keys under accepted collaborator trust.
  # Fork support awaits a protected pull_request_target + approve-fork environment gate.
  pr-smoke:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            backend/node_modules
          key: evals-bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'backend/bun.lock') }}
          restore-keys: |
            evals-bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile

      - name: Start eval backend
        run: |
          cd backend
          bun run src/index.ts > /tmp/eval-backend.log 2>&1 &
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '8000'
          DATABASE_DRIVER: pglite
          AUTH_MODE: consumer
          AUTH_ALLOW_ANONYMOUS: 'true'
          BETTER_AUTH_URL: http://localhost:8000
          BETTER_AUTH_SECRET: eval-ci-secret-at-least-32-characters
          APP_URL: http://localhost:1420
          CORS_ORIGINS: http://localhost:1420
          TRUSTED_ORIGINS: http://localhost:1420,http://localhost:8000
          RATE_LIMIT_ENABLED: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          sed -n '1,240p' /tmp/eval-backend.log
          exit 1

      - name: Create eval session
        run: |
          TOKEN=$(curl --fail --silent --show-error \
            --output /dev/null \
            --write-out '%header{set-auth-token}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://localhost:8000/v1/api/auth/sign-in/anonymous)
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "EVAL_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run smoke evals
        id: eval
        continue-on-error: true
        run: bun run eval -- --detailed
        env:
          EVAL_SMOKE: '1'
          EVAL_OUTPUT: evals/eval-report.md
          EVAL_TIMEOUT: '240000'

      - name: Publish eval report summary
        if: always()
        run: |
          if [ -f evals/eval-report.md ]; then
            cat evals/eval-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Eval report was not produced. Check the workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect backend log
        if: always()
        run: |
          mkdir -p evals
          cp /tmp/eval-backend.log evals/backend.log

      - name: Upload eval report
        id: eval-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-smoke-report
          path: evals/
          if-no-files-found: warn
          retention-days: 14

      - name: Post eval comment
        if: always() && github.event_name == 'pull_request'
        run: bun .github/scripts/post-eval-results.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVAL_METRICS_PATH: evals/eval-metrics.json
          EVAL_ARTIFACT_URL: ${{ steps.eval-artifact.outputs.artifact-url }}

      # Informational until checked-in baselines show passing necessity gates; restore enforcement then.

  scheduled-full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            backend/node_modules
          key: evals-bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'backend/bun.lock') }}
          restore-keys: |
            evals-bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd backend && bun install --frozen-lockfile

      - name: Start eval backend
        run: |
          cd backend
          bun run src/index.ts > /tmp/eval-backend.log 2>&1 &
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '8000'
          DATABASE_DRIVER: pglite
          AUTH_MODE: consumer
          AUTH_ALLOW_ANONYMOUS: 'true'
          BETTER_AUTH_URL: http://localhost:8000
          BETTER_AUTH_SECRET: eval-ci-secret-at-least-32-characters
          APP_URL: http://localhost:1420
          CORS_ORIGINS: http://localhost:1420
          TRUSTED_ORIGINS: http://localhost:1420,http://localhost:8000
          RATE_LIMIT_ENABLED: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          sed -n '1,240p' /tmp/eval-backend.log
          exit 1

      - name: Create eval session
        run: |
          TOKEN=$(curl --fail --silent --show-error \
            --output /dev/null \
            --write-out '%header{set-auth-token}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://localhost:8000/v1/api/auth/sign-in/anonymous)
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "EVAL_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run full eval suite
        id: eval
        continue-on-error: true
        run: bun run eval -- --detailed
        env:
          EVAL_OUTPUT: evals/eval-report.md
          EVAL_TIMEOUT: '240000'

      - name: Publish eval report summary
        if: always()
        run: |
          if [ -f evals/eval-report.md ]; then
            cat evals/eval-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Eval report was not produced. Check the workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect backend log
        if: always()
        run: |
          mkdir -p evals
          cp /tmp/eval-backend.log evals/backend.log

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-full-report
          path: evals/
          if-no-files-found: warn
          retention-days: 30

      - name: Compare with checked-in baselines
        if: always() && hashFiles('evals/eval-metrics.json') != ''
        run: bun run eval:compare -- evals/eval-metrics.json

      - name: Generate refreshed baselines
        if: always() && hashFiles('evals/eval-metrics.json') != ''
        run: bun run eval:baseline -- evals/eval-metrics.json

      - name: Open or update baseline refresh pull request
        if: always() && hashFiles('evals/eval-metrics.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/ai/eval/baselines)" ]; then
            echo "Baselines are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin evals/baseline-refresh:refs/remotes/origin/evals/baseline-refresh || true
          git checkout -B evals/baseline-refresh
          git add src/ai/eval/baselines
          git commit -m "chore: refresh eval baselines"
          git push --force-with-lease origin evals/baseline-refresh

          if [ "$(gh pr list --head evals/baseline-refresh --base main --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head evals/baseline-refresh \
              --title "chore: refresh eval baselines" \
              --body "Automated refresh from the scheduled full AI eval suite." \
              --draft
          fi

      - name: Enforce full-suite result
        if: always() && steps.eval.outcome != 'success'
        run: exit 1
