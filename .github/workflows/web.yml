name: Website

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - run: bun run typecheck
      # The build embeds the latest desktop release and fails without one. GitHub rate limits
      # anonymous lookups by address, and hosted runners share theirs, so look it up here with
      # the job's token and let the build read the saved answer.
      - run: gh api repos/thunderbird/thunderbolt/releases/latest > release-snapshot.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun run build
