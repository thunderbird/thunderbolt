[package]
name = "tauri-plugin-passkey"
version = "0.1.0"
description = "Native WebAuthn passkey ceremonies for Thunderbolt's Tauri apps (iOS, macOS, Android, Windows)."
authors = ["Thunderbolt"]
license = "MPL-2.0"
edition = "2021"
# Required by the Tauri mobile plugin bridge to locate the native iOS and Android sources.
links = "tauri-plugin-passkey"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

# macOS runs the ceremony through a static Swift lib (swift-rs), adapted from
# yminghua/tauri-plugin-macos-passkey (MIT/Apache). iOS and Android go through the
# Tauri mobile plugin bridge instead (see src/mobile.rs + ios/), so swift-rs is macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = { version = "1.0.6" }
tokio = { version = "1", features = ["sync"] }

# Windows calls webauthn.dll; the version matches the one Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WindowsWebServices",
  "Win32_System_LibraryLoader",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.6", features = ["build"] }
