# -- Global image pull secrets for private registries (e.g. GHCR)
imagePullSecrets: []
# - name: ghcr-pull

# -- Base URL the app is served from (used for CORS, redirects, auth callbacks)
appUrl: http://localhost

# -- Annotations applied to every pod in the chart. Merged with per-component
# `<component>.podAnnotations`; per-component keys win on conflict.
# Implementation note: this uses Sprig `merge`, which is dst-wins (counter to
# many other merge libraries), so the per-component map is passed as the
# destination — see `thunderbolt.podAnnotations` in `templates/_helpers.tpl`.
podAnnotations: {}

# =============================================================================
# Frontend
# =============================================================================
frontend:
  image:
    repository: ghcr.io/thunderbird/thunderbolt/thunderbolt-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80
  # -- Pod annotations applied to frontend pods. Merged with top-level
  # `podAnnotations`; these win on key conflict.
  podAnnotations: {}
  # -- Pod resource requests/limits for the frontend container.
  resources: {}

# =============================================================================
# Marketing (Astro static site: landing page, blog, docs)
# =============================================================================
marketing:
  image:
    repository: ghcr.io/thunderbird/thunderbolt/thunderbolt-marketing
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80
  # -- Pod annotations applied to marketing pods. Merged with top-level
  # `podAnnotations`; these win on key conflict.
  podAnnotations: {}
  # -- Pod resource requests/limits for the marketing container.
  resources: {}

# =============================================================================
# Backend
# =============================================================================
backend:
  image:
    repository: ghcr.io/thunderbird/thunderbolt/thunderbolt-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8000
  # -- Base64-encoded Better Auth secret (REQUIRED — no safe default)
  # Generate with: echo -n "your-secret" | base64
  betterAuthSecretBase64: ""
  env:
    authMode: oidc
    waitlistEnabled: "false"
    databaseDriver: postgres
    rateLimitEnabled: "false"
    # -- CLI rollout order: docs/self-hosting/configuration.md#cli-device-rollout.
    # -- Minimum compatible app semver.
    minAppVersion: ""
    # -- Server-owned CLI device registration gate.
    cliDeviceRegistrationEnabled: "false"
    # -- Thunderbolt inference gateway URL (plaintext; empty disables the provider)
    thunderboltInferenceUrl: ""
  # -- Base64-encoded AI provider keys. Empty defaults disable each provider
  # (backend zod schema treats empty string as "not configured").
  # Generate each with: echo -n "<your-key>" | base64
  aiSecrets:
    anthropicApiKeyBase64: ""
    fireworksApiKeyBase64: ""
    thunderboltInferenceApiKeyBase64: ""
    exaApiKeyBase64: ""
  # -- Pod annotations applied to backend pods. Merged with top-level
  # `podAnnotations`; these win on key conflict.
  podAnnotations: {}
  # -- Pod resource requests/limits for the backend container.
  resources: {}

# =============================================================================
# PostgreSQL
# =============================================================================
postgres:
  image:
    repository: postgres
    tag: 17-alpine
  storage: 5Gi
  credentials:
    user: postgres
    database: postgres
    # -- Base64-encoded password (default: "postgres")
    passwordBase64: cG9zdGdyZXM=
  # -- TLS mode for Postgres connections. Wired into both the backend's
  # `DATABASE_URL` (as `?sslmode=...`) and PowerSync's `replication`/`storage`
  # config. Default `disable` matches the in-cluster StatefulSet which ships
  # without TLS. Set to `require` (or stricter) when pointing at a
  # TLS-terminating Postgres like RDS.
  sslmode: disable
  # -- Pod annotations applied to postgres pods. Merged with top-level
  # `podAnnotations`; these win on key conflict.
  podAnnotations: {}
  # -- Pod resource requests/limits for the postgres container.
  resources: {}

# =============================================================================
# PowerSync
# =============================================================================
powersync:
  image:
    repository: journeyapps/powersync-service
    tag: latest
  replicas: 1
  service:
    port: 8080
  jwt:
    kid: enterprise-powersync
    # -- JWT signing secret, encoded with **base64url** (RFC 7518). The string
    # is consumed both as the HS256 signing secret and as the JWK `k` field
    # PowerSync uses to verify tokens, and JWK requires base64url specifically.
    # Decoded length must be >= 32 chars (backend validation).
    # Default: "enterprise-thunderbolt-powersync-jwt-default-secret" (51 chars).
    #
    # WARNING: do NOT use `openssl rand -base64`; its output can include `+/=`
    # which the JWK parser rejects. Use one of:
    #   openssl rand 32 | basenc --base64url --wrap=0
    #   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
    secretBase64: ZW50ZXJwcmlzZS10aHVuZGVyYm9sdC1wb3dlcnN5bmMtand0LWRlZmF1bHQtc2VjcmV0
  db:
    # -- Base64-encoded powersync_role database password (default: "myhighlyrandompassword")
    passwordBase64: bXloaWdobHlyYW5kb21wYXNzd29yZA==
  # -- Pod annotations applied to powersync pods. Merged with top-level
  # `podAnnotations`; these win on key conflict.
  podAnnotations: {}
  # -- Pod resource requests/limits for the powersync container.
  resources: {}

# =============================================================================
# Keycloak (OIDC Identity Provider)
# =============================================================================
keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
  replicas: 1
  service:
    port: 8080
  admin:
    username: admin
    password: admin
  oidc:
    clientId: thunderbolt-app
    # -- Base64-encoded client secret (default: "thunderbolt-enterprise-secret")
    clientSecretBase64: dGh1bmRlcmJvbHQtZW50ZXJwcmlzZS1zZWNyZXQ=
  # -- Include a `demo@thunderbolt.io` / `demo` user in the imported realm.
  # Convenient for local/preview environments and docs walk-throughs; set to
  # `false` for production deployments. Default `true` preserves current behavior.
  #
  # Realm import happens only on boot of an empty database, so flipping this to
  # `false` does not remove a demo user from a running Keycloak. In THIS chart
  # that is a restart away: `templates/keycloak.yaml` runs `start-dev
  # --import-realm` with no `KC_DB`, so Keycloak keeps its embedded database
  # inside the pod and the only mounted volume is the read-only realm ConfigMap.
  # Rolling the deployment therefore starts from an empty database and re-imports
  # the realm — which applies this flag, and equally discards anything else
  # configured in Keycloak since the pod started. On a Keycloak backed by a
  # persistent database, delete the user in the admin console instead
  # (Users → demo → Delete).
  demoUserEnabled: true
  # -- Pod annotations applied to keycloak pods. Merged with top-level
  # `podAnnotations`; these win on key conflict.
  podAnnotations: {}
  # -- Pod resource requests/limits for the keycloak container.
  resources: {}

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  # -- Set to your domain for production; leave empty for default rule
  host: ""
  # -- Optional per-service hostnames ("preview-style" host-header routing).
  # Every key you set gets its own ingress rule serving `/` from one service:
  # `marketing` → marketing, `app` → frontend, `api` → backend, `auth` →
  # keycloak, `powersync` → powersync. Leave the map empty to keep the default
  # path-based layout, where a single host routes `/v1`, `/realms`,
  # `/resources` and `/powersync` to their services and everything else to the
  # frontend.
  #
  # The path-based rule is always rendered, so the two modes coexist: the
  # host-header rules take precedence for the hostnames listed here and the
  # `host` rule stays as the fallback (a catch-all when `host` is empty).
  # See `templates/ingress.yaml`.
  hostnames: {}
  #   marketing: example.com
  #   app: app.example.com
  #   api: api.example.com
  #   auth: auth.example.com
  #   powersync: powersync.example.com
