[install]
minimumReleaseAge = 604800 # 7 days in seconds
# The Pi harness packages (the in-browser agent engine) are actively released and
# pinned to an exact version (0.80.2), so the 7-day quarantine — meant to avoid
# auto-pulling brand-new floating versions — would otherwise block this exact pin.
# Scope the exemption to the `@earendil-works/*` packages; the global quarantine
# stays in force for every other dependency except the temporary entries below.
minimumReleaseAgeExcludes = [
  # Only to land quickjs-wasi 3.6.4 and docx 9.15.3, the versions the Office sandbox was validated on; remove after 2026-11-13.
  "quickjs-wasi",
  "docx",
  # Explicitly requested 2.0.0-rc.1 pins; remove after 2026-11-17.
  "tinfoil",
  "@tinfoilsh/verifier",
  "@earendil-works/pi-agent-core",
  "@earendil-works/pi-ai",
  "@earendil-works/pi-coding-agent",
  # Only to land better-auth 1.7.16 inside the quarantine; remove these entries after 2026-11-10.
  "better-auth",
  "better-call",
  "@better-auth/core",
  "@better-auth/telemetry",
  "@better-auth/drizzle-adapter",
  "@better-auth/kysely-adapter",
  "@better-auth/memory-adapter",
  "@better-auth/mongo-adapter",
  "@better-auth/prisma-adapter",
  "@better-auth/api-key",
  "@better-auth/passkey",
  "@better-auth/sso",
]

[test]
preload = ["./happydom.ts", "./src/testing-library.ts"]
# Bun walks cwd recursively to discover test files. From the repo root that pulls in
# `backend/src/**/*.test.ts` and `e2e/**/*.spec.ts` — neither belongs in the frontend
# runner. Backend has its own `bunfig.toml` and `cd backend && bun test` flow; e2e is
# Playwright. Requires Bun ≥ 1.3.11 (silent no-op below).
pathIgnorePatterns = ["backend/**", "e2e/**"]
