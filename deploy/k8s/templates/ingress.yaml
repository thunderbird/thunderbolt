{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thunderbolt-ingress
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- /*
      Two routing modes:
        1. Host-header based (preview-style): set .Values.ingress.hostnames.{marketing,app,api,auth,powersync}
           Each hostname gets a dedicated rule routing to its service.
        2. Path-based (enterprise-style): set .Values.ingress.host (optional) and all paths go under one host
           Everything under one hostname with /v1, /realms, /powersync, / routing.
      If both are set, host-header rules take precedence (they're separate rules). Path-based stays as the fallback.
    */}}

    {{- with .Values.ingress.hostnames }}
    {{- if .marketing }}
    - host: {{ .marketing }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketing
                port:
                  number: {{ $.Values.marketing.service.port }}
    {{- end }}
    {{- if .app }}
    - host: {{ .app }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
    {{- if .api }}
    - host: {{ .api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ $.Values.backend.service.port }}
    {{- end }}
    {{- if .auth }}
    - host: {{ .auth }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: {{ $.Values.keycloak.service.port }}
    {{- end }}
    {{- if .powersync }}
    - host: {{ .powersync }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: powersync
                port:
                  number: {{ $.Values.powersync.service.port }}
    {{- end }}
    {{- end }}

    {{- /* Path-based fallback — always present so enterprise stacks keep working. */}}
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: {{ .Values.keycloak.service.port }}
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: {{ .Values.keycloak.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}
---
{{- /*
  PowerSync's own HTTP routes (/sync/stream, /write-checkpoint2.json, ...) are
  mounted at its service root and have no awareness of a `/powersync` prefix —
  unlike the backend and Keycloak routes above, which are already prefix-aware
  (the backend's Elysia app is itself mounted under `/v1`, and Keycloak's
  `/realms`/`/resources` paths are its own native routing). Forwarding the
  unstripped path here 404s. `rewrite-target` is Ingress-object-wide in
  ingress-nginx (it can't be scoped to one path within a shared Ingress), so
  this gets its own Ingress resource for the same host.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thunderbolt-ingress-powersync
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /powersync(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: powersync
                port:
                  number: {{ .Values.powersync.service.port }}
{{- end }}
