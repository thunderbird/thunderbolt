appId: net.thunderbird.thunderbolt.dev
env:
  # The confidential default every fresh account lands on; a model swap changes it here only.
  DEFAULT_MODEL: DeepSeek V4.1 Flash
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Connect your AI
    timeout: 300000
# On a slow runner the first tap can land before the page takes input and the sidebar never opens, so
# only tap while "Sign in" is missing: a retry then cannot close a sidebar that did open.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: Sign in
          commands:
            - tapOn: Toggle Sidebar
      - assertVisible: Sign in
- tapOn: Sign in
- tapOn: Cloud \(Waitlist\)
- tapOn: Continue
- extendedWaitUntil:
    visible: Want early access?
    timeout: 300000
- waitForAnimationToEnd
# Each retry block re-checks its own outcome. The simulator can drop a focus tap, and inputText
# types anyway; eraseText stops a partial try doubling up. Maestro aims a tap with the
# hierarchy read before it settles, so the model sheet sliding into place can take the tap
# on a neighbouring row ("Add Model").
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: Email
          retryTapIfNoChange: true
      - eraseText
      - inputText: ${EMAIL}
      - assertVisible: ${EMAIL}
- tapOn: Continue
- extendedWaitUntil:
    visible: Check your email
    timeout: 120000
- inputText: 12345678
- extendedWaitUntil:
    visible: Set up sync
    timeout: 120000
- tapOn: Close
# Cloud sign-in does not require enabling sync. Close the sidebar before choosing a model.
- tapOn:
    point: 95%,50%
- extendedWaitUntil:
    visible: ${DEFAULT_MODEL}
    timeout: 120000
# A new account has no recovery phrase to update, so the banner must stay away.
- assertNotVisible: Security notice
- retry:
    maxRetries: 2
    commands:
      # Counts as an interaction, so it restores the lookup time a failed attempt used up.
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: Close
          commands:
            - tapOn: Close
      - runFlow:
          when:
            notVisible: Model and reasoning effort
          commands:
            - tapOn: '${DEFAULT_MODEL}|Opus 5.5'
      - waitForAnimationToEnd
      - tapOn: Opus 5.5 Thunderbolt
      # A pick leaves the sheet open; a tap above it closes it.
      - tapOn:
          point: 50%,30%
      - assertNotVisible: Model and reasoning effort
      - assertVisible: Opus 5.5
- retry:
    maxRetries: 2
    commands:
      - tapOn: Ask me anything…
      - eraseText
      - inputText: Please greet me briefly.
      - assertVisible:
          text: Send message
          enabled: true
- tapOn: Send message
- extendedWaitUntil:
    visible: Hello from the fake provider, one word at a time.
    timeout: 60000
