# Run by `verify.ts` before a native repro flow that waits for the first screen after sign-in without typing the
# code (the model's iOS flows can skip typing it). verify.ts adds that wait: "Welcome to Thunderbolt!" on the
# onboarding build, "Ask me anything…" on the plain one. Same steps as control/stack.yaml and the block in
# drivers/maestro.md.
- launchApp
- extendedWaitUntil:
    visible: Want early access?
    timeout: 120000
- waitForAnimationToEnd
# The simulator can drop a focus tap, and inputText types anyway; eraseText stops a partial try doubling up.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: Email
          retryTapIfNoChange: true
      - eraseText
      - inputText: ${EMAIL}
      - assertVisible: ${EMAIL}
- tapOn: Continue
- extendedWaitUntil:
    visible: Check your email
    timeout: 120000
- inputText: '12345678'
