<!doctype html>
<html lang="en">
  <head>
    <title>Unnamed</title>
  </head>
  <body>
    <!-- A label beside a control names it only through `for` or by wrapping it. -->
    <label>Consent</label>
    <input type="checkbox" />
    <button role="switch"></button>
    <!-- A field's default text is no name. -->
    <textarea>Draft</textarea>
  </body>
</html>
