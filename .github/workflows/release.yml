name: Release

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform for the release (all, ios, android, desktop)'
        required: false
        type: string
        default: 'all'
      version:
        description: 'Explicit version to set (e.g., 1.2.3). Leave empty for auto-detection.'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform for the release (all, ios, android, desktop)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - ios
          - android
          - desktop
      version:
        description: 'Explicit version to set (e.g., 1.2.3). Leave empty for auto-detection.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version_bump:
    name: Version Bump
    uses: ./.github/workflows/version-bump.yml
    secrets: inherit
    with:
      platform: ${{ inputs.platform }}
      version: ${{ inputs.version }}
      version_type: patch

  desktop:
    name: Desktop Release
    needs: version_bump
    if: inputs.platform == 'all' || inputs.platform == 'desktop'
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit
    with:
      version: ${{ needs.version_bump.outputs.new_version }}

  ios:
    name: iOS Release
    needs: version_bump
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    uses: ./.github/workflows/ios-release.yml
    secrets: inherit
    with:
      version: ${{ needs.version_bump.outputs.new_version }}

  android:
    name: Android Release
    needs: version_bump
    if: inputs.platform == 'all' || inputs.platform == 'android'
    uses: ./.github/workflows/android-release.yml
    secrets: inherit
    with:
      version: ${{ needs.version_bump.outputs.new_version }}

  # The CLI rides the unified `v{version}` release tag: its binaries attach to the
  # same GitHub Release, and the desktop workflow's publish job flips that shared
  # tag to public. It therefore builds only for `all` runs — not for
  # single-platform (ios/android/desktop) dispatches, which produce RC tags the
  # CLI would not belong to.
  cli:
    name: CLI Release
    needs: version_bump
    if: inputs.platform == 'all'
    uses: ./.github/workflows/cli-release.yml
    with:
      version: ${{ needs.version_bump.outputs.new_version }}

  notify:
    needs: [version_bump, desktop, ios, android, cli]
    if: >-
      always() && !cancelled() && github.workflow == 'Release' && (
        contains(needs.*.result, 'failure') ||
        needs.version_bump.result == 'success' && (
          inputs.platform == 'all' &&
          needs.desktop.result == 'success' && needs.ios.result == 'success' &&
          needs.android.result == 'success' && needs.cli.result == 'success'
        )
      )
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/notify-on-failure.yml
    with:
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
