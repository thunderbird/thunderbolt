<!doctype html>
<html lang="en">
  <head>
    <title>Keyboard cover</title>
  </head>
  <body>
    <!-- Wholly under the 300 px keyboard, so behind-keyboard reports it. The fixed box over its lower right part is
         a second problem, and it still counts. -->
    <input
      placeholder="Name"
      style="position: fixed; bottom: 40px; left: 0; width: 200px; height: 40px; box-sizing: border-box"
    />
    <div style="position: fixed; bottom: 40px; left: 150px; width: 100px; height: 20px; background: #ddd"></div>
    <script src="fake-keyboard.js"></script>
  </body>
</html>
