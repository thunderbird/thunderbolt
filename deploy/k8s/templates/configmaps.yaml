apiVersion: v1
kind: ConfigMap
metadata:
  name: powersync-config
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
data:
  config.yaml: |
    replication:
      connections:
        - type: postgresql
          uri: !env PS_PG_URI
          sslmode: {{ .Values.postgres.sslmode | default "disable" }}

    storage:
      type: postgresql
      uri: !env PS_STORAGE_URI
      sslmode: {{ .Values.postgres.sslmode | default "disable" }}

    port: {{ .Values.powersync.service.port }}

    sync_rules:
      content: |
        bucket_definitions:
          # This device's own row only, ungated by revocation, so a revoked device
          # still receives `revoked_at` after its other buckets drop. Parameters read
          # the claim directly: a table query returns nothing until the row
          # replicates, which would empty priority 1 on a brand-new device.
          device_self:
            priority: 1
            parameters: SELECT request.jwt() ->> 'device_id' as device_id, request.user_id() as user_id
            data:
              # `user_id` is load-bearing, not belt-and-braces: it is what keeps the
              # row scoped to its owner now that the bucket keys on device id.
              - SELECT * FROM powersync.devices WHERE id = bucket.device_id AND user_id = bucket.user_id
          user_essentials:
            priority: 1
            # Second branch is a rollout fallback for a backend that does not stamp
            # `device_id` yet; without it a claimless token matches nothing and wipes
            # every client. Drop it once no deployment can still run that backend.
            parameters:
              - SELECT user_id FROM powersync.devices WHERE id = request.jwt() ->> 'device_id' AND user_id = request.user_id() AND revoked_at IS NULL
              - SELECT request.user_id() as user_id WHERE request.jwt() ->> 'device_id' IS NULL
            data:
              - SELECT * FROM powersync.settings WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.models WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.model_profiles WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.devices WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.chat_threads WHERE user_id = bucket.user_id
          user_data:
            priority: 2
            parameters:
              - SELECT user_id FROM powersync.devices WHERE id = request.jwt() ->> 'device_id' AND user_id = request.user_id() AND revoked_at IS NULL
              - SELECT request.user_id() as user_id WHERE request.jwt() ->> 'device_id' IS NULL
            data:
              - SELECT * FROM powersync.chat_messages WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.tasks WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.prompts WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.skills WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.triggers WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.agents WHERE user_id = bucket.user_id
              - SELECT * FROM powersync.projects WHERE user_id = bucket.user_id

    client_auth:
      supabase: false
      audience: ['powersync-enterprise', 'powersync']
      jwks:
        keys:
          - kty: oct
            # PowerSync only allows `!env` substitution for vars prefixed `PS_`
            # (a security restriction — see templates/powersync.yaml for the
            # matching container env var name).
            k: !env PS_JWT_SECRET_B64
            alg: HS256
            kid: {{ .Values.powersync.jwt.kid }}
      telemetry:
        disable_telemetry_sharing: true
{{- if include "thunderbolt.keycloakEnabled" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
data:
  thunderbolt-realm.json: |
    {
      "realm": "thunderbolt",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "clients": [
        {
          "clientId": "{{ .Values.keycloak.oidc.clientId }}",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "{{ .Values.keycloak.oidc.clientSecretBase64 | b64dec }}",
          "redirectUris": ["{{ .Values.appUrl }}/v1/api/auth/sso/callback/sso"],
          "webOrigins": ["{{ .Values.appUrl }}"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "publicClient": false,
          "protocol": "openid-connect",
          "defaultClientScopes": ["openid", "profile", "email"]
        }
      ],
      "users": [
        {{- if .Values.keycloak.demoUserEnabled }}
        {
          "username": "demo",
          "email": "demo@thunderbolt.io",
          "firstName": "Demo",
          "lastName": "User",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "demo",
              "temporary": false
            }
          ]
        }
        {{- end }}
      ]
    }
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
data:
  01-powersync.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 \
      -v powersync_pass="$POWERSYNC_DB_PASSWORD" \
      -v dbname="$POSTGRES_DB" \
      --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-'EOSQL'
      CREATE SCHEMA IF NOT EXISTS powersync;
      CREATE ROLE powersync_role WITH REPLICATION BYPASSRLS LOGIN PASSWORD :'powersync_pass';
      GRANT USAGE ON SCHEMA powersync TO powersync_role;
      GRANT SELECT ON ALL TABLES IN SCHEMA powersync TO powersync_role;
      ALTER DEFAULT PRIVILEGES IN SCHEMA powersync GRANT SELECT ON TABLES TO powersync_role;
      CREATE PUBLICATION powersync FOR ALL TABLES;
      CREATE DATABASE powersync_storage OWNER postgres;
    EOSQL
