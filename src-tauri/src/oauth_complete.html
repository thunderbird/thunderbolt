<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      history.replaceState(null, '', '/')
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Thunderbolt</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f5f2ee;
        color: #262120;
        --muted: #7f7870;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 440px;
        text-align: center;
      }
      .logo {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .logo svg {
        width: 80px;
        height: 80px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.25;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      p {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
        text-wrap: balance;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1b1e1f;
          color: #f2f1ee;
          --muted: #a19a91;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">{{logo}}</div>
      <h1>Authentication Complete</h1>
      <p>You can close this tab and return to Thunderbolt.</p>
    </main>
  </body>
</html>
