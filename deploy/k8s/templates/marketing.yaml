apiVersion: v1
kind: Service
metadata:
  name: marketing
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
spec:
  selector:
    app: marketing
  ports:
    - port: {{ .Values.marketing.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing
  labels:
    {{- include "thunderbolt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.marketing.replicas }}
  selector:
    matchLabels:
      app: marketing
  template:
    metadata:
      labels:
        app: marketing
      {{- include "thunderbolt.podAnnotations" (dict "component" .Values.marketing "root" .) | nindent 6 }}
    spec:
      {{- include "thunderbolt.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: marketing
          image: "{{ .Values.marketing.image.repository }}:{{ .Values.marketing.image.tag }}"
          imagePullPolicy: {{ .Values.marketing.image.pullPolicy }}
          ports:
            - containerPort: 8080
          {{- include "thunderbolt.resources" .Values.marketing.resources | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
