name: Images Publish

on:
  workflow_call:
    inputs:
      tag_override:
        description: 'Image tag to use instead of package.json version (e.g. pr-123-abc1234 for preview builds). When set, also skips the :latest tag and Helm chart push.'
        type: string
        required: false
      ref:
        description: 'Git ref to build from (default: the triggering ref)'
        type: string
        required: false
      vite_backend_url:
        description: 'Override for VITE_THUNDERBOLT_CLOUD_URL build arg (frontend image). Default is /v1 (same-origin path). For preview stacks with cross-origin subdomains set this to e.g. https://api-pr-123.preview.thunderbolt.io/v1.'
        type: string
        required: false
      platforms:
        description: 'Target platforms for the image builds. Defaults to amd64 + arm64; callers that only consume one (preview stacks run on amd64 Fargate) should pass just that to skip the emulated build.'
        type: string
        required: false
        default: 'linux/amd64,linux/arm64'
    outputs:
      version:
        description: 'The tag the images were published with'
        value: ${{ jobs.publish.outputs.version }}
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Image tag to use instead of package.json version'
        type: string
        required: false
      vite_backend_url:
        description: 'Override for VITE_THUNDERBOLT_CLOUD_URL'
        type: string
        required: false
      platforms:
        description: 'Target platforms for the image builds'
        type: string
        required: false
        default: 'linux/amd64,linux/arm64'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'web/**'
      - 'docs/**'
      - '.github/workflows/images-publish.yml'
      - 'backend/**'
      - 'src/**'
      - 'shared/defaults/models.ts'
      - 'shared/inference-usage.ts'
      - 'scripts/prune-unreachable-deps.ts'
      - 'package.json'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_SOURCE: https://github.com/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A run that publishes the shared tags (`:<version>`, `:latest`) cancels an older one still running:
    # the newer run builds the tip of its branch, which already holds the older run's changes. Preview
    # builds publish their own tag, so each gets a group of its own and is never cancelled from here.
    concurrency:
      group: ${{ inputs.tag_override && format('images-publish-{0}', github.run_id) || format('images-publish-{0}', github.ref) }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      powersync_config: ${{ steps.version.outputs.powersync_config }}

    steps:
      # Note: when invoked from preview-deploy.yml under pull_request_target, this
      # checks out a fork's ref. That ref is consumed only as Docker build context
      # (docker/build-push-action runs in a sandboxed daemon, not on the runner)
      # and the caller workflow gates this job behind a maintainer-approval
      # environment. The version step below reads package.json from the checkout
      # but routes the value through a $GITHUB_OUTPUT → env var, never interpolated
      # into a shell with ${{ }} syntax. checkout v7 refuses fork refs under
      # pull_request_target without the explicit opt-in below; it is safe here
      # because of the sandboxing and approval gating described above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          allow-unsafe-pr-checkout: true

      - name: Resolve version
        id: version
        env:
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -o pipefail
          POWERSYNC_CONFIG=$(cat deploy/docker/powersync.Dockerfile deploy/config/powersync-config.yaml | sha256sum | cut -d ' ' -f 1)
          echo "powersync_config=$POWERSYNC_CONFIG" >> $GITHUB_OUTPUT
          if [ -n "$TAG_OVERRIDE" ]; then
            echo "version=$TAG_OVERRIDE" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Version (override): $TAG_OVERRIDE — skipping :latest tag and Helm chart push"
          else
            VERSION=$(jq -r .version package.json)
            [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "Invalid version: $VERSION"; exit 1; }
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "publish_latest=true" >> $GITHUB_OUTPUT
            echo "Version: $VERSION"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Multi-arch (linux/amd64 + linux/arm64) build support --

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # -- Build and push Docker images --

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          no-cache: true
          # Buildx's container driver attaches provenance attestations by
          # default. Suppress them so the index carries only the two platform
          # manifests, matching what the previous docker driver published.
          provenance: false
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            VITE_THUNDERBOLT_CLOUD_URL=${{ inputs.vite_backend_url || '/v1' }}
            VITE_AUTH_MODE=sso
          tags: |
            ${{ env.IMAGE_PREFIX }}/thunderbolt-frontend:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/thunderbolt-frontend:latest', env.IMAGE_PREFIX) || '' }}
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: true
          no-cache: true
          # Buildx's container driver attaches provenance attestations by
          # default. Suppress them so the index carries only the two platform
          # manifests, matching what the previous docker driver published.
          provenance: false
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/thunderbolt-backend:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/thunderbolt-backend:latest', env.IMAGE_PREFIX) || '' }}
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}

      - name: Build and push postgres
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/postgres.Dockerfile
          push: true
          no-cache: true
          # Buildx's container driver attaches provenance attestations by
          # default. Suppress them so the index carries only the two platform
          # manifests, matching what the previous docker driver published.
          provenance: false
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/thunderbolt-postgres:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/thunderbolt-postgres:latest', env.IMAGE_PREFIX) || '' }}
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}

      - name: Build and push keycloak
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/keycloak.Dockerfile
          push: true
          no-cache: true
          # Buildx's container driver attaches provenance attestations by
          # default. Suppress them so the index carries only the two platform
          # manifests, matching what the previous docker driver published.
          provenance: false
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/thunderbolt-keycloak:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/thunderbolt-keycloak:latest', env.IMAGE_PREFIX) || '' }}
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}

      - name: Build and push powersync
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/powersync.Dockerfile
          push: true
          no-cache: true
          # Buildx's container driver attaches provenance attestations by
          # default. Suppress them so the index carries only the two platform
          # manifests, matching what the previous docker driver published.
          provenance: false
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/thunderbolt-powersync:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/thunderbolt-powersync:latest', env.IMAGE_PREFIX) || '' }}
          # deploy-powersync compares this with the live image's label to tell whether the sync config
          # changed.
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            io.thunderbolt.powersync-config=${{ steps.version.outputs.powersync_config }}

      # Keep credentials on the runner; only the public answer enters the Docker context.
      # An unavailable GitHub API must not block an otherwise valid image build.
      - name: Look up the latest desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_RESPONSE=$(mktemp)
          if gh api repos/thunderbird/thunderbolt/releases/latest > "$RELEASE_RESPONSE"; then
            mv "$RELEASE_RESPONSE" web/release-snapshot.json
          else
            rm -f "$RELEASE_RESPONSE"
            echo "::warning::Release lookup failed; building with the last-known-good snapshot."
          fi

      - name: Build and push marketing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/marketing.Dockerfile
          push: true
          no-cache: true
          # Buildx's container driver attaches provenance attestations by
          # default. Suppress them so the index carries only the two platform
          # manifests, matching what the previous docker driver published.
          provenance: false
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/thunderbolt-marketing:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/thunderbolt-marketing:latest', env.IMAGE_PREFIX) || '' }}
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}

      # -- Package and push Helm chart (skipped for preview builds) --

      - name: Update chart version
        if: steps.version.outputs.publish_latest == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: $VERSION/" deploy/k8s/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" deploy/k8s/Chart.yaml

      - name: Package and push Helm chart
        if: steps.version.outputs.publish_latest == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          helm package deploy/k8s/ --destination .
          helm push "thunderbolt-${VERSION}.tgz" "oci://${REGISTRY}/${REPO_OWNER}/charts"

  # Rolls the production Render `powersync` service onto the image just published, when the live image
  # has a different version or sync config. Any other merge leaves it running, so clients don't
  # reconnect; a release does redeploy it, which costs a reconnect but no re-download (PowerSync
  # rebuilds its storage only when the sync config content or `version_label` changes). Comparing with
  # what is live, rather than with what one push changed, means a cancelled or failed run is made up by
  # the next run on main, including the nightly rebuild.
  #
  # Only runs on main that publish the shared tags reach it. That `if` is the only barrier: as a called
  # workflow this sees its caller's event and ref (preview-deploy.yml runs on main under
  # pull_request_target and workflow_dispatch, always with a `tag_override`), and a job's environment
  # secrets reach it whatever the caller passes in `secrets:`.
  deploy-powersync:
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.tag_override
    runs-on: ubuntu-latest
    environment: render
    timeout-minutes: 20
    # A newer run supersedes an older one; it compares with what is live, so nothing is lost.
    concurrency:
      group: deploy-powersync
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      RENDER_CLI_VERSION: 2.33.0
      # sha256 of cli_<version>_linux_amd64.zip, from the release's cli_<version>_SHA256SUMS. Render
      # signs that file but publishes no key, so the hash only pins the build first reviewed.
      RENDER_CLI_SHA256: 038bd9b47f8737b560bcddb3c5d59e04114b8ea002b05bba144e52e56e2a824e
    steps:
      - name: Install Render CLI
        run: |
          archive="cli_${RENDER_CLI_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/${archive}"
          echo "${RENDER_CLI_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}" "cli_v${RENDER_CLI_VERSION}" -d "$RUNNER_TEMP/render-cli"
          mv "$RUNNER_TEMP/render-cli/cli_v${RENDER_CLI_VERSION}" "$RUNNER_TEMP/render-cli/render"
          echo "$RUNNER_TEMP/render-cli" >> "$GITHUB_PATH"

      - name: Deploy PowerSync
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_POWERSYNC_SERVICE_ID }}
          REPOSITORY: ${{ github.repository }}/thunderbolt-powersync
          IMAGE: ${{ env.IMAGE_PREFIX }}/thunderbolt-powersync:${{ needs.publish.outputs.version }}
          VERSION: ${{ needs.publish.outputs.version }}
          POWERSYNC_CONFIG: ${{ needs.publish.outputs.powersync_config }}
        run: |
          # A failed read must fail the job, not look like "nothing is live" and restart PowerSync.
          set -euo pipefail
          live=$(render deploys list "$SERVICE_ID" --output json | jq -c '[.[] | select(.status == "live")][0].image // {}')
          live_image=$(jq -r '.ref // ""' <<< "$live")
          live_digest=$(jq -r '.sha // ""' <<< "$live")
          # Re-running an older run's deploy must not roll a newer release back.
          if [ -n "$live_image" ] && [ "$(printf '%s\n' "${live_image##*:}" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "PowerSync already runs a newer version ($live_image); not deploying $IMAGE."
            exit 0
          fi
          live_config=""
          if [ -n "$live_digest" ]; then
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull" | jq -r .token)
            config_blob=$(curl -fsS -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${REPOSITORY}/manifests/${live_digest}" | jq -r .config.digest)
            live_config=$(curl -fsSL -H "Authorization: Bearer $token" "https://ghcr.io/v2/${REPOSITORY}/blobs/${config_blob}" \
              | jq -r '.config.Labels["io.thunderbolt.powersync-config"] // ""')
          fi
          if [ "$live_image" = "$IMAGE" ] && [ "$live_config" = "$POWERSYNC_CONFIG" ]; then
            echo "PowerSync already runs $IMAGE with this sync config; nothing to deploy."
            exit 0
          fi
          # Set the tag on the service rather than on one deploy, so a later restart or manual deploy
          # can't roll back to the previous sync rules.
          render services update "$SERVICE_ID" --image "$IMAGE" --confirm --output text
          render deploys create "$SERVICE_ID" --wait --confirm --output text
