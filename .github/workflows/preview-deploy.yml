name: Preview Deploy

# Creates an ephemeral preview stack on AWS Fargate for each pull request that
# changes what the preview images or stack are built from. Five Cloudflare
# subdomains are created per PR, mirroring prod's subdomain structure:
#   thunderbolt-pr-{N}.preview.thunderbolt.io  → marketing
#   app-pr-{N}.preview.thunderbolt.io           → app frontend
#   api-pr-{N}.preview.thunderbolt.io           → backend API
#   auth-pr-{N}.preview.thunderbolt.io          → keycloak OIDC
#   powersync-pr-{N}.preview.thunderbolt.io     → powersync
#
# Same-repo PRs deploy on `pull_request`: only collaborators with write access
# can push a branch here, and they are trusted with the preview credentials.
# A fork PR's `pull_request` run has no secrets and deploys nothing. A
# maintainer deploys a fork preview with workflow_dispatch (pr_number and the
# head_sha they reviewed) from main: that run builds that commit into the
# images, but the workflow file and Pulumi program come from the dispatched ref.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    # Only PRs that change what the preview images or stack are built from.
    # Test-only changes never trigger one. workflow_dispatch forces one for any PR.
    paths:
      - 'deploy/docker/*.Dockerfile'
      - 'deploy/docker/backend-entrypoint.sh'
      - 'deploy/docker/postgres-init/**'
      - 'deploy/config/keycloak-realm.json'
      - 'deploy/config/marketing-nginx.conf.template'
      - 'deploy/config/nginx.conf.template'
      - 'deploy/config/powersync-config.yaml'
      - 'deploy/config/security-headers.conf'
      - 'deploy/pulumi/**'
      - '.github/workflows/preview-deploy.yml'
      - '.github/workflows/images-publish.yml'
      - '.github/workflows/stack-deploy.yml'
      - 'package.json'
      - 'bun.lock'
      - 'index.html'
      - 'webview-recovery.html'
      - 'vite.config.ts'
      - 'lingui.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'components.json'
      - '.storybook/**'
      - 'scripts/copy-powersync-assets.ts'
      - 'scripts/webkit-compat.ts'
      - 'scripts/tinfoil-search-relay.ts'
      - 'scripts/exa-relay.ts'
      - 'scripts/office-sandbox-script.ts'
      - 'scripts/strip-dangling-source-maps.ts'
      - 'scripts/e2e-source-modules.ts'
      - 'scripts/prune-unreachable-deps.ts'
      - 'src/**'
      - 'public/**'
      - 'shared/**'
      - 'backend/package.json'
      - 'backend/bun.lock'
      - 'backend/tsconfig.json'
      - 'backend/src/**'
      - 'backend/drizzle/**'
      - 'web/**'
      - 'docs/**'
      # The smoke job's own spec, config and browser launcher.
      - 'playwright.preview.config.ts'
      - 'e2e/preview-smoke.spec.ts'
      - 'scripts/chrome.ts'
      - '!**/*.test.*'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy a preview for'
        type: string
        required: true
      head_sha:
        description: 'Head commit you reviewed (required for a fork PR; the run fails if the PR has moved on)'
        type: string
        required: false

concurrency:
  # Same-repo pushes and dispatches share `deploy`, so a push cancels an older deploy, dispatched ones
  # included. A fork's no-op pull_request runs stay in their own group so they cannot cancel a dispatch.
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'fork' || 'deploy' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCR image push
  id-token: write # AWS OIDC federation for Pulumi
  pull-requests: write # sticky PR comment with preview URL

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.r.outputs.pr_number }}
      head_sha: ${{ steps.r.outputs.head_sha }}
      proceed: ${{ steps.r.outputs.proceed }}
      is_fork: ${{ steps.r.outputs.is_fork }}
    steps:
      - name: Resolve PR + route event
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REPO: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUM="$INPUT_PR_NUMBER"
            HEAD_SHA=$(gh pr view "$PR_NUM" --repo "$EVENT_BASE_REPO" --json headRefOid -q .headRefOid)
            HEAD_REPO=$(gh pr view "$PR_NUM" --repo "$EVENT_BASE_REPO" --json headRepository -q '.headRepository.nameWithOwner')
          else
            PR_NUM="$EVENT_PR_NUMBER"
            HEAD_SHA="$EVENT_HEAD_SHA"
            HEAD_REPO="$EVENT_HEAD_REPO"
          fi

          IS_FORK=false
          if [ "$HEAD_REPO" != "$EVENT_BASE_REPO" ]; then
            IS_FORK=true
          fi

          # A fork PR's pull_request run has no secrets; a maintainer deploys it with workflow_dispatch.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_FORK" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR: a maintainer can deploy its preview with workflow_dispatch (pr_number=$PR_NUM, head_sha=$HEAD_SHA)."
            exit 0
          fi

          # Pin a fork dispatch to the commit the maintainer reviewed, not whatever was pushed since.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$IS_FORK" = "true" ] || [ -n "$INPUT_HEAD_SHA" ]; }; then
            if [ "$INPUT_HEAD_SHA" != "$HEAD_SHA" ]; then
              echo "::error::PR #$PR_NUM head is $HEAD_SHA, not the reviewed head_sha '${INPUT_HEAD_SHA}'. Review the new commits and dispatch again."
              exit 1
            fi
          fi

          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "is_fork=$IS_FORK" >> $GITHUB_OUTPUT
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "PR #$PR_NUM @ $HEAD_SHA (fork=$IS_FORK, event=$EVENT_NAME)"

  publish:
    needs: resolve
    # !cancelled() rather than always(): a run cancelled by a newer push must not deploy.
    if: ${{ !cancelled() && needs.resolve.outputs.proceed == 'true' }}
    uses: ./.github/workflows/images-publish.yml
    with:
      # Preview stacks run on amd64 Fargate; skip the emulated arm64 build.
      platforms: linux/amd64
      tag_override: pr-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}
      ref: ${{ needs.resolve.outputs.head_sha }}
      vite_backend_url: https://api-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io/v1

  deploy:
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/stack-deploy.yml
    with:
      action: deploy
      platform: fargate
      region: us-east-1
      stack_name: preview-pr-${{ needs.resolve.outputs.pr_number }}
      version: ${{ needs.publish.outputs.version }}
      marketing_hostname: thunderbolt-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io
      app_hostname: app-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io
      api_hostname: api-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io
      auth_hostname: auth-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io
      powersync_hostname: powersync-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io
      cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      thunderbolt_inference_url: ${{ vars.THUNDERBOLT_INFERENCE_URL }}
      # Off unless the repo variable is set, mirroring the flag's own default —
      # previews are the only place a reviewer can exercise the PAT path, but
      # nothing should switch it on for every PR implicitly.
      confidential_api_keys_enabled: ${{ vars.PREVIEW_CONFIDENTIAL_API_KEYS_ENABLED == 'true' }}
      fork_preview: ${{ needs.resolve.outputs.is_fork == 'true' }}
      # Per-PR stacks read VPC/ALB/postgres/keycloak/powersync from the long-lived
      # `previews-shared` stack via Pulumi StackReference. The shared stack must
      # exist before this runs; deploy it once via the `Previews Shared Deploy`
      # workflow. See deploy/pulumi/SHARED.md.
      shared_stack_name: previews-shared
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      THUNDERBOLT_INFERENCE_API_KEY: ${{ secrets.THUNDERBOLT_INFERENCE_API_KEY }}
      TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
      TINFOIL_ENCLAVE_URL: ${{ secrets.TINFOIL_ENCLAVE_URL }}

  # Reports a red check when the preview does not open or sign in. Intentionally
  # not a required check in branch protection, so preview hiccups never block merge.
  smoke:
    needs: [resolve, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Default ref: the merge commit of a same-repo PR, or the dispatched ref, so a fork's code never runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        # Skip --with-deps: the runner image already ships Chromium's system libraries,
        # and its apt step can stall on a slow mirror.
        timeout-minutes: 3
        run: bun run browsers:install

      - name: Smoke test deployed preview
        run: bun run e2e:preview
        env:
          PREVIEW_APP_URL: https://app-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io
          PREVIEW_API_URL: https://api-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-smoke-results
          path: test-results/
          retention-days: 7

  comment:
    needs: [resolve, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Sticky PR comment with preview URLs
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-env
          number: ${{ needs.resolve.outputs.pr_number }}
          message: |
            **Preview environment deployed** 🚀

            | Service | URL |
            |---|---|
            | Marketing / blog / docs | https://thunderbolt-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io |
            | App | https://app-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io |
            | API | https://api-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io |
            | Keycloak | https://auth-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io |
            | PowerSync | https://powersync-pr-${{ needs.resolve.outputs.pr_number }}.preview.thunderbolt.io |

            Stack: `preview-pr-${{ needs.resolve.outputs.pr_number }}` · Commit: `${{ needs.resolve.outputs.head_sha }}`

            Destroyed when the PR closes (fork previews by the hourly cleanup). Login via the bundled Keycloak realm — `demo@thunderbolt.io` / `demo` by default.
