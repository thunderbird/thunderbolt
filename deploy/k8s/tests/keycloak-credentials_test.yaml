suite: Bundled Keycloak credentials
templates:
  - templates/keycloak.yaml
  - templates/configmaps.yaml
  - templates/secrets.yaml
set:
  backend.betterAuthSecretBase64: dGVzdA==
  keycloak.admin.password: CANARY-ADMIN-PW
  # base64 of CANARY-CLIENT-SECRET
  keycloak.oidc.clientSecretBase64: Q0FOQVJZLUNMSUVOVC1TRUNSRVQ=
tests:
  # Anyone allowed to read Deployments or ConfigMaps but not Secrets must not
  # see the Keycloak admin password or the client secret.
  - it: reads the admin password and client secret from the Secret
    template: templates/keycloak.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom: { secretKeyRef: { name: thunderbolt-secrets, key: keycloak-admin-password } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: THUNDERBOLT_OIDC_CLIENT_SECRET
            valueFrom: { secretKeyRef: { name: thunderbolt-secrets, key: keycloak-client-secret } }
      - notExists:
          path: 'spec.template.spec.containers[*].env[?(@.value == "CANARY-ADMIN-PW")]'
      - notExists:
          path: 'spec.template.spec.containers[*].env[?(@.value == "CANARY-CLIENT-SECRET")]'

  - it: leaves only a placeholder for the client secret in the realm ConfigMap
    template: templates/configmaps.yaml
    documentSelector: { path: metadata.name, value: keycloak-realm }
    asserts:
      - matchRegex:
          path: data["thunderbolt-realm.json"]
          pattern: '"secret": "\$\{THUNDERBOLT_OIDC_CLIENT_SECRET\}"'
      - notMatchRegex:
          path: data["thunderbolt-realm.json"]
          pattern: CANARY-CLIENT-SECRET|CANARY-ADMIN-PW

  - it: stores both credentials in the Secret
    template: templates/secrets.yaml
    asserts:
      # base64 of CANARY-ADMIN-PW
      - equal: { path: 'data["keycloak-admin-password"]', value: Q0FOQVJZLUFETUlOLVBX }
      - equal: { path: 'data["keycloak-client-secret"]', value: Q0FOQVJZLUNMSUVOVC1TRUNSRVQ= }

  # oidc-client-secret holds the external provider's secret here, so Keycloak
  # needs a key of its own or it would import that secret instead.
  - it: keeps the bundled client secret apart from an external provider's
    template: templates/secrets.yaml
    set:
      oidc.issuer: https://idp.example.com
      oidc.clientId: external-client
      oidc.clientSecretBase64: ZXh0ZXJuYWwtc2VjcmV0
    asserts:
      - equal: { path: 'data["keycloak-client-secret"]', value: Q0FOQVJZLUNMSUVOVC1TRUNSRVQ= }
      - equal: { path: 'data["oidc-client-secret"]', value: ZXh0ZXJuYWwtc2VjcmV0 }

  - it: stores no Keycloak credentials when Keycloak is disabled
    template: templates/secrets.yaml
    set:
      keycloak.enabled: false
      oidc.issuer: https://idp.example.com
      oidc.clientId: external-client
      oidc.clientSecretBase64: ZXh0ZXJuYWwtc2VjcmV0
    asserts:
      - notExists: { path: 'data["keycloak-admin-password"]' }
      - notExists: { path: 'data["keycloak-client-secret"]' }

  # `helm upgrade --reuse-values` on an install older than oidc and
  # keycloak.enabled: the Secret must still carry what the Deployment reads.
  - it: stores both credentials when an upgrade predates oidc and keycloak.enabled
    template: templates/secrets.yaml
    set:
      oidc: null
      keycloak.enabled: null
    asserts:
      - equal: { path: 'data["keycloak-admin-password"]', value: Q0FOQVJZLUFETUlOLVBX }
      - equal: { path: 'data["keycloak-client-secret"]', value: Q0FOQVJZLUNMSUVOVC1TRUNSRVQ= }
